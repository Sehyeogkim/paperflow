<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperFlow — 암묵지 그래프 데모</title>
<style>
  :root{
    --bg:#0F1115; --panel:#15181E; --border:#252A33;
    --text:#E6E4DF; --muted:#8A8F99;
    --blue:#6E9BD1; --code:#D9A441; --terra:#CC785C; --amber:#C9973F;
    --empty:#3A3F49; --emptyStroke:#5A616E; --wedgeTxt:#C98B7A;
    --neg:#C25744; --pos:#7A9A6D;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Apple SD Gothic Neo', 'Malgun Gothic', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size:15px; line-height:1.65;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------------- header ---------------- */
  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 20px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;color:var(--text);}
  header .sub{font-size:14px;color:var(--muted);}
  header .spacer{flex:1;}

  button{font-family:inherit;font-size:15px;cursor:pointer;}
  .btn{
    border:1px solid var(--border); background:#1C2028; color:var(--text);
    border-radius:8px; padding:8px 14px; font-weight:600;
  }
  .btn:hover{background:#232833;border-color:#39404C;}
  .btn.primary{background:var(--terra);border-color:var(--terra);color:#14161A;}
  .btn.primary:hover{background:#dc8a6e;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);text-decoration:underline;padding:8px 6px;font-weight:500;}
  .btn.big{font-size:16px;padding:12px 16px;font-weight:700;}
  .btn:disabled{opacity:.38;cursor:not-allowed;}
  .btn:disabled:hover{background:#1C2028;border-color:var(--border);}

  /* ---------------- layout ---------------- */
  .layout{flex:1;display:flex;min-height:0;}
  .left{flex:1;min-width:0;display:flex;flex-direction:column;}
  .right{
    width:430px;flex:0 0 430px;border-left:1px solid var(--border);
    background:var(--panel);display:flex;flex-direction:column;min-height:0;
  }

  /* counter bar */
  .counterbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px 18px;border-bottom:1px solid var(--border);background:#12151A;
  }
  .pill{display:inline-flex;align-items:baseline;gap:8px;border-radius:999px;padding:5px 15px;font-weight:700;font-size:14px;}
  .pill .n{font-size:21px;font-weight:800;line-height:1;}
  .pill.blue{background:rgba(110,155,209,.16);color:var(--blue);border:1px solid rgba(110,155,209,.4);}
  .pill.gray{background:rgba(138,143,153,.12);color:var(--muted);border:1px dashed var(--emptyStroke);}
  .pill.gray.done{background:rgba(204,120,92,.18);color:var(--terra);border:1px solid var(--terra);}
  .dot{color:#39404C;font-weight:700;}
  .prog{display:flex;align-items:center;gap:9px;min-width:180px;flex:1;max-width:340px;}
  .prog .lbl{font-size:13.5px;color:var(--muted);white-space:nowrap;font-weight:600;}
  .bar{flex:1;height:7px;background:#20242C;border:1px solid var(--border);border-radius:999px;overflow:hidden;min-width:90px;}
  .bar i{display:block;height:100%;width:0;background:var(--terra);transition:width .35s ease;}
  .legend{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);margin-left:auto;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}

  /* svg */
  .svgwrap{flex:1;min-height:0;padding:4px 6px 8px;}
  svg#graph{display:block;width:100%;height:100%;}
  .node{cursor:pointer;}
  .node circle.dot{transition:stroke-width .12s, stroke .12s;}
  .node:hover circle.dot{stroke:#FFFFFF;stroke-width:3;}
  .node:hover text.lab{fill:#FFFFFF;}
  .node text{pointer-events:none;user-select:none;}

  /* ---------------- right panel ---------------- */
  nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:#12151A;flex:0 0 auto;}
  nav.tabs button{
    flex:1;border:none;border-bottom:2px solid transparent;background:transparent;
    color:var(--muted);font-weight:700;padding:11px 6px;font-size:15px;
  }
  nav.tabs button:hover{color:var(--text);background:#181C23;}
  nav.tabs button.active{color:var(--terra);border-bottom-color:var(--terra);background:#181C23;}

  .pane{display:none;padding:18px;overflow-y:auto;flex:1;min-height:0;}
  .pane.active{display:block;}

  .ph{color:var(--muted);font-size:15px;line-height:1.8;}
  .ph .big{font-size:17px;color:var(--text);font-weight:700;display:block;margin-bottom:10px;}
  .chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px;margin:0 6px 8px 0;}
  .chip.kind{background:rgba(204,120,92,.16);color:var(--terra);border:1px solid rgba(204,120,92,.45);}
  .chip.kind.l1{background:rgba(110,155,209,.14);color:var(--blue);border:1px solid rgba(110,155,209,.4);}
  .chip.kind.l1.code{background:rgba(217,164,65,.14);color:var(--code);border-color:rgba(217,164,65,.45);}
  .chip.id{background:#20242C;color:var(--muted);border:1px solid var(--border);}
  .chip.risk{background:rgba(194,87,68,.16);color:#E58573;border:1px solid rgba(194,87,68,.55);}
  .chip.ex{background:rgba(201,151,63,.16);color:var(--amber);border:1px solid rgba(201,151,63,.55);}
  .p-title{font-size:18px;font-weight:700;color:var(--text);line-height:1.55;margin:4px 0 14px;}
  .p-q{font-size:19px;font-weight:800;color:var(--text);line-height:1.6;margin:2px 0 16px;letter-spacing:-.2px;}
  .p-lbl{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin:16px 0 6px;}
  .p-body{font-size:15px;line-height:1.75;color:#CFCDC8;}
  .quote{
    background:#101318;border-left:3px solid #39404C;border-radius:0 8px 8px 0;
    padding:11px 13px;color:var(--muted);font-size:13.5px;line-height:1.7;
    font-family:var(--mono);white-space:pre-wrap;word-break:break-word;
  }
  textarea{
    width:100%;font-family:inherit;font-size:15px;line-height:1.7;color:var(--text);
    border:1px solid #333A45;border-radius:9px;padding:10px 11px;background:#0E1116;resize:vertical;
  }
  textarea::placeholder{color:#5E646E;}
  textarea:focus{outline:none;border-color:var(--terra);}
  .flbl{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .saved{background:rgba(204,120,92,.10);border:1px solid rgba(204,120,92,.55);border-radius:9px;
         padding:12px 14px;font-size:15px;line-height:1.75;white-space:pre-wrap;color:var(--text);}
  .saved.ex{background:rgba(201,151,63,.09);border-color:rgba(201,151,63,.55);}
  .saved .fk{color:var(--muted);font-weight:700;font-size:13px;display:block;margin-top:9px;}
  .saved .fk:first-child{margin-top:0;}

  /* eval tab */
  .scenrow{display:flex;gap:7px;margin-bottom:12px;}
  .scenrow button{
    flex:1;border:1px solid var(--border);background:#1C2028;color:var(--muted);
    border-radius:8px;padding:9px 4px;font-weight:700;font-size:14px;
  }
  .scenrow button:hover{color:var(--text);border-color:#39404C;}
  .scenrow button.active{background:rgba(204,120,92,.16);border-color:var(--terra);color:var(--terra);}
  .scenbody{background:#101318;border:1px solid var(--border);border-radius:10px;padding:13px 15px;
            font-size:15px;line-height:1.75;color:#CFCDC8;}
  .scenbody .qtitle{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin-bottom:7px;}
  .abrow{display:flex;gap:9px;margin:14px 0 8px;}
  .abrow .btn{flex:1;}
  .btn.aBtn{background:#1C2028;border-color:#3B4450;color:#B8C6D6;}
  .btn.aBtn:hover{background:#232A34;}
  .btn.bBtn{background:var(--terra);border-color:var(--terra);color:#14161A;}
  .btn.bBtn:hover{background:#dc8a6e;}
  .warn{font-size:13.5px;color:var(--amber);margin:2px 0 8px;}
  .pmeta{font-size:13px;color:var(--muted);margin:8px 0 6px;font-family:var(--mono);}
  pre.prev{
    background:#0B0D11;border:1px solid var(--border);border-radius:10px;
    padding:13px 14px;color:#9FA6B2;font-size:12.5px;line-height:1.65;
    font-family:var(--mono);max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0;
  }
  details.ab{margin-top:20px;border:1px solid var(--border);border-radius:10px;background:#101318;}
  details.ab>summary{
    cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;color:var(--muted);list-style:none;
  }
  details.ab>summary::-webkit-details-marker{display:none;}
  details.ab>summary::before{content:'▸ ';color:var(--terra);}
  details.ab[open]>summary::before{content:'▾ ';}
  details.ab>summary:hover{color:var(--text);}
  .abin{padding:0 14px 16px;}
  .abq{font-size:15.5px;font-weight:700;line-height:1.7;color:var(--text);
       border-left:3px solid var(--terra);padding-left:11px;margin-bottom:14px;}
  .abcol{border:1px solid var(--border);border-radius:9px;padding:13px 14px;margin-bottom:12px;}
  .abcol.plain{background:#0E1116;}
  .abcol.acc{background:rgba(204,120,92,.06);border-color:rgba(204,120,92,.45);}
  .abcol h4{margin:0 0 10px;font-size:14.5px;font-weight:800;color:var(--text);}
  .abcol.plain h4{color:var(--muted);}
  .abcol p{margin:0 0 10px;font-size:14px;line-height:1.8;color:#C4C2BD;}
  .abcol mark{background:rgba(204,120,92,.30);color:var(--text);border-radius:3px;padding:1px 3px;font-weight:600;}
  .cchip{display:inline-block;background:rgba(204,120,92,.2);color:var(--terra);border:1px solid rgba(204,120,92,.5);
         font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin:0 5px 5px 0;}
  .citebar{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;}
  .citebar .l{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px;}
  .abnote{font-size:13px;color:var(--muted);background:#0E1116;border:1px dashed var(--border);
          border-radius:8px;padding:10px 12px;line-height:1.7;margin-top:10px;}
  .abclosing{font-size:14.5px;line-height:1.8;color:var(--text);background:rgba(204,120,92,.07);
             border:1px solid rgba(204,120,92,.35);border-radius:8px;padding:12px 14px;margin-top:10px;}
  table.run{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  table.run th,table.run td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.6;color:#C4C2BD;}
  table.run th{color:var(--muted);font-weight:600;white-space:nowrap;width:26%;}
  table.run thead th{color:var(--text);font-weight:700;border-bottom:1px solid #39404C;}
  table.run code{background:#0B0D11;color:var(--code);padding:1px 5px;border-radius:4px;font-size:12px;font-family:var(--mono);}
  .cav{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.7;border-top:1px dashed var(--border);padding-top:9px;}

  /* script tab */
  .sblock{margin-bottom:22px;}
  .sblock h3{font-size:12px;font-weight:800;letter-spacing:.9px;color:var(--muted);
             text-transform:uppercase;margin:0 0 10px;}
  .sline{background:#101318;border:1px solid var(--border);border-left:3px solid var(--terra);
         border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:9px;font-size:15.5px;line-height:1.8;}
  .sline b{color:var(--terra);font-weight:800;margin-right:8px;}
  .pb{border:1px solid var(--border);border-radius:9px;padding:11px 14px;margin-bottom:9px;background:#0E1116;}
  .pb .q{font-size:14.5px;font-weight:700;color:var(--amber);line-height:1.65;margin-bottom:6px;}
  .pb .a{font-size:14.5px;line-height:1.8;color:#C4C2BD;}
  .sclosing{background:rgba(204,120,92,.10);border:1px solid var(--terra);border-radius:11px;
            padding:18px 20px;font-size:18px;font-weight:700;line-height:1.7;color:var(--text);}

  /* toast */
  #toast{
    position:fixed;right:22px;bottom:22px;background:var(--terra);color:#14161A;
    font-weight:800;font-size:15px;padding:11px 20px;border-radius:9px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
  }
  #toast.show{opacity:1;}
  #copySink{position:fixed;left:-9999px;top:0;opacity:0;}
</style>
</head>
<body>

<header>
  <h1>PaperFlow</h1>
  <span class="sub">논문에서 뽑을 수 있는 것 / 저자만 아는 것</span>
  <span class="spacer"></span>
  <button class="btn" id="fillAll">전부 예시로 채우기</button>
  <button class="btn ghost" id="resetAll">초기화</button>
</header>

<div class="layout">
  <div class="left">
    <div class="counterbar">
      <span class="pill blue"><span class="n" id="cFilled">0</span>채워짐</span>
      <span class="dot">·</span>
      <span class="pill gray" id="pillEmpty"><span class="n" id="cEmpty">0</span>비어있음</span>
      <span class="dot">·</span>
      <span class="prog">
        <span class="lbl">진행 <span id="cProg">0/0</span></span>
        <span class="bar"><i id="barFill"></i></span>
      </span>
      <span class="legend">
        <span><i style="background:#6E9BD1"></i>논문</span>
        <span><i style="background:#D9A441"></i>코드</span>
        <span><i style="background:#3A3F49;border:1px dashed #5A616E"></i>저자만 앎</span>
        <span><i style="background:#CC785C"></i>채워짐</span>
      </span>
    </div>
    <div class="svgwrap" id="svgbox"></div>
  </div>

  <aside class="right">
    <nav class="tabs" id="tabsNav">
      <button data-pane="node" class="active">노드</button>
      <button data-pane="eval">평가</button>
      <button data-pane="script">진행</button>
    </nav>

    <section class="pane active" id="paneNode">
      <div id="detail"></div>
    </section>

    <section class="pane" id="paneEval">
      <div class="scenrow" id="scenRow"></div>
      <div class="scenbody" id="scenBody"></div>
      <div class="abrow">
        <button class="btn big aBtn" id="btnA">A · 논문만 복사</button>
        <button class="btn big bBtn" id="btnB">B · 그래프 복사</button>
      </div>
      <div class="warn" id="bWarn"></div>
      <div class="pmeta" id="promptMeta">버튼을 누르면 프롬프트가 만들어지고 클립보드에 복사됩니다.</div>
      <pre class="prev" id="promptPre"></pre>
      <div id="abBox"></div>
    </section>

    <section class="pane" id="paneScript">
      <div id="scriptBody"></div>
    </section>
  </aside>
</div>

<div id="toast">복사됨 ✓</div>
<textarea id="copySink" readonly></textarea>

<script>
// 데이터 교체 안내: 아래 두 마커 쌍 사이의 객체를 통째로 갈아끼우면 됩니다.
const GRAPH = /*__GRAPH_JSON__*/
{
  "meta": {
    "paper": {
      "title": "Single-atom level determination of 3-dimensional surface atomic structure via neural network-assisted atomic electron tomography",
      "authors": "Juhyeok Lee, Chaehwa Jeong, Yongsoo Yang",
      "venue": "Nature Communications 12, 1962 (2021)",
      "doi": "10.1038/s41467-021-22204-1",

    },
    "schema": "tacit_pack.yaml",
    "canvas": {
      "width": 1320,
      "height": 1000,
      "cx": 660,

        "a0": 28,

      }
    },
    "divider_label": "논문에도 코드에도 없는 층 — 저자만 채울 수 있음",
    "hub": {
      "title": "AET + DL augmentation",
      "sub": "Nat. Commun. 12, 1962 (2021)"
    }
  },
  "nodes": [
    {

      "kind": "claim",

      "detail": "논문의 main contribution. Pt 나노입자를 모델 시스템으로, 개별 원자 수준의 3D 표면 구조를 재현성 있게 결정.",

      "layer": 1,
      "x": 453,
      "y": 321,
      "text": "3D-Unet DL augmentation",
      "detail": "GENFIRE 재구성 뒤에 후처리 단계로 삽입되는 3D-Unet. 인공물(missing wedge, 투영 부족, 노이즈)이 있는 tomogram을 입력으로, 순수한 3D 원자 퍼텐셜을 출력하도록 학습.",
      "provenance": "paper:Results — Deep learning approach, Fig.1",
      "angle": 215.7,
      "radius": 255,
      "label_side": "left"
    },
    {
      "id": "M2",
      "kind": "method",
      "layer": 1,
      "x": 569,
      "y": 292,
      "text": "학습데이터 생성 4단계",

      "y": 215,

      "detail": "실험 데이터는 GENFIRE 기반 angular refinement와 spatial re-alignment를 먼저 수행한 뒤 최종 재구성. 이후 upsampling/binning으로 salt-pepper 노이즈 제거, 학습 tomogram과 강도 스케일을 맞추는 scale factor 적용.",
      "provenance": "paper:Methods — Image post-processing, GENFIRE reconstruction",
      "angle": 270.0,
      "radius": 255,
      "label_side": "left"
    },
    {
      "id": "M4",
      "kind": "method",
      "layer": 1,
      "x": 751,
      "y": 292,
      "text": "Atom tracing",
      "detail": "3D tomogram의 모든 국소 최대값을 강도 내림차순 정렬 → 각 점 중심 5×5×5 voxel crop → 3D Gaussian fit → 이미 채택된 원자들과의 거리가 모두 1.8 Å보다 클 때만 원자로 채택. 이후 비편향 분류로 실제 Pt 원자와 인공물 구분.",
      "provenance": "paper:Methods — Identification of 3D atomic coordinates",

      "radius": 200,
      "label_side": "right"
    },
    {
      "id": "M5",
      "kind": "method",
      "layer": 1,
      "x": 867,

function esc(s){

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

  const a = answers[id];

function answerPlain(n, indent){
  const a = answers[n.id];
  if(!a) return '';
  const pad = indent || '';
  if(a.fields){
    const out = [];
    PF_FIELDS.forEach(f => {
      const v = a.fields[f[0]];
      if(v && String(v).trim()) out.push(pad + '- ' + f[1] + ': ' + String(v).trim());
    });
    return out.join('\n');
  }
  return pad + String(a.text || '').trim();
}

/* ---- 글자폭 근사 (SVG 라벨 자르기용) ---- */
function unitW(ch){
  const c = ch.codePointAt(0);
  if(c > 0x1100) return 1.0;                       // CJK / 한글 / 전각
  if('iljItfr.,()[]|!:; '.indexOf(ch) >= 0) return 0.36;
  return 0.56;
}
function strW(s){ let w = 0; for(const ch of String(s)) w += unitW(ch); return w; }
function truncW(s, maxUnits){
  const str = String(s == null ? '' : s);
  if(strW(str) <= maxUnits) return str;
  let out = '';
  for(const ch of str){
    if(strW(out + ch + '…') > maxUnits) break;
    out += ch;
  }
  return (out || str.charAt(0)) + '…';
}

      if(v > n.y + LABEL_MAX_DRIFT) v = n.y + LABEL_MAX_DRIFT;
      if(v < n.y - LABEL_MAX_DRIFT) v = n.y - LABEL_MAX_DRIFT;
      labelY[n.id] = v;
    });
  });
}

/* ================= SVG 렌더 ================= */
const R1 = 11, R2 = 10, RHUB = 90;
const BADGE_W = 42, BADGE_H = 19;
const WEDGE_LBL_FS = 22, WEDGE_LBL_LS = 7, WEDGE_LBL_DY = 32;

function polar(cx, cy, r, deg){
  const a = deg * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function nodeR(n){ return n.layer === 1 ? R1 : R2; }
function labelFont(n){ return n.layer === 1 ? 18 : 17.5; }
function labelText(n){ return truncW(n.text, LABEL_MAX_UNITS); }
function labelYOf(n){ return labelY[n.id] != null ? labelY[n.id] : n.y; }

/* 라벨 상자 [x0,y0,x1,y1] */
function labelBox(n){
  const fs = labelFont(n), w = strW(labelText(n)) * fs, y = labelYOf(n);
  return (n.label_side === 'left')
    ? [n.x - 18 - w, y - fs * 0.6, n.x - 18, y + fs * 0.6]
    : [n.x + 18, y - fs * 0.6, n.x + 18 + w, y + fs * 0.6];
}
/* 「예시」 배지는 라벨 반대편에 둔다 (라벨과 절대 겹치지 않게) */
function badgeBox(n){
  const r = nodeR(n);
  const x0 = (n.label_side === 'left') ? (n.x + r + 6) : (n.x - r - 6 - BADGE_W);
  const y0 = n.y - BADGE_H / 2;
  return [x0, y0, x0 + BADGE_W, y0 + BADGE_H];
}

/* 내용 실제 범위로 viewBox를 잡아 화면을 최대한 채운다 (투사 가독성) */
let VIEWBOX = '0 0 1320 1000';
function computeViewBox(){
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  function acc(x0, y0, x1, y1){
    if(x0 < minx) minx = x0;
    if(y0 < miny) miny = y0;
    if(x1 > maxx) maxx = x1;
    if(y1 > maxy) maxy = y1;
  }
  NODES.forEach(n => {
    const r = nodeR(n);
    acc(n.x - r, n.y - r, n.x + r, n.y + r);
    const lb = labelBox(n); acc(lb[0], lb[1], lb[2], lb[3]);
    if(n.layer === 2){ const bb = badgeBox(n); acc(bb[0], bb[1], bb[2], bb[3]); }
  });
  const cx = CANVAS.cx, cy = CANVAS.cy;
  acc(cx - RHUB, cy - RHUB, cx + RHUB, cy + RHUB);
  [WEDGE.a0, WEDGE.a1, (WEDGE.a0 + WEDGE.a1) / 2].forEach(a => {
    const p = polar(cx, cy, WEDGE.r, a); acc(p[0], p[1], p[0], p[1]);
  });
  const wtxt = String(WEDGE.label || '');
  const wlw = strW(wtxt) * WEDGE_LBL_FS + wtxt.length * WEDGE_LBL_LS;
  const wly = cy + WEDGE.r + WEDGE_LBL_DY;
  acc(cx - wlw / 2, wly - WEDGE_LBL_FS, cx + wlw / 2, wly + 8);
  const M = 14;
  VIEWBOX = (minx - M).toFixed(1) + ' ' + (miny - M).toFixed(1) + ' '
          + (maxx - minx + 2 * M).toFixed(1) + ' ' + (maxy - miny + 2 * M).toFixed(1);
}
function wedgePath(cx, cy, r, a0, a1){
  const p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return 'M ' + cx + ' ' + cy
       + ' L ' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1)
       + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1)
       + ' Z';
}
function arrowMarker(id, color){
  return '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" '
       + 'markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">'
       + '<path d="M0,1 L10,5 L0,9 z" fill="' + color + '"/></marker>';
}
function edgeGeom(a, b, ra, rb){
  const dx = b.x - a.x, dy = b.y - a.y;
  const L = Math.sqrt(dx*dx + dy*dy) || 1;
  const ux = dx / L, uy = dy / L;
  return [
    a.x + ux * (ra + 3), a.y + uy * (ra + 3),
    b.x - ux * (rb + 8), b.y - uy * (rb + 8)
  ];
}

function renderGraph(){
  const cx = CANVAS.cx, cy = CANVAS.cy;

  let s = '<svg id="graph" viewBox="' + VIEWBOX + '" preserveAspectRatio="xMidYMid meet" '
        + 'xmlns="http://www.w3.org/2000/svg" '
        + 'font-family="ui-monospace, SF Mono, Menlo, Consolas, Apple SD Gothic Neo, Malgun Gothic, monospace">';

  s += '<defs>'
     + arrowMarker('ar-g', '#5A6472')
     + arrowMarker('ar-m', '#454C58')
     + arrowMarker('ar-a', '#CC785C')
     + '</defs>';

  /* 1) 부채꼴 (맨 뒤) */
  s += '<path d="' + wedgePath(cx, cy, WEDGE.r, WEDGE.a0, WEDGE.a1) + '" '
     + 'fill="#CC785C" fill-opacity="0.06" stroke="#CC785C" stroke-opacity="0.20" stroke-width="1.2"/>';
  s += '<text x="' + cx + '" y="' + (cy + WEDGE.r + WEDGE_LBL_DY) + '" text-anchor="middle" '
     + 'font-size="' + WEDGE_LBL_FS + '" font-weight="700" letter-spacing="' + WEDGE_LBL_LS
     + '" fill="#C98B7A" opacity="0.9">'
     + esc(String(WEDGE.label || '').toUpperCase()) + '</text>';

  /* 2) 허브 스포크 (모든 노드) */
  NODES.forEach(n => {
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + n.x + '" y2="' + n.y
       + '" stroke="#5A6472" stroke-width="1" opacity="0.18"/>';
  });

  /* 3) 실제 엣지 */
  EDGES.forEach(e => {
    const a = byId[e.src], b = byId[e.dst];
    if(!a || !b) return;
    const live = (a.layer === 2 && isAnswered(a.id)) || (b.layer === 2 && isAnswered(b.id));
    let stroke, dash, op, mk, wgt;
    if(live){ stroke = '#CC785C'; dash = ''; op = 0.95; mk = 'ar-a'; wgt = 1.9; }
    else if(e.grounding_status === 'missing'){ stroke = '#454C58'; dash = ' stroke-dasharray="6 6"'; op = 0.55; mk = 'ar-m'; wgt = 1.2; }
    else { stroke = '#5A6472'; dash = ''; op = 0.75; mk = 'ar-g'; wgt = 1.3; }
    const p = edgeGeom(a, b, nodeR(a), nodeR(b));
    s += '<line x1="' + p[0].toFixed(1) + '" y1="' + p[1].toFixed(1)
       + '" x2="' + p[2].toFixed(1) + '" y2="' + p[3].toFixed(1)
       + '" stroke="' + stroke + '" stroke-width="' + wgt + '" opacity="' + op + '"' + dash
       + ' marker-end="url(#' + mk + ')"><title>' + esc(e.rel + ' — ' + (e.rationale || '')) + '</title></line>';
  });

  /* 4) 허브 */
  s += '<g><circle cx="' + cx + '" cy="' + cy + '" r="' + RHUB + '" fill="#171B22" stroke="#39404C" stroke-width="1.6"/>'
     + '<text x="' + cx + '" y="' + (cy - 5) + '" text-anchor="middle" font-size="14.5" font-weight="700" fill="#E6E4DF">'
     + esc(HUB.title || '') + '</text>'
     + '<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" font-size="11" fill="#8A8F99">'
     + esc(HUB.sub || '') + '</text></g>';

  /* 5) 노드 */
  NODES.forEach(n => s += renderNode(n));

  s += '</svg>';
  document.getElementById('svgbox').innerHTML = s;

  const box = document.getElementById('svgbox');
  box.querySelectorAll('.node').forEach(g => {
    g.addEventListener('click', () => selectNode(g.getAttribute('data-id')));
  });
}

function renderNode(n){
  const r = nodeR(n);
  const side = (n.label_side === 'left') ? 'left' : 'right';
  const lx = side === 'right' ? (n.x + 18) : (n.x - 18);
  const anchor = side === 'right' ? 'start' : 'end';
  const ly = labelYOf(n);

  let fill, stroke, sw, dash, labFill, mark = '', badge = '';
  const fs = labelFont(n);

  if(n.layer === 1){
    fill = (n.kind === 'code') ? '#D9A441' : '#6E9BD1';
    stroke = (n.kind === 'code') ? '#B4842F' : '#4E76A6';
    sw = 1.4; dash = ''; labFill = '#E6E4DF';
  } else if(!isAnswered(n.id)){
    fill = '#3A3F49'; stroke = '#5A616E'; sw = 1.6; dash = ' stroke-dasharray="3.5 3"';
    labFill = '#8A8F99';
    mark = '<text x="' + n.x + '" y="' + (n.y + 4.5) + '" text-anchor="middle" font-size="13" '
         + 'font-weight="800" fill="#C2C7D0">?</text>';
  } else if(isExampleFilled(n.id)){
    fill = '#CC785C'; stroke = '#C9973F'; sw = 2; dash = ''; labFill = '#E6E4DF';
    mark = '<text x="' + n.x + '" y="' + (n.y + 4.2) + '" text-anchor="middle" font-size="12" '
         + 'font-weight="800" fill="#14161A">✓</text>';
    const bb = badgeBox(n);
    badge = '<rect x="' + bb[0].toFixed(1) + '" y="' + bb[1].toFixed(1) + '" width="' + BADGE_W
          + '" height="' + BADGE_H + '" rx="' + (BADGE_H / 2) + '" fill="#C9973F"/>'
          + '<text x="' + (bb[0] + BADGE_W / 2).toFixed(1) + '" y="' + (bb[1] + 14).toFixed(1)
          + '" text-anchor="middle" font-size="13" font-weight="800" fill="#14161A">예시</text>';
  } else {
    fill = '#CC785C'; stroke = '#A85C42'; sw = 1.6; dash = ''; labFill = '#E6E4DF';
    mark = '<text x="' + n.x + '" y="' + (n.y + 4.2) + '" text-anchor="middle" font-size="12" '
         + 'font-weight="800" fill="#14161A">✓</text>';
  }

  let out = '<g class="node" data-id="' + esc(n.id) + '">';
  out += '<title>' + esc(n.text) + '</title>';
  if(selectedId === n.id){
    out += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + (r + 7) + '" fill="none" '
         + 'stroke="#E6E4DF" stroke-width="1.5" opacity="0.9"/>';
  }
  out += '<circle class="dot" cx="' + n.x + '" cy="' + n.y + '" r="' + r + '" fill="' + fill
       + '" stroke="' + stroke + '" stroke-width="' + sw + '"' + dash + '/>';
  out += mark + badge;
  out += '<text class="lab" x="' + lx + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor
       + '" dominant-baseline="middle" font-size="' + fs + '" font-weight="'
       + (n.layer === 1 ? 600 : 500) + '" fill="' + labFill + '">'
       + esc(labelText(n)) + '</text>';
  out += '</g>';
  return out;
}

/* ================= 카운터 ================= */
function updateCounters(){
  const done = L2.filter(n => isAnswered(n.id)).length;
  const empty = L2.length - done;
  document.getElementById('cFilled').textContent = L1.length + done;
  document.getElementById('cEmpty').textContent = empty;
  document.getElementById('cProg').textContent = done + '/' + L2.length;
  document.getElementById('barFill').style.width = (L2.length ? (done / L2.length * 100) : 0) + '%';
  document.getElementById('pillEmpty').classList.toggle('done', empty === 0 && L2.length > 0);
}

function renderPanel(){

function renderPanelL1(el, n){
  const codeCls = (n.kind === 'code') ? ' code' : '';
  let h = '';
  h += '<div><span class="chip kind l1' + codeCls + '">' + esc(KIND_KO[n.kind] || n.kind) + '</span>'
     + '<span class="chip id">' + esc(n.id) + '</span></div>';
  h += '<div class="p-title">' + esc(n.text) + '</div>';
  if(n.detail) h += '<div class="p-lbl">내용</div><div class="p-body">' + esc(n.detail) + '</div>';
  if(n.provenance) h += '<div class="p-lbl">출처</div><div class="p-body" style="color:#8A8F99;font-size:13.5px">'
     + esc(n.provenance) + '</div>';
  el.innerHTML = h;
}

function renderPanelL2(el, n){
  const a = answers[n.id];
  const answered = isAnswered(n.id);
  const editing = !answered || editingId === n.id;

  let h = '';
  h += '<div><span class="chip kind">' + esc(KIND_KO[n.kind] || n.kind) + '</span>';
  if(n.risk === 'high') h += '<span class="chip risk">리스크 높음</span>';
  if(answered && a.isExample) h += '<span class="chip ex">예시로 채움</span>';
  h += '<span class="chip id">' + esc(n.id) + '</span></div>';

  h += '<div class="p-q">' + esc(n.question || n.text) + '</div>';
  if(n.why_it_matters) h += '<div class="p-lbl">왜 필요한가</div><div class="p-body">' + esc(n.why_it_matters) + '</div>';
  if(n.paper_says) h += '<div class="p-lbl">논문이 말하는 데까지</div><div class="quote">' + esc(n.paper_says) + '</div>';

  h += '<div class="p-lbl">저자 답변</div>';

  if(!editing){
    if(isPitfall(n)){
      let inner = '';
      PF_FIELDS.forEach(f => {
        const v = a.fields ? a.fields[f[0]] : '';
        if(v && String(v).trim()){
          inner += '<span class="fk">' + esc(f[1]) + '</span>' + esc(String(v).trim());
        }
      });
      h += '<div class="saved' + (a.isExample ? ' ex' : '') + '">' + inner + '</div>';
    } else {
      h += '<div class="saved' + (a.isExample ? ' ex' : '') + '">' + esc(a.text) + '</div>';
    }
    h += '<div class="btnrow"><button class="btn primary" data-act="edit">수정</button>'
       + '<button class="btn" data-act="clear">지우기</button></div>';
  } else if(isPitfall(n)){
    const cur = (a && a.fields) ? a.fields : {};
    PF_FIELDS.forEach((f, i) => {
      const ph = (i === 0) ? (n.example || '') : '';
      h += '<div class="flbl">' + esc(f[1]) + (i === 0 ? ' <span style="color:#CC785C">*</span>' : '') + '</div>'
         + '<textarea data-field="' + f[0] + '" rows="' + (i === 0 ? 3 : 2) + '" placeholder="' + esc(ph) + '">'
         + esc(cur[f[0]] || '') + '</textarea>';
    });
    h += '<div class="btnrow"><button class="btn primary" data-act="save">저장</button>'
       + '<button class="btn" data-act="example">예시로 채우기</button>'
       + '<button class="btn" data-act="clear">지우기</button></div>';
  } else {
    const cur = (a && a.text) ? a.text : '';
    h += '<textarea data-field="text" rows="5" placeholder="' + esc(n.example || '') + '">' + esc(cur) + '</textarea>';
    h += '<div class="btnrow"><button class="btn primary" data-act="save">저장</button>'
       + '<button class="btn" data-act="example">예시로 채우기</button>'
       + '<button class="btn" data-act="clear">지우기</button></div>';
  }

  el.innerHTML = h;
  wirePanel(el, n);
}

function wirePanel(el, n){
  el.querySelectorAll('textarea').forEach(t => {
    t.addEventListener('input', () => { pendingExample = false; });
  });
  el.querySelectorAll('button[data-act]').forEach(b => {
    b.addEventListener('click', () => {
      const act = b.getAttribute('data-act');
      if(act === 'edit'){
        editingId = n.id;
        renderPanel();
        const f = document.getElementById('detail').querySelector('textarea');
        if(f) f.focus();
        return;
      }
      if(act === 'clear'){
        delete answers[n.id];
        editingId = null;
        pendingExample = false;
        commit();
        return;
      }
      if(act === 'example'){
        fillExample(n);
        editingId = null;
        commit();
        return;
      }
      if(act === 'save'){
        if(isPitfall(n)){
          const fields = {};
          el.querySelectorAll('textarea[data-field]').forEach(t => {
            fields[t.getAttribute('data-field')] = t.value.trim();
          });
          if(!fields.symptom){
            const first = el.querySelector('textarea[data-field="symptom"]');
            if(first) first.focus();
            return;
          }
          answers[n.id] = { fields: fields, isExample: pendingExample };
        } else {
          const t = el.querySelector('textarea[data-field="text"]');
          const v = t ? t.value.trim() : '';
          if(!v){ if(t) t.focus(); return; }
          answers[n.id] = { text: v, isExample: pendingExample };
        }
        editingId = null;
        pendingExample = false;
        commit();
      }
    });
  });
}

function fillExample(n){
  const v = String(n.example || '').trim();
  if(!v) return;
  if(isPitfall(n)){
    answers[n.id] = { fields: { symptom: v, cause: '', fix: '', signal: '' }, isExample: true };
  } else {
    answers[n.id] = { text: v, isExample: true };
  }
}

function commit(){
  saveState();
  renderGraph();
  renderPanel();
  updateCounters();
  updateEval();
}

function layer1Block(){

function layer2Block(){
  const done = L2.filter(n => isAnswered(n.id));
  const lines = ['# 저자에게 직접 물어 확보한 정보 (논문·코드에는 없음)'];
  done.forEach(n => {
    lines.push('');
    lines.push('## [' + (KIND_KO[n.kind] || n.kind) + ' / ' + n.id + '] ' + n.text);
    lines.push('질문: ' + (n.question || ''));
    if(isPitfall(n)){
      lines.push('저자 답변:');
      lines.push(answerPlain(n, '  '));
    } else {
      lines.push('저자 답변: ' + answerPlain(n, ''));
    }
  });
  return { text: lines.join('\n'), count: done.length };
}

function buildPrompt(kind){
  const q = currentQuestion();
  const parts = [preamble(), '', layer1Block()];
  let n2 = 0;
  if(kind === 'B'){
    const b = layer2Block();
    n2 = b.count;
    parts.push('', b.text);
  }
  parts.push('', '# 질문', q || '(질문이 비어 있습니다)');
  return { text: parts.join('\n'), nodes2: n2 };
}

function updateEval(){
  const done = L2.filter(n => isAnswered(n.id)).length;
  const btnB = document.getElementById('btnB');
  const warn = document.getElementById('bWarn');
  btnB.disabled = (done === 0);
  warn.textContent = (done === 0) ? '회색 노드를 먼저 채우세요.' : '';
  warn.style.display = (done === 0) ? 'block' : 'none';
  if(lastKind) showPrompt(lastKind, false);
}

function showPrompt(kind, doCopy){
  const built = buildPrompt(kind);
  lastKind = kind;
  document.getElementById('promptPre').textContent = built.text;
  const meta = document.getElementById('promptMeta');
  const n = built.text.length.toLocaleString();
  if(kind === 'A'){
    meta.textContent = 'A · 논문만 — ' + n + '자 · 파란 노드 ' + L1.length + '개';
  } else {
    meta.textContent = 'B · 그래프 — ' + n + '자 · 파란 노드 ' + L1.length + '개 + 회색 노드 ' + built.nodes2 + '개';
  }
  if(doCopy) copyText(built.text);
}

/* ================= 지난 A/B 실행 결과 ================= */
function renderAB(){
  const cites = (AB['with'] && AB['with'].citations) || [];
  let h = '<details class="ab"><summary>지난 실행 결과 (Claude Opus 5, 실측)</summary><div class="abin">';
  h += '<div class="abq">' + esc(AB.question || '') + '</div>';

  h += '<div class="abcol plain"><h4>' + esc((AB.without && AB.without.label) || '') + '</h4>'
     + ((AB.without && AB.without.body) || []).map(t => '<p>' + esc(t) + '</p>').join('')
     + '</div>';

  let rb = ((AB['with'] && AB['with'].body) || []).map(t => {
    let html = esc(t);
    cites.forEach(c => {
      const q = esc(c.quote || '');
      if(q && html.indexOf(q) !== -1) html = html.split(q).join('<mark>' + q + '</mark>');
    });
    return '<p>' + html + '</p>';
  }).join('');
  h += '<div class="abcol acc"><h4>' + esc((AB['with'] && AB['with'].label) || '') + '</h4>' + rb
     + '<div class="citebar"><div class="l">이 답변이 인용한 노드</div>'
     + cites.map(c => '<span class="cchip">' + esc(c.node_id) + '</span>').join('')
     + '</div></div>';

  const r = AB.run;
  if(r){
    const cw = (r.contexts && r.contexts.without) || {};
    const cv = (r.contexts && r.contexts['with']) || {};
    const row = (label, a, b) => '<tr><th>' + esc(label) + '</th><td>' + a + '</td><td>' + b + '</td></tr>';
    h += '<div class="p-lbl">실행 조건</div>';
    h += '<div class="p-body" style="font-size:13px;color:#8A8F99">' + esc(r.method || '') + '</div>';
    h += '<table class="run"><thead><tr><th></th><th>' + esc(cw.label || '왼쪽') + '</th><th>'
       + esc(cv.label || '오른쪽') + '</th></tr></thead><tbody>';
    h += row('모델', '<code>' + esc(r.model || '') + '</code>', '<code>' + esc(r.model || '') + '</code>');
    h += row('컨텍스트', esc(cw.includes || ''), esc(cv.includes || ''));
    h += row('컨텍스트 크기',
             esc(String(cw.chars || '')) + '자 · 노드 ' + esc(String(cw.nodes || '')) + '개',
             esc(String(cv.chars || '')) + '자 · 노드 ' + esc(String(cv.nodes || '')) + '개');
    if(r.tokens){
      h += row('실행 토큰',
               esc(r.tokens.without != null ? r.tokens.without.toLocaleString() : '—'),
               esc(r.tokens['with'] != null ? r.tokens['with'].toLocaleString() : '—'));
    }
    h += '</tbody></table>';
    if(r.caveat) h += '<div class="cav">' + esc(r.caveat) + '</div>';
  }
  if(AB.note) h += '<div class="abnote">' + esc(AB.note) + '</div>';
  if(AB.closing) h += '<div class="abclosing">' + esc(AB.closing) + '</div>';

  h += '</div></details>';
  document.getElementById('abBox').innerHTML = h;
}

/* ================= 진행 탭 ================= */
function renderScript(){
  let h = '';
  h += '<div class="sblock"><h3>말할 것 (3줄)</h3>';
  SCRIPT.lines.forEach((t, i) => {
    h += '<div class="sline"><b>' + (i + 1) + '</b>' + esc(t) + '</div>';
  });
  h += '</div>';

  h += '<div class="sblock"><h3>나올 만한 반문 · 대답</h3>';
  SCRIPT.pushbacks.forEach(p => {
    h += '<div class="pb"><div class="q">' + esc(p.q) + '</div><div class="a">' + esc(p.a) + '</div></div>';
  });
  h += '</div>';

  h += '<div class="sblock"><h3>마지막 질문</h3>'
     + '<div class="sclosing">「' + esc(SCRIPT.closing) + '」</div></div>';
  document.getElementById('scriptBody').innerHTML = h;
}

/* ================= 복사 ================= */
function copyText(txt){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(showOk, () => fallbackCopy(txt));
      return;
    }
  }catch(e){}
  fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.getElementById('copySink');
  ta.removeAttribute('readonly');
  ta.value = txt;
  ta.select();
  try{ ta.setSelectionRange(0, txt.length); }catch(e){}
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  ta.setAttribute('readonly', 'readonly');
  if(ok) showOk();
  return ok;
}
function showOk(){
  const m = document.getElementById('toast');
  m.classList.add('show');
  clearTimeout(showOk._t);
  showOk._t = setTimeout(() => m.classList.remove('show'), 1600);
}

/* ================= 탭 ================= */
function switchPane(key){
  document.querySelectorAll('#tabsNav button').forEach(b =>
    b.classList.toggle('active', b.getAttribute('data-pane') === key));
  document.getElementById('paneNode').classList.toggle('active', key === 'node');
  document.getElementById('paneEval').classList.toggle('active', key === 'eval');
  document.getElementById('paneScript').classList.toggle('active', key === 'script');
}

/* ================= init ================= */
function init(){
  loadState();
  relaxLabels();
  computeViewBox();
  renderGraph();
  renderPanel();
  updateCounters();
  renderScenarios();
  renderScenBody();
  renderAB();
  renderScript();
  updateEval();
  showPrompt('A', false);   // 미리보기를 비워두지 않는다 (복사는 하지 않음)

  document.querySelectorAll('#tabsNav button').forEach(b => {
    b.addEventListener('click', () => switchPane(b.getAttribute('data-pane')));
  });

  document.getElementById('btnA').addEventListener('click', () => showPrompt('A', true));
  document.getElementById('btnB').addEventListener('click', () => showPrompt('B', true));

  document.getElementById('fillAll').addEventListener('click', () => {
    L2.forEach(n => { if(!isAnswered(n.id)) fillExample(n); });
    editingId = null;
    commit();
  });
  document.getElementById('resetAll').addEventListener('click', () => {
    if(confirm('채워진 답변을 전부 지웁니다. 계속할까요?')){
      answers = {};
      selectedId = null;
      editingId = null;
      commit();
    }
  });
}
init();
