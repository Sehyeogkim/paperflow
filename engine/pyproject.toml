[project]
name = "paperflow-engine"
version = "0.0.1"
description = "Manuscript Compiler — generate journal paper sections from minimal inputs (Claim Graph -> Contract -> Validator), multi-provider LLM routing."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "openpyxl>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paperflow = "paperflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
