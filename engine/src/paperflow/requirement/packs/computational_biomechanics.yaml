study_type: computational_biomechanics

# Always needed to write a defensible Method/Result in this domain.
required:
  - research_objective
  - geometry_definition
  - governing_equations
  - material_properties
  - boundary_conditions
  - numerical_solver
  - convergence_criteria
  - validation
  - sample_definition          # what dataset/samples the results are computed over
  - outcome_metric             # the quantity claimed (e.g. stress index, Sobol index)

# Needed only when the paper makes a particular kind of claim.
conditional:
  - name: mesh_independence
    required_when: [quantitative_field_comparison, peak_stress_claim, pressure_drop_claim]
  - name: timestep_independence
    required_when: [transient_simulation, pulsatile_simulation]
  - name: statistical_analysis
    required_when: [group_comparison, cohort_size_gt_1]
  - name: sensitivity_method
    required_when: [sensitivity_analysis_claim]
