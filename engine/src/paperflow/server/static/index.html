<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paperpal — Manuscript Compiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  :root {
    --ink:#1f1f1e; --muted:#8a8984; --line:#ECEBE7; --sidebar:#F7F6F3;
    --accent:#3E63B8; --accent-soft:#EAF0FA; --soft:#FBFAF8; --bubble:#F1F0EC;
    --serif:'Newsreader',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  body { font-family:var(--sans); color:var(--ink); background:#fff; }
  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(0,0,0,.14); border-radius:999px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::placeholder { color:#9b9a96; }
  textarea:focus, input:focus { outline:none; }
  button { font-family:inherit; }

  .app { height:100vh; display:flex; min-height:0; }

  /* ---------- LEFT ---------- */
  .rail { flex:none; width:272px; background:var(--sidebar); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; transition:margin-left .2s; }
  .rail.closed { margin-left:-272px; }
  .rail .top { flex:none; display:flex; align-items:center; gap:9px; padding:14px 12px 8px; }
  .logo { font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-.02em; }
  .logo .d { color:var(--accent); }
  .rail .top .ic { margin-left:auto; display:flex; gap:2px; }
  .iconbtn { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:var(--muted);
    background:transparent; border:none; cursor:pointer; font-size:16px; }
  .iconbtn:hover { background:#ECEBE7; }
  .rail .list { flex:1; overflow-y:auto; padding:6px 8px 10px; }
  .seclabel { display:flex; align-items:center; gap:6px; padding:10px 8px 6px; }
  .seclabel b { font-size:13px; } .seclabel .more { margin-left:auto; display:flex; gap:2px; }
  .sess { display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:transparent;
    font:inherit; font-size:13.5px; color:var(--ink); padding:8px 9px; border-radius:9px; cursor:pointer; }
  .sess:hover { background:#ECEBE7; }
  .sess.active { background:#E7E6E1; font-weight:600; }
  .sess .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .tag { flex:none; font-size:9.5px; font-weight:700; color:var(--accent); background:var(--accent-soft);
    padding:2px 7px; border-radius:999px; }
  .sess .caret { flex:none; font-size:11px; color:var(--muted); }
  .sess .del { flex:none; opacity:0; color:var(--muted); font-size:12px; line-height:1; padding:3px 5px; border-radius:6px; }
  .sess:hover .del { opacity:.5; }
  .sess .del:hover { opacity:1; color:#b5503c; background:#F6E5E0; }
  .subwrap { display:flex; flex-direction:column; gap:1px; margin:1px 0 8px; }
  .sess.sub { padding-left:26px; font-size:12.5px; color:#46453f; }
  .sess.sub .dotmark { flex:none; width:5px; height:5px; border-radius:50%; background:var(--muted); }
  .sess.newtrial { color:var(--accent); font-weight:600; }
  .rail .user { flex:none; border-top:1px solid var(--line); padding:11px 12px; display:flex; align-items:center; gap:10px; }
  .ava { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:grid;
    place-items:center; font-size:12px; font-weight:700; }
  .pro { margin-left:auto; font-size:10px; font-weight:700; color:var(--accent); background:var(--accent-soft);
    padding:3px 8px; border-radius:999px; }

  /* ---------- CENTER ---------- */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  .mhead { flex:none; height:52px; display:flex; align-items:center; gap:10px; padding:0 22px; }
  .mhead .ht { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .mhead .hs { font-size:11.5px; color:var(--muted); border:1px solid var(--line); padding:3px 9px; border-radius:999px; }
  .mhead .prov { margin-left:auto; font-size:11.5px; color:var(--muted); }
  .mhead .prov.warn { color:#b5503c; font-weight:600; }

  .thread { flex:1; overflow-y:auto; min-height:0; }
  .twrap { max-width:760px; margin:0 auto; padding:26px 24px 30px; display:flex; flex-direction:column; gap:22px; }

  /* greeting */
  .greet { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 40px 80px; }
  .greet h1 { font-family:var(--serif); font-size:30px; font-weight:500; letter-spacing:-.01em; margin:0 0 26px; text-align:center; }
  .composer { width:100%; max-width:600px; }
  .cbox { display:flex; align-items:flex-end; gap:10px; background:#fff; border:1px solid #DEDDD8; border-radius:26px;
    padding:11px 12px 11px 16px; box-shadow:0 8px 30px -16px rgba(0,0,0,.25); }
  .cbox.sm { border-radius:26px; box-shadow:0 6px 22px -16px rgba(0,0,0,.22); }
  .cbox .plus { flex:none; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); color:var(--muted);
    display:grid; place-items:center; font-size:17px; cursor:pointer; background:#fff; }
  .cbox textarea { flex:1; border:none; resize:none; font-family:inherit; font-size:15px; color:var(--ink);
    line-height:1.5; max-height:140px; padding:5px 0; background:transparent; }
  .cbox .ground { flex:none; display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600;
    color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:5px 10px; cursor:default; }
  .send { flex:none; width:34px; height:34px; border-radius:50%; background:var(--ink); color:#fff; border:none;
    cursor:pointer; display:grid; place-items:center; font-size:15px; }
  .send:hover { opacity:.85; }
  .send:disabled { opacity:.4; cursor:default; }
  .chips { display:flex; gap:9px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:7px; font:inherit; font-size:13px; color:#5b5a56; background:#fff;
    border:1px solid var(--line); border-radius:999px; padding:8px 14px; cursor:pointer; }
  .chip:hover { background:#F2F1ED; }

  /* messages */
  .urow { display:flex; justify-content:flex-end; }
  .ubub { max-width:80%; font-size:15px; line-height:1.6; background:var(--bubble); border-radius:20px; padding:11px 16px; }
  .arow { display:flex; gap:13px; }
  .spark { flex:none; width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:grid; place-items:center; font-size:13px; }
  .abody { flex:1; min-width:0; font-size:15px; line-height:1.7; padding-top:2px; }
  .abody b { font-weight:700; }

  .card { border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#fff; margin-top:10px; }
  .erow { display:flex; align-items:flex-start; gap:11px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .erow:last-child { border-bottom:none; }
  .dot { flex:none; width:9px; height:9px; border-radius:50%; margin-top:5px; }
  .dot.ready { background:#3f7d57; } .dot.thin { background:#c79a3a; } .dot.missing { background:#b5503c; }
  .ei { flex:1; min-width:0; }
  .ei .lab { font-size:13.5px; font-weight:600; }
  .ei .lab .st { font-size:10px; font-weight:700; padding:1px 7px; border-radius:999px; margin-left:5px; }
  .st.ready { color:#3f7d57; background:#E7F0EA; } .st.thin { color:#8a6a22; background:#F3E7CF; }
  .st.missing { color:#b5503c; background:#F6E5E0; }
  .ei .det { font-size:13px; color:var(--muted); line-height:1.5; margin-top:2px; }
  .ebtn { flex:none; font:inherit; font-size:12.5px; font-weight:600; background:transparent; border:1px solid var(--line);
    border-radius:8px; padding:6px 11px; cursor:pointer; }
  .ebtn:hover { background:#F2F1ED; }
  .cardfoot { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--soft); flex-wrap:wrap; }
  .primary { font:inherit; font-size:13px; font-weight:700; color:#fff; background:var(--ink); border:none;
    border-radius:9px; padding:9px 16px; cursor:pointer; }
  .primary:disabled { opacity:.4; cursor:default; }
  .foothint { font-size:12px; color:var(--muted); }

  .qcard { border:1px solid var(--line); border-radius:14px; background:#fff; padding:13px 15px; margin-bottom:11px; }
  .qtop { display:flex; gap:8px; align-items:baseline; margin-bottom:3px; }
  .qkind { flex:none; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:2px 7px; border-radius:5px; color:var(--accent); background:var(--accent-soft); }
  .qkind.high { color:#b5503c; background:#F6E5E0; }
  .qq { font-size:14px; font-weight:600; line-height:1.45; }
  .qwhy { font-size:12.5px; color:var(--muted); margin:3px 0 9px; }
  .qta { width:100%; border:1px solid var(--line); border-radius:9px; background:var(--soft); font:inherit;
    font-size:13.5px; color:var(--ink); padding:9px 11px; resize:vertical; min-height:40px; line-height:1.5; }
  .qta:disabled { opacity:.7; }
  .qskip { margin-top:7px; font:inherit; font-size:12px; color:var(--muted); background:transparent;
    border:1px dashed var(--line); padding:4px 10px; border-radius:7px; cursor:pointer; }
  .srchead { display:flex; align-items:center; gap:9px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--soft); }
  .srchead .nm { font-size:13px; font-weight:600; } .srchead .mt { font-size:12.5px; color:var(--muted); }
  .badge { margin-left:auto; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px;
    color:var(--accent); background:var(--accent-soft); }
  .badge.ok { color:#3f7d57; background:#E7F0EA; }
  .genlog { background:#1c1c1b; color:#dcd9d2; border-radius:12px; padding:13px 15px; font-family:ui-monospace,Menlo,monospace;
    font-size:12.5px; line-height:1.8; white-space:pre-wrap; max-height:300px; overflow-y:auto; }
  .restitle { font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.3; }
  .resmeta { font-size:13px; color:var(--muted); margin-top:5px; }
  .dl { font-size:12.5px; font-weight:600; color:var(--accent); border:1px solid var(--line); padding:7px 12px;
    border-radius:8px; cursor:pointer; text-decoration:none; }
  .dl:hover { background:var(--soft); }

  .botcomp { flex:none; padding:8px 24px 18px; }
  .botcomp .inner { max-width:760px; margin:0 auto; }
  .botcomp .foot { text-align:center; font-size:11px; color:var(--muted); margin-top:8px; }

  /* ---------- RIGHT PANEL ---------- */
  .panel { flex:none; width:46%; min-width:380px; max-width:680px; border-left:1px solid var(--line); background:#fff;
    display:flex; flex-direction:column; min-height:0; }
  .panel.hidden { display:none; }
  .phead { flex:none; display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .phead .pt { font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .phead .x { margin-left:auto; width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
    color:var(--muted); background:transparent; border:none; font-size:16px; cursor:pointer; }
  .pbody { flex:1; overflow-y:auto; padding:22px 26px 30px; }
  .pkicker { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:4px; }
  .pbody h2 { font-family:var(--serif); font-size:22px; font-weight:600; margin:0 0 6px; }
  .pbody .desc { font-size:13px; color:var(--muted); line-height:1.6; margin:0 0 16px; }
  .ptabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .ptab { font:inherit; font-size:12.5px; font-weight:600; color:var(--muted); background:transparent;
    border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; }
  .ptab.on { color:#fff; background:var(--ink); border-color:var(--ink); }
  .flabel { display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; margin:14px 1px 6px; }
  .flabel .req { color:#b5503c; } .flabel .opt { font-weight:600; text-transform:none; letter-spacing:0; }
  .fin, .fta { width:100%; border:1px solid var(--line); border-radius:9px; background:var(--soft); font:inherit;
    font-size:14px; color:var(--ink); padding:10px 12px; }
  .fta { resize:vertical; line-height:1.6; }
  .novrow { display:flex; gap:8px; align-items:center; margin-top:7px; }
  .novrow .num { flex:none; font-family:ui-monospace,Menlo,monospace; font-size:11px; font-weight:700; color:var(--accent); }
  .novrow input { flex:1; border:1px solid var(--line); border-radius:8px; background:var(--soft); font:inherit;
    font-size:13.5px; color:var(--ink); padding:9px 11px; }
  .addbtn { margin-top:8px; font:inherit; font-size:12.5px; font-weight:600; color:var(--accent); background:transparent;
    border:1px dashed var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .drop { display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; padding:26px 18px;
    border:2px dashed var(--line); border-radius:13px; background:var(--soft); cursor:pointer; margin-bottom:14px; }
  .frow { display:flex; align-items:center; gap:10px; padding:9px 11px; background:#fff; border:1px solid var(--line);
    border-radius:9px; margin-bottom:7px; }
  .fkind { flex:none; font-family:ui-monospace,Menlo,monospace; font-size:9px; font-weight:700; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft); padding:3px 7px; border-radius:5px; }
  .fname { flex:1; font-size:13px; font-weight:600; } .fmeta { font-size:11.5px; color:var(--muted); }
  .savetag { font-size:11.5px; color:#3f7d57; margin-top:14px; }
  .ofile { display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:1px solid var(--line);
    background:#fff; border-radius:9px; padding:8px 11px; margin-bottom:6px; cursor:pointer; font:inherit; }
  .ofile.active { border-color:var(--accent); background:var(--accent-soft); }
  .ofile .ok { font-family:ui-monospace,Menlo,monospace; font-size:9px; font-weight:700; text-transform:uppercase;
    color:var(--accent); } .ofile .on { flex:1; font-size:12.5px; font-weight:600; } .ofile .os { font-size:11px; color:var(--muted); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.3); display:grid; place-items:center; z-index:50; }
  .modal .box { background:#fff; border-radius:14px; padding:20px 22px; width:340px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { font-family:var(--serif); margin:0 0 12px; font-size:18px; }
  .modal input { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font:inherit; font-size:14px; margin-bottom:14px; }
  .modal .row { display:flex; gap:8px; justify-content:flex-end; }
  .ghost { font:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT -->
  <aside class="rail" id="rail">
    <div class="top">
      <span class="logo">paper<span class="d">·</span>pal</span>
      <span class="ic">
        <button class="iconbtn" id="toggleRail" title="Collapse">⇤</button>
      </span>
    </div>
    <div class="list">
      <div class="seclabel"><b>Projects</b><span style="font-size:11px;color:var(--muted)">▾</span>
        <span class="more"><button class="iconbtn" id="newProjBtn" title="New project" style="width:26px;height:26px;font-size:15px">＋</button></span></div>
      <div id="projlist"></div>
    </div>
    <div class="user">
      <span class="ava">JK</span><span style="font-size:13px;font-weight:600">Jeff Kim</span>
      <span class="pro">Pro</span>
    </div>
  </aside>

  <!-- CENTER -->
  <main class="main">
    <div class="mhead">
      <button class="iconbtn" id="openRail" title="Open sidebar" style="display:none;border:1px solid var(--line)">⇥</button>
      <span class="ht" id="headerTitle">New paper</span>
      <span class="hs" id="headerStage">greeting</span>
    </div>
    <div class="thread" id="thread"><!-- greeting or messages injected --></div>
    <div class="botcomp" id="botcomp" style="display:none">
      <div class="inner">
        <div class="cbox sm">
          <span class="plus" title="Attach">＋</span>
          <textarea id="botInput" rows="1" placeholder="Reply, or add detail…"></textarea>
          <span class="ground">Grounded ▾</span>
          <button class="send" id="botSend">↑</button>
        </div>
        <div class="foot">paperpal grounds every claim in your data, a figure, or a verified citation.</div>
      </div>
    </div>
  </main>

  <!-- RIGHT PANEL -->
  <aside class="panel hidden" id="panel">
    <div class="phead">
      <span class="pt" id="panelTitle">Panel</span>
      <button class="x" id="panelClose">✕</button>
    </div>
    <div class="pbody" id="panelBody"></div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const today = () => new Date().toISOString().slice(0,10);
async function postJSON(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function enc(s){ return encodeURIComponent(s); }

// figure-prompt copy: the preview HTML's inline <script> never runs when injected via
// innerHTML, so define the handler globally here (inline onclick="pfCopyPrompt(this)" finds it).
window.pfCopyPrompt = function(btn){
  const txt = btn.dataset.prompt || "";
  const ok = () => { btn.textContent = "✓ 복사됨"; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "📋 이미지 모델 prompt 복사"; btn.classList.remove("ok"); }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(ok).catch(() => fallbackCopy(txt, ok));
  } else fallbackCopy(txt, ok);
};
function fallbackCopy(txt, ok){
  const ta = document.createElement("textarea"); ta.value = txt;
  ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand("copy"); ok && ok(); } catch (e) { alert("복사 실패 — 수동 복사하세요"); }
  ta.remove();
}

// ---------------- state ----------------
const S = {
  projectRoot:null, projectName:"New paper", sourceDir:null, sessionDir:null, sessionId:null,
  phase:"greet", stage:"requirement", diag:null,
  expandedProject:null,
  messages:[],            // data-driven thread (persisted to chat.json)
  // filled by the onboarding orchestrator from the user's description (no hardcoded prefill)
  form: { field:"", target:"", title:"", affiliation:"", paragraph:"", novelty:[""], outlineQuick:"" },
};
function mergeExtracted(ex) {
  ex = ex || {};
  const str = v => Array.isArray(v) ? v.filter(Boolean).map((s,i)=>`${i+1}. ${s}`).join("\n") : (v||"");
  if (ex.field) S.form.field = ex.field;
  if (ex.target) S.form.target = ex.target;
  if (ex.title) S.form.title = ex.title;
  if (ex.affiliation) S.form.affiliation = ex.affiliation;
  if (ex.paragraph) S.form.paragraph = ex.paragraph;
  if (Array.isArray(ex.novelty) && ex.novelty.filter(Boolean).length) S.form.novelty = ex.novelty.filter(Boolean);
  if (ex.outline) S.form.outlineQuick = str(ex.outline);
}

// ================= LEFT RAIL =================
$("toggleRail").onclick = () => { $("rail").classList.add("closed"); $("openRail").style.display=""; };
$("openRail").onclick = () => { $("rail").classList.remove("closed"); $("openRail").style.display="none"; };
$("newProjBtn").onclick = () => openNewProjectModal();

let _projects = [], _sessions = {};   // _sessions[projectRoot] = {sessions, source_dir}
async function loadProjects() {
  try {
    const r = await (await fetch("/api/projects/list")).json();
    setProviders(r.providers);
    _projects = r.projects || [];
    renderProjects();
  } catch (e) { setProviders(null); }
}
function setProviders(list) {
  const el = $("providers");
  if (!el) return;   // header indicator removed
  if (list && list.length) { el.textContent = "providers: " + list.join(", "); el.classList.remove("warn"); }
  else { el.textContent = "⚠ no API key (engine/.env)"; el.classList.add("warn"); }
}
function renderProjects() {
  const box = $("projlist"); box.innerHTML = "";
  _projects.forEach(p => {
    const expanded = S.expandedProject === p.project_dir;
    const isLive = p.project_dir === S.projectRoot;
    const pb = document.createElement("button");
    pb.className = "sess" + (isLive && !expanded ? " active" : "");
    pb.innerHTML = `<span style="flex:none;font-size:14px">${expanded?'📂':'📁'}</span>
      <span class="nm">${esc(p.name||p.dir)}</span>
      <span class="del" title="Delete paper">🗑</span><span class="caret">${expanded?'▾':'›'}</span>`;
    pb.onclick = () => toggleProject(p);
    pb.querySelector(".del").onclick = (e) => { e.stopPropagation();
      confirmModal(`Delete the whole paper “${p.name||p.dir}” and all its trials? (moved to trash, recoverable)`,
        () => deleteProject(p)); };
    box.appendChild(pb);
    if (expanded) box.appendChild(renderSubsessions(p));
  });
}
function renderSubsessions(p) {
  const wrap = document.createElement("div"); wrap.className = "subwrap";
  const sx = _sessions[p.project_dir];
  // source
  const src = document.createElement("button"); src.className = "sess sub";
  src.innerHTML = `<span style="flex:none;font-size:12px">🗂️</span><span class="nm">source</span>
    <span class="tag">shared</span>`;
  src.onclick = () => openSource(p);
  wrap.appendChild(src);
  // sessions
  if (!sx) { const l = document.createElement("div"); l.className="sess sub"; l.textContent="loading…"; wrap.appendChild(l); }
  else (sx.sessions||[]).forEach(s => {
    const b = document.createElement("button");
    const active = s.session_dir === S.sessionDir;
    b.className = "sess sub" + (active ? " active" : "");
    const tag = s.status === "done" ? `<span class="tag">done</span>` :
                (active ? `<span class="tag">live</span>` : "");
    const del = s.legacy ? "" : `<span class="del" title="Delete trial">🗑</span>`;
    b.innerHTML = `<span class="dotmark"></span><span class="nm">${esc(s.title||s.id)}</span>${tag}${del}`;
    b.onclick = () => openSession(p, s);
    if (!s.legacy) b.querySelector(".del").onclick = (e) => { e.stopPropagation();
      confirmModal(`Delete trial “${esc(s.title||s.id)}”? (moved to trash, recoverable)`,
        () => deleteSession(p, s)); };

  });
  // new trial
  const nt = document.createElement("button"); nt.className = "sess sub newtrial";
  nt.innerHTML = `<span style="flex:none">＋</span><span class="nm">new trial</span>`;
  nt.onclick = () => newSession(p);
  wrap.appendChild(nt);
  return wrap;
}
async function toggleProject(p) {
  if (S.expandedProject === p.project_dir) { S.expandedProject = null; renderProjects(); return; }
  S.expandedProject = p.project_dir;
  renderProjects();
  await refreshSessions(p);
  renderProjects();
}
async function refreshSessions(p) {
  try {
    const r = await (await fetch("/api/projects/sessions?project_dir=" + enc(p.project_dir))).json();
    _sessions[p.project_dir] = r;
  } catch { _sessions[p.project_dir] = {sessions:[], source_dir:p.project_dir}; }
}

// ================= SESSION OPEN / CREATE =================
async function openSession(p, s) {
  S.projectRoot = p.project_dir; S.projectName = p.name || p.dir;
  S.sessionDir = s.session_dir; S.sessionId = s.id;
  S.sourceDir = (_sessions[p.project_dir] || {}).source_dir || p.project_dir;
  $("headerTitle").textContent = (p.name||p.dir) + (s.title ? " · " + s.title : "");
  renderProjects();
  // load chat history
  let msgs = [];
  try { msgs = (await (await fetch("/api/projects/chat-history?session_dir=" + enc(s.session_dir))).json()).messages || []; } catch {}
  S.messages = msgs;
  if (msgs.length) { setStage(s.stage || "done"); $("botcomp").style.display = ""; renderThread(); }
  else if (s.status === "done") {            // legacy/older run with output but no saved chat
    setStage("done"); $("botcomp").style.display = ""; $("thread").innerHTML = `<div class="twrap"></div>`;
    addMessage({t:"assistant", text:"This trial already produced a manuscript. Here it is — open it on the right."});
    addMessage({t:"result", meta:{}, session_dir:s.session_dir});
  }
  else { startGreeting(); }
}
async function newSession(p) {
  const r = await postJSON("/api/projects/sessions", {project_dir:p.project_dir, title:"New trial", created:today()});
  await refreshSessions(p);
  await openSession(p, {session_dir:r.session_dir, id:r.id, title:r.title, stage:"greet"});
}
async function openSource(p) {
  S.projectRoot = p.project_dir; S.projectName = p.name || p.dir;
  S.sourceDir = (_sessions[p.project_dir] || {}).source_dir || (p.project_dir + "/source");
  openPanel("journal");
}
// ensure a project+session exists when the user acts from the bare greeting
async function ensureSession(nameHint) {
  if (S.sessionDir) return;
  const name = (nameHint || ("paper_" + Date.now().toString(36))).slice(0, 40);
  const cr = await postJSON("/api/projects/create", {name, created:today()});
  const sr = await postJSON("/api/projects/sessions", {project_dir:cr.project_dir, title:"Trial 1", created:today()});

}

// ---- delete (soft, recoverable) ----
function confirmModal(msg, onYes) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box"><h3>Move to trash?</h3>
    <p style="font-size:13.5px;color:var(--muted);line-height:1.5;margin:0 0 16px">${msg}</p>

  document.body.appendChild(m);
  const close = () => m.remove();

function resetToBlank() {

}
async function deleteProject(p) {
  try { await postJSON("/api/projects/delete", {project_dir:p.project_dir}); }

}
async function deleteSession(p, s) {

  catch (e) { alert("delete failed: " + e); return; }
  if (S.sessionDir===s.session_dir) resetToBlank();

}

function threadWrap() {
  let w = document.querySelector(".twrap");
  if (!w) { $("thread").innerHTML = `<div class="twrap"></div>`; w = document.querySelector(".twrap"); }
  return w;
}
function scrollDown() { requestAnimationFrame(() => { const t = $("thread"); t.scrollTop = t.scrollHeight; }); }
function addMessage(m) { S.messages.push(m); m._el = renderMessage(m); threadWrap().appendChild(m._el); saveChat(); scrollDown(); return m; }
function rerender(m) { if (!m._el) return; const n = renderMessage(m); m._el.replaceWith(n); m._el = n; saveChat(); }
function renderThread() {
  $("thread").innerHTML = `<div class="twrap"></div>`;
  S.messages.forEach(m => { m._el = renderMessage(m); threadWrap().appendChild(m._el); });
  scrollDown();
}
function renderMessage(m) {
  switch (m.t) {
    case "user":       return mUser(m);
    case "assistant":  return mAssistant(m);
    case "essentials": return mEssentials(m);
    case "search":     return mSearch(m);
    case "questions":  return mQuestions(m);
    case "log":        return mLog(m);
    case "result":     return mResult(m);
    case "gaps":       return mGaps(m);
    default:           return mAssistant({text:""});
  }
}
function aShell(innerHTML) {
  const d = document.createElement("div"); d.className = "arow";
  d.innerHTML = `<span class="spark">✦</span><div class="abody">${innerHTML}</div>`;
  return d;
}
function mUser(m) { const d = document.createElement("div"); d.className = "urow";
  d.innerHTML = `<div class="ubub">${esc(m.text)}</div>`; return d; }
function mAssistant(m) { return aShell(m.text || ""); }

// ---- essentials ----
function essentialsStatus() {
  const f = S.form;
  return {
    journal: (f.field.trim() && f.target.trim()) ? "ready" : "missing",
    core: (f.paragraph.trim() && f.novelty.filter(n=>n.trim()).length) ? "ready" : "missing",
    outline: f.outlineQuick.trim() ? (f.outlineQuick.length > 120 ? "ready" : "thin") : "missing",
    data: (S._dataCount) ? "ready" : "missing",
  };
}
function mEssentials(m) {
  const st = essentialsStatus(), f = S.form;
  const nov = f.novelty.filter(n=>n.trim()).length;
  const rows = [
    {k:"journal", label:"Journal info", det: st.journal==="ready"?`${f.target} · field set`:"Target journal / field missing", btn:"Edit"},
    {k:"core", label:"Core message + novelty", det: st.core==="ready"?`${nov} novelty claims detected`:"Paragraph / novelty missing", btn:"Edit"},
    {k:"outline", label:"Outline", det: st.outline==="missing"?"No outline yet":(st.outline==="thin"?"Thin — add detail":"Intro→Discussion covered"), btn:"Fill in"},
    {k:"data", label:"Data", det: st.data==="ready"?`${S._dataCount} files attached`:"No files attached — claims can't be grounded yet", btn:"Attach"},
  ];
  const thin = rows.filter(r => st[r.k] !== "ready").length;
  const el = aShell(`Here are the essentials I pulled from your description${thin?` — <b>${thin} still thin</b>`:""}. Edit anything, or proceed.
    <div class="card" id="essCard"></div>`);
  const card = el.querySelector("#essCard");
  rows.forEach(r => {
    const s = st[r.k];
    const row = document.createElement("div"); row.className = "erow";
    row.innerHTML = `<span class="dot ${s}"></span>
      <div class="ei"><div class="lab">${r.label} <span class="st ${s}">${s}</span></div><div class="det">${esc(r.det)}</div></div>
      <button class="ebtn">${r.btn}</button>`;
    row.querySelector(".ebtn").onclick = () => openPanel(r.k);
    card.appendChild(row);
  });
  const foot = document.createElement("div"); foot.className = "cardfoot";
  foot.innerHTML = `<button class="primary" id="proceedBtn">Looks right — research prior work →</button>
    <span class="foothint">I'll search OpenAlex next.</span>`;
  foot.querySelector("#proceedBtn").onclick = () => proceedToResearch();
  card.appendChild(foot);
  return el;
}

// ---- gaps (orchestrator follow-up questions + data ask) ----
function mGaps(m) {
  const miss = (m.missing||[]);
  let html = "";
  if (miss.length) html += `To sharpen the draft, a few things would help:<br>` + miss.map(g=>`• ${esc(g)}`).join("<br>");
  html += (html?"<br><br>":"") + `📎 <b>${esc(m.ask_data||"Do you have data/result files to add?")}</b>`;
  html += `<div class="foothint" style="margin-top:8px">Answer below, or click <b>Edit/Attach</b> on the cards — then “research prior work”.</div>`;
  return aShell(html);
}

// ---- search ----
function mSearch(m) {
  const running = m.status !== "done";
  const meta = running ? "querying…" : `${m.present||0} covered · ${m.nq||0} questions`;
  const badge = running ? `<span class="badge">running</span>` : `<span class="badge ok">✓ done</span>`;
  return aShell(`Searching prior work to ground your claims and find gaps…
    <div class="card"><div class="srchead"><span>🔎</span><span class="nm">OpenAlex</span>
      <span class="mt">${meta}</span>${badge}</div></div>`);
}

// ---- questions ----
function mQuestions(m) {
  m.answers = m.answers || {};
  const el = aShell(`Now the reasoning. These shape the <b>claim graph</b>, the figures, and how each section argues — answer in your words, or skip.
    <div style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(m.classification||"")} · ${(m.questions||[]).length} questions${m.submitted?" · submitted":""}</div>
    <div id="qlist" style="margin-top:12px"></div>
    <div style="display:flex;align-items:center;gap:11px;margin-top:8px">
      <button class="primary" id="genBtn">Generate the paper →</button><span class="foothint" id="genNote"></span></div>`);
  const list = el.querySelector("#qlist");
  (m.questions||[]).forEach(q => {
    const fld = q.field || q.id;
    const card = document.createElement("div"); card.className = "qcard";
    const high = q.reviewer_risk === "high" ? "high" : "";
    card.innerHTML = `<div class="qtop"><span class="qkind ${high}">${q.reviewer_risk||"info"}</span><span class="qq">${esc(q.question)}</span></div>
      ${q.why_asked ? `<div class="qwhy">${esc(q.why_asked)}</div>` : ""}
      <textarea class="qta" placeholder="${q.example?'예) '+esc(q.example):'Your answer…'}">${esc(m.answers[fld]||"")}</textarea>
      <div><button class="qskip">Let me decide</button></div>`;
    const ta = card.querySelector(".qta");
    if (m.submitted) { ta.disabled = true; card.querySelector(".qskip").style.display = "none"; }
    ta.oninput = () => { m.answers[fld] = ta.value; gate(el, m); saveChat(); };
    card.querySelector(".qskip").onclick = () => { ta.value = "(모름 — 나중에 보완)"; m.answers[fld] = ta.value; gate(el, m); saveChat(); };
    list.appendChild(card);
  });
  const genBtn = el.querySelector("#genBtn");
  if (m.submitted) { genBtn.disabled = true; genBtn.textContent = "Submitted ✓"; el.querySelector("#genNote").textContent = ""; }
  else { genBtn.onclick = () => submitAnswers(m); setTimeout(()=>gate(el, m), 0); }
  return el;
}
function gate(el, m) {
  const tas = [...el.querySelectorAll(".qta")];
  const pending = tas.filter(t => !t.value.trim()).length;
  const btn = el.querySelector("#genBtn"); if (!btn) return;
  btn.disabled = pending > 0;
  el.querySelector("#genNote").textContent = pending > 0 ? `${pending} unanswered — answer or "Let me decide"` : (tas.length?"All answered · ready":"ready");
}

// ================= FLOW =================
async function startFromDescription(text) {
  text = text || defaultDesc();
  $("thread").innerHTML = `<div class="twrap"></div>`; S.messages = [];
  $("botcomp").style.display = "";
  addMessage({t:"user", text});
  const pend = addMessage({t:"assistant", text:`<span style="color:var(--muted)">thinking…</span>`});
  let o;
  try { o = await postJSON("/api/projects/onboard", {message:text}); }
  catch (e) { pend.text = "onboard failed: " + esc(String(e)); rerender(pend); return; }
  if (o.error) { pend.text = "onboard error: " + esc(o.error); rerender(pend); return; }
  // agent names the project + session, then we create them
  const cr = await postJSON("/api/projects/create", {name:(o.project_name||text.slice(0,30)), created:today()});
  const sr = await postJSON("/api/projects/sessions", {project_dir:cr.project_dir, title:(o.session_title||"Trial 1"), created:today()});
  S.projectRoot = cr.project_dir; S.projectName = o.project_name || cr.project_dir.split("/").pop();
  S.sessionDir = sr.session_dir; S.sessionId = sr.id; S.sourceDir = sr.source_dir; S.expandedProject = cr.project_dir;
  $("headerTitle").textContent = S.projectName + (o.session_title ? " · " + o.session_title : "");
  mergeExtracted(o.extracted);
  await saveInputs().catch(()=>{});
  patchSession({title:o.session_title || text.slice(0,40)});
  setStage("essentials");
  pend.text = esc(o.reply || "Here's what I understood.").replace(/\n/g,"<br>"); rerender(pend);
  addMessage({t:"essentials"});
  addMessage({t:"gaps", missing:(o.missing||[]).filter(Boolean), ask_data:o.ask_data||"Do you have data/result files to add?"});
  await loadProjects(); await refreshSessions({project_dir:cr.project_dir}); renderProjects();
  saveChat();
}

function assembleJournalMd() {
  const f = S.form;
  const L = ["## Author's field", f.field, "", "## Target journals", "1. " + f.target, ""];
  if (f.title.trim()) { L.push("## Paper title", f.title, ""); }
  L.push("## Extra info");
  if (f.affiliation.trim()) L.push("- affiliation: " + f.affiliation);
  return L.join("\n");
}
function assembleCoreMd() {
  const f = S.form;
  const L = ["## One paragraph", f.paragraph, "", "## Novelty"];
  f.novelty.filter(n=>n.trim()).forEach((n,i) => L.push(`- 발견 ${i+1}: ${n}`));
  return L.join("\n");
}
async function saveInputs() {
  const dirs = [...new Set([S.sessionDir, S.sourceDir].filter(Boolean))];   // run dir + shared source
  for (const d of dirs) {
    await postJSON("/api/projects/save", {project_dir:d, journal_info_md:assembleJournalMd(),
      coremessage_md:assembleCoreMd(), outline_md:S.form.outlineQuick, ui_state:{form:S.form}});
    await postJSON("/api/projects/outline", {project_dir:d, mode:"quick", raw:S.form.outlineQuick});
  }
}

async function proceedToResearch() {
  setStage("research");
  const sm = addMessage({t:"search", status:"running"});
  try {
    await saveInputs();
    const diag = await postJSON("/api/projects/diagnose", {project_dir:S.sessionDir});
    S.diag = diag;
    sm.present = (diag.present||[]).length; sm.nq = (diag.questions||[]).length; sm.status = "done"; rerender(sm);
    setTimeout(() => addMessage({t:"questions", questions:diag.questions||[], classification:diag.classification||"", stage:"requirement", answers:{}, submitted:false}), 350);
  } catch (e) {
    addMessage({t:"assistant", text:`<b style="color:#b5503c">Diagnose failed.</b> ${esc(String(e))}`});
  }
}

async function submitAnswers(m) {
  m.submitted = true; rerender(m);
  const url = m.stage === "logic" ? "/api/projects/answers/logic" : "/api/projects/answers/requirement";
  try {
    const res = await postJSON(url, {project_dir:S.sessionDir, answers:m.answers});
    runJob(res, m.stage);
  } catch (e) { addMessage({t:"assistant", text:"error: " + esc(String(e))}); m.submitted=false; rerender(m); }
}

function runJob(res, stage) {
  const pdir = S.sessionDir;
  setStage("generating");
  const heading = stage === "logic" ? "Generating the manuscript — grounding every claim."
    : "Building the logic graph from your answers, then drafting.";
  const lm = addMessage({t:"log", heading, lines:[], done:false});
  const log = s => { lm.lines.push(s); if (lm.lines.length>120) lm.lines.shift();
    if (lm._logEl) { lm._logEl.textContent = lm.lines.join("\n"); lm._logEl.scrollTop = lm._logEl.scrollHeight; } saveChat(); scrollDown(); };
  const es = new EventSource(`/api/projects/answers/${res.job_id}/stream`);
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "progress") log("› " + (m.raw || m.label || ""));
    else if (m.type === "logic_questions") { es.close(); log("✓ logic gaps found — a few more questions");
      setTimeout(() => addMessage({t:"questions", questions:m.questions||[], classification:"logic gaps", stage:"logic", answers:{}, submitted:false}), 300); }
    else if (m.type === "generating") log("✓ logic graph complete — drafting the paper…");
    else if (m.type === "done") { es.close(); log("✓ paper.docx ready"); lm.done=true;
      setStage("done"); refreshSessionsLive();
      setTimeout(() => addMessage({t:"result", meta:m, session_dir:pdir}), 300); }
    else if (m.type === "error") { es.close(); log("✗ error: " + m.error); }
  };
  es.onerror = () => es.close();
}
async function refreshSessionsLive() {
  if (S.projectRoot) { await refreshSessions({project_dir:S.projectRoot}); renderProjects(); }
}

// ================= BOTTOM COMPOSER =================
$("botSend").onclick = async () => {
  const v = $("botInput").value.trim(); if (!v) return;
  addMessage({t:"user", text:v}); $("botInput").value = "";
  const history = S.messages.filter(m => m.t==="user" || m.t==="assistant").map(m => ({role:m.t, text:m.text}));
  const pend = addMessage({t:"assistant", text:"<span style='color:var(--muted)'>…</span>"});
  // during onboarding, route follow-ups back through the orchestrator so it refines the inputs
  if (S.phase === "essentials") {
    try {
      const o = await postJSON("/api/projects/onboard", {message:v, history});
      if (!o.error) {
        mergeExtracted(o.extracted); await saveInputs().catch(()=>{});
        pend.text = esc(o.reply || "Updated.").replace(/\n/g,"<br>"); rerender(pend);
        addMessage({t:"essentials"});
        if ((o.missing||[]).filter(Boolean).length || o.ask_data)
          addMessage({t:"gaps", missing:(o.missing||[]).filter(Boolean), ask_data:o.ask_data||""});
        return;
      }
      pend.text = "error: " + esc(o.error); rerender(pend); return;
    } catch (e) { pend.text = "error: " + esc(String(e)); rerender(pend); return; }
  }
  // otherwise: plain conversational chat (gpt-4o-mini)
  try {
    const r = await postJSON("/api/projects/llm-chat", {message:v, history});
    pend.text = esc(r.reply || r.error || "(no reply)").replace(/\n/g,"<br>"); rerender(pend);
  } catch (e) { pend.text = "error: " + esc(String(e)); rerender(pend); }
};
$("botInput").onkeydown = e => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); $("botSend").onclick(); } };

// ================= RIGHT PANEL =================
$("panelClose").onclick = () => $("panel").classList.add("hidden");
function openPanel(kind, pdir) {
  $("panel").classList.remove("hidden");
  const titles = {journal:"Source · journal info", core:"Source · core message", outline:"Source · outline", data:"Source · data", paper:"Manuscript"};
  $("panelTitle").textContent = titles[kind] || "Panel";
  const b = $("panelBody"); b.innerHTML = "";
  if (kind === "journal" || kind === "core" || kind === "outline" || kind === "data") renderSourcePanel(b, kind);
  else if (kind === "paper") renderPaperPanel(b, pdir || S.sessionDir);
}
function renderSourcePanel(b, kind) {
  const tabs = [["journal","Journal"],["core","Core"],["outline","Outline"],["data","Data"]];
  const head = document.createElement("div");
  head.innerHTML = `<div class="pkicker">Shared source · all trials use this</div>
    <div class="ptabs">${tabs.map(([k,l])=>`<button class="ptab ${k===kind?'on':''}" data-k="${k}">${l}</button>`).join("")}</div>`;
  b.appendChild(head);
  head.querySelectorAll(".ptab").forEach(t => t.onclick = () => openPanel(t.dataset.k));
  const body = document.createElement("div"); b.appendChild(body);
  if (kind === "journal") fJournal(body);
  else if (kind === "core") fCore(body);
  else if (kind === "outline") fOutline(body);
  else if (kind === "data") fData(body);
}
function field(b, label, key, opt) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<label class="flabel">${label} ${opt?'<span class="opt">· optional</span>':'<span class="req">*</span>'}</label>`;
  const inp = document.createElement("input"); inp.className = "fin"; inp.value = S.form[key] || "";
  inp.oninput = () => { S.form[key] = inp.value; markSaved(b); };
  wrap.appendChild(inp); b.appendChild(wrap);
}
function fJournal(b) {
  b.innerHTML = `<h2>Journal info</h2><p class="desc">Target journal + field define how paperpal frames every section.</p>`;
  field(b,"Author's field","field"); field(b,"Target journal","target");
  field(b,"Paper title","title",true); field(b,"Affiliation","affiliation",true); saveTag(b);
}
function fCore(b) {
  b.innerHTML = `<h2>Core message + novelty</h2><p class="desc">One paragraph and each novelty become the core claims of the graph.</p>`;
  const pl = document.createElement("label"); pl.className="flabel"; pl.innerHTML = `One paragraph <span class="req">*</span>`;
  const pt = document.createElement("textarea"); pt.className="fta"; pt.rows=6; pt.value=S.form.paragraph;
  pt.oninput = () => { S.form.paragraph = pt.value; markSaved(b); }; b.append(pl, pt);
  const nl = document.createElement("label"); nl.className="flabel"; nl.innerHTML = `Novelty <span class="req">*</span>`; b.appendChild(nl);
  const nbox = document.createElement("div");
  const draw = () => { nbox.innerHTML=""; S.form.novelty.forEach((n,i)=>{ const row=document.createElement("div"); row.className="novrow";
    row.innerHTML = `<span class="num">${i+1}</span>`; const inp=document.createElement("input"); inp.value=n;
    inp.oninput=()=>{ S.form.novelty[i]=inp.value; markSaved(b); }; row.appendChild(inp); nbox.appendChild(row); }); };
  draw(); b.appendChild(nbox);
  const add = document.createElement("button"); add.className="addbtn"; add.textContent="＋ novelty";
  add.onclick = () => { S.form.novelty.push(""); draw(); }; b.appendChild(add); saveTag(b);
}
function fOutline(b) {
  b.innerHTML = `<h2>Outline</h2><p class="desc">Free-form is fine — paste your skeleton. Method & Result matter most.</p>`;
  const ta = document.createElement("textarea"); ta.className="fta"; ta.rows=18; ta.value=S.form.outlineQuick; ta.style.fontSize="13px";
  ta.oninput = () => { S.form.outlineQuick = ta.value; markSaved(b); }; b.appendChild(ta); saveTag(b);
}
function fData(b) {
  b.innerHTML = `<h2>Data</h2><p class="desc">Shared across every trial of this paper. paperpal infers each file's meaning.</p>
    <label class="drop" id="drop"><span style="font-size:21px">⬆️</span>
      <span style="font-size:13.5px;font-weight:700">Drop files, or click to upload</span>
      <span style="font-size:11px;color:var(--muted)">CSV · DAT · PDF · XLSX · JSON · BIB</span>
      <input type="file" id="fileInput" multiple style="display:none"></label><div id="filelist"></div>`;
  const inp = b.querySelector("#fileInput");
  b.querySelector("#drop").onclick = () => inp.click();
  inp.onchange = () => uploadFiles(inp.files, b);
  loadDataFiles(b);
}
async function loadDataFiles(b) {
  // read source data listing via files endpoint (best-effort)
  const box = b.querySelector("#filelist"); if (!box) return;
  try {
    const r = await (await fetch("/api/projects/files?project_dir=" + enc(S.sourceDir))).json();
    const files = r.files || [];
    S._dataCount = files.length;
    box.innerHTML = files.length ? "" : `<div style="font-size:12px;color:#b5503c;padding:4px 2px">⚠ Empty so far — attach files so claims can be grounded.</div>`;
    files.forEach(f => { const row=document.createElement("div"); row.className="frow";
      const ext=(f.name.split(".").pop()||"").toUpperCase();
      row.innerHTML = `<span class="fkind">${ext}</span><span class="fname">${esc(f.name)}</span><span class="fmeta">${f.note||""}</span>`; box.appendChild(row); });
  } catch { box.innerHTML = `<div style="font-size:12px;color:var(--muted)">(could not list files)</div>`; }
}
async function uploadFiles(files, b) {
  if (!files || !files.length) return;
  const fd = new FormData(); fd.append("project_dir", S.sourceDir);
  for (const f of files) fd.append("files", f);
  try { await fetch("/api/projects/upload", {method:"POST", body:fd}); loadDataFiles(b); }
  catch (e) { alert("upload failed: " + e); }
}
async function renderPaperPanel(b, pdir) {
  b.innerHTML = `<div class="desc">Loading…</div>`;
  let files = [];
  try { files = (await (await fetch("/api/projects/output/list?project_dir=" + enc(pdir))).json()).files || []; }
  catch (e) { b.innerHTML = `<div class="desc">Could not load output: ${esc(String(e))}</div>`; return; }
  const has = n => files.find(f => f.name === n);
  const dlA = (rel, label, name) =>
    `<a class="dl" href="/api/projects/output/file?project_dir=${enc(pdir)}&rel=${enc(rel)}&t=${Date.now()}"`
    + (name ? ` download="${name}"` : ` target="_blank"`) + `>${label}</a>`;
  // download bar + readable manuscript (main) + collapsible file list
  b.innerHTML = `<div class="pkicker">Manuscript</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px">
      ${has('paper.docx') ? dlA('_paperflow_out/paper.docx','⬇ DOCX','paper.docx') : ''}
      ${has('paper.pdf')  ? dlA('_paperflow_out/paper.pdf','PDF ↗') : ''}
      ${has('paper.tex')  ? dlA('_paperflow_out/paper.tex','.tex ↗') : ''}
    </div>
    <div id="docview" class="ppaper"><div class="desc">불러오는 중…</div></div>
    <details style="margin-top:20px;border-top:1px solid var(--line);padding-top:12px">
      <summary style="cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600">생성 파일 ${files.length}개 (클릭해서 펼치기)</summary>
      <div id="outlist" style="margin-top:10px"></div>
    </details>`;
  const docview = b.querySelector("#docview");
  // MAIN: the readable manuscript (rendered preview, with working figure-prompt copy buttons)
  const prev = has('manuscript_preview.html');
  if (prev) await showOut(prev, docview, pdir);
  else docview.innerHTML = `<div class="desc">읽기용 미리보기 파일이 없어요. 아래 파일 목록에서 .md를 보세요.</div>`;
  // SECONDARY: every generated file, click to view in the same area
  const ol = b.querySelector("#outlist");
  files.forEach(f => { const btn = document.createElement("button"); btn.className = "ofile";
    btn.innerHTML = `<span class="ok">${f.kind}</span><span class="on">${esc(f.name)}</span><span class="os">${fmtSize(f.size)}</span>`;
    btn.onclick = () => { ol.querySelectorAll(".ofile").forEach(x=>x.classList.remove("active")); btn.classList.add("active");
      showOut(f, docview, pdir); docview.scrollIntoView({behavior:"smooth", block:"start"}); };
    ol.appendChild(btn); });
}
async function showOut(f, view, pdir) {
  const url = `/api/projects/output/file?project_dir=${enc(pdir)}&rel=${enc(f.rel)}&t=${Date.now()}`;
  if (f.kind === "pdf") { view.innerHTML = `<iframe src="${url}#view=FitH" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:10px"></iframe>`; return; }
  if (f.kind === "docx") { view.innerHTML = `<div class="desc">DOCX는 브라우저에서 미리볼 수 없어요. 위 ⬇ DOCX로 받으세요.<br><br></div><a class="dl" href="${url}" download="${esc(f.name)}">⬇ ${esc(f.name)} 다운로드</a>`; return; }
  view.innerHTML = `<div class="desc">Loading…</div>`;
  try { const r = await (await fetch(`/api/projects/output/preview?project_dir=${enc(pdir)}&rel=${enc(f.rel)}`)).json();
    view.innerHTML = r.html || `<pre style="white-space:pre-wrap;font-size:12.5px">${esc(r.text||"(empty)")}</pre>`;
    // belt-and-suspenders: rebind figure-prompt copy buttons (inline onclick already works via global)
    view.querySelectorAll(".pf-copy").forEach(btn => btn.onclick = () => window.pfCopyPrompt(btn));
  } catch { view.innerHTML = `<div class="desc">preview error</div>`; }
}
async function selectOut(f, view, pdir) {
  const url = `/api/projects/output/file?project_dir=${enc(pdir)}&rel=${enc(f.rel)}&t=${Date.now()}`;
  if (f.kind === "pdf") { view.innerHTML = `<iframe src="${url}#view=FitH" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:10px"></iframe>`; return; }
  if (f.kind === "docx") { view.innerHTML = `<a class="dl" href="${url}" download="${esc(f.name)}">⬇ ${esc(f.name)}</a>`; return; }
  view.innerHTML = `<div class="desc">Loading…</div>`;
  try { const r = await (await fetch(`/api/projects/output/preview?project_dir=${enc(pdir)}&rel=${enc(f.rel)}`)).json();
    view.innerHTML = r.html || `<pre style="white-space:pre-wrap;font-size:12.5px">${esc(r.text||"(empty)")}</pre>`;
  } catch { view.innerHTML = `<div class="desc">preview error</div>`; }
}
function fmtSize(n){ n=n||0; return n<1024?n+"B":n<1048576?(n/1024).toFixed(1)+"KB":(n/1048576).toFixed(1)+"MB"; }
let _saveT=null;
function markSaved(b){ clearTimeout(_saveT); _saveT=setTimeout(()=>{ saveInputs().catch(()=>{}); },600);
  const t=b.querySelector(".savetag")||b.parentElement.querySelector(".savetag"); if(t) t.textContent="✓ saved to source"; }
function saveTag(b){ const d=document.createElement("div"); d.className="savetag"; b.appendChild(d); }

// ================= BOOT =================
loadProjects();
startGreeting();
</script>
</body>
</html>
