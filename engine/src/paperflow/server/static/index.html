<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>paperpal — Manuscript Compiler</title>
<style>
  :root {
    --bg: #F0EEE6; --accent: #CC785C; --accent-2: #E8D5C4; --border: #D4C5B0;
    --ink: #1A1A1A; --body: #2D2D2D; --muted: #6B5E54; --code-bg: #E6E0D4; --code-ink: #8B4513;
    --ok: #7A9A6D; --err: #C25744; --surface: #F7F5EF; --highlight: rgba(204,120,92,.15);
    --data: #5B7A8C; --data-bg: #E6EDF0;
    --radius: 14px; --radius-sm: 9px; --rail-w: 246px; --aside-w: 296px;
    --shadow: 0 1px 0 rgba(26,26,26,.04), 0 8px 26px -18px rgba(60,40,30,.55);
    --ease: cubic-bezier(0.16,1,0.3,1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--body); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,h4 { color: var(--ink); font-weight: 650; letter-spacing: -.01em; margin: 0; }
  .serif { font-family: "Iowan Old Style","Palatino Linotype",Georgia,serif; }

  .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 26px; background: linear-gradient(180deg,#F4F1E9,#EFECE2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .logo { font-family: "Iowan Old Style",Georgia,serif; font-size: 1.32rem; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  .logo .dot { color: var(--accent); }
  .tag { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; }
  .spacer { flex: 1; }
  .providers { font-size: .73rem; color: var(--code-ink); background: var(--code-bg); border: 1px solid var(--border); padding: 5px 11px; border-radius: 999px; font-weight: 600; }
  .providers.warn { background: var(--accent-2); color: var(--err); }

  .shell { display: grid; grid-template-columns: var(--rail-w) 1fr var(--aside-w); height: calc(100vh - 61px); }
  .rail { border-right: 1px solid var(--border); padding: 18px 14px; background: #EFECE2; overflow-y: auto; display: flex; flex-direction: column; }
  .aside { border-left: 1px solid var(--border); padding: 18px 14px; background: #EFECE2; overflow-y: auto; }
  .rail-title, .aside-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); font-weight: 700; margin: 4px 6px 12px; }

  /* left nav (clickable items only) */
  .navfile { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; font: inherit; padding: 10px 11px; margin: 2px 0; border-radius: var(--radius-sm); cursor: pointer; color: var(--body); background: transparent; border: 1px solid transparent; transition: background .16s var(--ease), border-color .16s; }
  .navfile:hover { background: var(--highlight); }
  .navfile.active { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
  .navfile .di { flex: none; width: 18px; text-align: center; font-size: .9rem; }
  .navfile .fn { font-size: .87rem; color: var(--ink); font-weight: 600; }
  .navfile .dot { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex: none; }
  .navfile .dot.filled { background: var(--ok); }
  .createBtn { margin-top: 14px; width: 100%; border: none; background: var(--accent); color: #fff; font: inherit; font-size: .9rem; font-weight: 700; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; box-shadow: var(--shadow); transition: transform .15s var(--ease), opacity .2s; }
  .createBtn:hover:not(:disabled) { transform: translateY(-1px); }
  .createBtn:disabled { opacity: .4; cursor: not-allowed; }
  .railspace { flex: 1; }
  .openexist { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .openexist label { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .openexist input { width: 100%; margin-top: 6px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); font: inherit; font-size: .76rem; color: var(--ink); padding: 7px 9px; }
  .openexist input:focus { outline: none; border-color: var(--accent); }
  .openexist button { margin-top: 7px; width: 100%; border: 1px solid var(--border); background: var(--surface); color: var(--body); font: inherit; font-size: .76rem; padding: 7px; border-radius: 7px; cursor: pointer; }

  .work { display: flex; flex-direction: column; min-width: 0; }
  .canvas { flex: 1; overflow-y: auto; padding: 24px 34px; display: flex; flex-direction: column; }
  .crumb { font-size: .74rem; color: var(--muted); margin-bottom: 6px; }
  .canvas h2.title { font-size: 1.5rem; margin-bottom: 4px; }
  .ehint { color: var(--muted); font-size: .86rem; line-height: 1.6; margin: 6px 0 14px; }
  .editor { flex: 1; width: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-family: ui-monospace, Menlo, monospace; font-size: .86rem; color: var(--ink); padding: 16px 18px; line-height: 1.65; resize: none; box-shadow: var(--shadow); }
  .editor.one { flex: none; height: 46px; font-family: inherit; font-size: .95rem; }
  .editor:focus { outline: none; border-color: var(--accent); }
  .editor::placeholder { color: var(--muted); opacity: .55; }
  .savednote { font-size: .72rem; color: var(--ok); margin-top: 8px; height: 14px; }
  /* journal info structured sub-form */
  .subform { display: flex; flex-direction: column; gap: 1px; }
  /* outline mode toggle (Quick input / Structured outline) */
  .omode { display: inline-flex; gap: 4px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin: 4px 0 14px; }
  .omode-opt { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
  .omode-opt.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .omode-opt input { accent-color: var(--accent); margin: 0; }
  .sflabel { font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 13px 2px 5px; }
  .sflabel .req { color: var(--err); } .sflabel .opt { color: var(--muted); font-weight: 600; font-size: .6rem; text-transform: none; letter-spacing: 0; }
  .sfinput { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font: inherit; font-size: .9rem; color: var(--ink); padding: 9px 12px; resize: vertical; line-height: 1.5; }
  .sfinput:focus { outline: none; border-color: var(--accent); }
  .sfinput::placeholder { color: var(--muted); opacity: .55; }
  .nrow { display: flex; gap: 7px; align-items: center; margin-bottom: 6px; }
  .nrow .nnum { flex: none; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; font-weight: 700; color: var(--accent); min-width: 20px; }
  .nrow .rmbtn { flex: none; width: 28px; height: 28px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 7px; cursor: pointer; font-size: .8rem; }
  .nrow .rmbtn:hover { color: var(--err); border-color: var(--err); }
  .addbtn { margin: 2px 0 4px; border: 1px dashed var(--accent); background: var(--highlight); color: var(--accent); font: inherit; font-size: .8rem; font-weight: 700; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .addbtn:hover { background: var(--accent); color: #fff; }
  /* outline: fixed sections, one free-text message each */
  .osec { margin: 16px 0 4px; }
  .osec-h { display: flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 700; color: var(--ink); padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .osec-h .fixed { margin-left: auto; font-size: .56rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .osec-h .reqd { font-size: .56rem; font-weight: 700; color: var(--err); }
  .osec-h .opt { font-size: .56rem; font-weight: 700; color: var(--muted); }
  .osecta { width: 100%; border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); background: var(--surface); font: inherit; font-size: .88rem; color: var(--ink); padding: 11px 12px; resize: vertical; min-height: 92px; line-height: 1.6; box-shadow: var(--shadow); }
  .osecta:focus { outline: none; border-color: var(--accent); }
  .osecta::placeholder { color: var(--muted); opacity: .5; }
  /* shared by renderList (+row component) */
  .obtn { flex: none; width: 26px; height: 26px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 6px; cursor: pointer; font-size: .72rem; line-height: 1; }
  .obtn:hover { color: var(--accent); border-color: var(--accent); } .obtn.rm:hover { color: var(--err); border-color: var(--err); }
  .obtn:disabled { opacity: .3; cursor: not-allowed; }
  /* data panel: dropzone + file list */
  .dropzone { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; margin: 18px 0 14px; padding: 30px 20px; border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--highlight); }
  .dropzone .dz-icon { font-size: 1.5rem; }
  .dropzone .dz-main { font-weight: 700; font-size: .92rem; color: var(--ink); }
  .dropzone .dz-sub { font-size: .68rem; color: var(--muted); letter-spacing: .04em; }
  .data-split { display: flex; gap: 14px; align-items: flex-start; }
  .filelist { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 7px; max-height: 460px; overflow-y: auto; }
  .fl-empty { color: var(--muted); font-size: .84rem; padding: 8px 2px; }
  .frow { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); cursor: pointer; transition: border-color .12s, background .12s; }
  .frow:hover { border-color: var(--accent); }
  .frow.sel { border-color: var(--accent); background: var(--highlight); }
  .frow .fkind { flex: none; font-family: ui-monospace, Menlo, monospace; font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--highlight); padding: 3px 7px; border-radius: 5px; min-width: 40px; text-align: center; }
  .frow .fname { flex: 1; font-size: .86rem; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow.noted .fname::after { content: "📝"; margin-left: 6px; font-size: .72rem; }
  .frow .fmeta { flex: none; font-size: .72rem; color: var(--muted); }
  /* note panel (right side of the data split) */
  .notepanel { flex: 1 1 0; min-width: 0; position: sticky; top: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 15px; box-shadow: var(--shadow); min-height: 200px; }
  .np-empty { color: var(--muted); font-size: .84rem; line-height: 1.7; text-align: center; padding: 44px 12px; }
  .np-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .np-head .fkind { flex: none; font-family: ui-monospace, Menlo, monospace; font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--highlight); padding: 3px 7px; border-radius: 5px; }
  .np-head .np-name { font-size: .92rem; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-sub { font-size: .68rem; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .np-ta { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font: inherit; font-size: .88rem; color: var(--ink); padding: 11px 12px; resize: vertical; min-height: 150px; line-height: 1.6; }
  .np-ta:focus { outline: none; border-color: var(--accent); }
  .np-ta::placeholder { color: var(--muted); opacity: .5; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h3 { font-size: .98rem; margin-bottom: 10px; display: flex; align-items: center; gap: 9px; }
  .badge { font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; background: var(--highlight); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-weight: 700; }
  .badge.ok { background: #EAF0E6; color: #4f6a44; } .badge.warn { background: var(--accent-2); color: var(--err); }
  .muted { color: var(--muted); font-size: .86rem; line-height: 1.6; }
  .toks { display: flex; gap: 18px; flex-wrap: wrap; font-size: .82rem; margin-top: 8px; }
  .toks b { color: var(--ink); }
  .log { background: #2a2620; color: #e7dcc8; border-radius: var(--radius-sm); padding: 12px 14px; font-family: ui-monospace,Menlo,monospace; font-size: .74rem; line-height: 1.7; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }

  /* question dock (center bottom) */
  .chatdock { border-top: 1px solid var(--border); background: linear-gradient(180deg,#F4F1E9,#EFECE2); padding: 14px 26px 18px; max-height: 46vh; overflow-y: auto; }
  .dock-title { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 7px; }
  .dock-hint { font-size: .72rem; color: var(--muted); margin-bottom: 12px; }
  .q { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 9px; }
  .q .qq { font-size: .86rem; color: var(--ink); font-weight: 600; margin-bottom: 7px; display: flex; gap: 8px; align-items: baseline; }
  .q .risk { font-size: .56rem; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--code-bg); color: var(--code-ink); text-transform: uppercase; }
  .q .risk.high { background: var(--accent-2); color: var(--err); }
  .q textarea { width: 100%; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); font: inherit; font-size: .85rem; color: var(--ink); padding: 8px 10px; resize: vertical; min-height: 38px; line-height: 1.5; }
  .q textarea:focus { outline: none; border-color: var(--accent); }
  .q textarea::placeholder { color: var(--muted); opacity: .65; font-style: italic; }
  .skipbtn { margin-top: 6px; border: 1px dashed var(--border); background: transparent; color: var(--muted); font: inherit; font-size: .72rem; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .skipbtn:hover { border-color: var(--accent); color: var(--accent); }
  /* generated-paper viewer (center) */
  .paperBtn { width: 100%; margin-top: 8px; border: 1px solid var(--accent); background: var(--highlight); color: var(--accent); font: inherit; font-size: .86rem; font-weight: 700; padding: 10px; border-radius: var(--radius-sm); cursor: pointer; }
  .paperBtn:hover { background: var(--accent); color: #fff; }
  .paperbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 10px; }
  .paperbar .dl { font-size: .78rem; font-weight: 700; color: var(--accent); text-decoration: none; border: 1px solid var(--border); padding: 5px 11px; border-radius: 7px; }
  .paperbar .dl:hover { border-color: var(--accent); background: var(--highlight); }
  .paperframe { width: 100%; height: calc(100vh - 230px); min-height: 460px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
  .logdetails { margin-top: 12px; } .logdetails summary { cursor: pointer; font-size: .8rem; color: var(--muted); font-weight: 700; }

  /* generated-output: file list (left) + read-only preview (right) */
  .outwrap { display: grid; grid-template-columns: 240px 1fr; gap: 14px; height: calc(100vh - 210px); min-height: 420px; }
  .outlist { overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 8px; box-shadow: var(--shadow); }
  .outlist .ol-head { font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; padding: 6px 8px; }
  .ofile { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; padding: 8px 9px; margin: 1px 0; border-radius: 8px; cursor: pointer; color: var(--body); background: transparent; border: 1px solid transparent; }
  .ofile:hover { background: var(--highlight); }
  .ofile.active { background: #fff; border-color: var(--border); box-shadow: var(--shadow); }
  .ofile .ok { flex: none; font-size: .62rem; font-weight: 700; text-transform: uppercase; color: var(--code-ink); background: var(--code-bg); padding: 2px 6px; border-radius: 5px; }
  .ofile .on { font-size: .82rem; color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ofile .os { margin-left: auto; font-size: .68rem; color: var(--muted); flex: none; }
  .outview { overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); padding: 18px 20px; }
  .outview .pf-pre { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; color: var(--code-ink); }
  .outview .ov-empty { color: var(--muted); font-size: .86rem; padding: 30px 8px; text-align: center; }
  .outview iframe { width: 100%; height: 100%; min-height: 380px; border: none; }
  .outview .dlbig { display: inline-block; margin-top: 8px; font-size: .82rem; font-weight: 700; color: #fff; background: var(--accent); padding: 9px 14px; border-radius: 8px; text-decoration: none; }
  /* Stage 3: plan confirm + chat */
  .planview { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin: 14px 0 10px; }
  .plabel { font-size: .64rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin: 12px 0 5px; }
  .pcontrib { font-size: .92rem; font-weight: 600; color: var(--ink); background: var(--highlight); border-radius: 8px; padding: 9px 11px; }
  .claims { margin: 0 0 4px 16px; font-size: .84rem; color: var(--ink); } .claims li { margin: 3px 0; }
  .secblock { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 11px; margin-bottom: 7px; box-shadow: var(--shadow); }
  .sechead { font-size: .86rem; font-weight: 800; color: var(--ink); }
  .secsum { font-size: .78rem; color: var(--muted); margin: 2px 0 4px; }
  .subs { margin: 0 0 0 16px; font-size: .82rem; color: var(--accent); font-weight: 600; } .subs li { margin: 2px 0; }
  .nosubs { font-size: .74rem; color: var(--muted); font-style: italic; }
  .figgrid { display: flex; flex-direction: column; gap: 9px; }
  .figcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px; box-shadow: var(--shadow); }
  .figcard svg { display: block; }
  .figmeta { font-size: .76rem; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .figmeta .fkind { font-family: ui-monospace, Menlo, monospace; font-size: .58rem; font-weight: 700; text-transform: uppercase; color: var(--accent); background: var(--highlight); padding: 2px 6px; border-radius: 5px; }
  /* Stage 3: claim graph cards */
  .graphgrid { display: flex; flex-direction: column; gap: 9px; }
  .gcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; box-shadow: var(--shadow); }
  .gclaim { font-size: .85rem; font-weight: 800; color: var(--ink); margin-bottom: 5px; }
  .gsub { border-left: 2px solid var(--border); padding: 3px 0 3px 9px; margin: 5px 0 0 4px; }
  .gsubtext { font-size: .8rem; color: var(--ink); margin-bottom: 3px; }
  .gchips { display: flex; flex-wrap: wrap; gap: 4px; }
  .gchip { font-size: .66rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); }
  .gchip.ev { color: #2f6f4f; background: #eaf5ee; border-color: #cfe6d8; }
  .gchip.me { color: var(--accent); background: var(--highlight); }
  .gchip.da { color: #6b5e54; background: var(--code-bg); }
  .gchip.fi { color: #7a5cc2; background: #efeafb; border-color: #ddd2f2; }
  .gchip.re { color: #8b4513; background: #f4ece0; border-color: #e3d4bf; }
  .gnone { font-size: .72rem; color: var(--muted); font-style: italic; }
  .ghint { font-size: .74rem; color: var(--muted); margin: -2px 0 8px; }
  .chatwrap { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  .chatlog { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; margin-bottom: 10px; }
  .cmsg { font-size: .86rem; line-height: 1.55; padding: 8px 12px; border-radius: 12px; max-width: 90%; }
  .cmsg.user { align-self: flex-end; background: var(--accent); color: #fff; } .cmsg.user b { display: none; }
  .cmsg.agent { align-self: flex-start; background: var(--code-bg); color: var(--ink); } .cmsg.agent b { display: none; }
  .cmsg.muted { opacity: .6; }
  .chatrow { display: flex; gap: 8px; align-items: flex-end; }
  .chatrow textarea { flex: 1; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font: inherit; font-size: .88rem; color: var(--ink); padding: 10px 12px; resize: vertical; min-height: 42px; line-height: 1.5; }
  .chatrow textarea:focus { outline: none; border-color: var(--accent); }
  .send.go { background: var(--ink); }
  .composer-bar { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .send { border: none; background: var(--accent); color: #fff; font: inherit; font-size: .86rem; font-weight: 700; padding: 10px 18px; border-radius: var(--radius-sm); cursor: pointer; box-shadow: var(--shadow); }
  .send:disabled { opacity: .45; cursor: not-allowed; }

  /* workflow tree (right) */
  .steps { position: relative; margin: 0; padding: 0; list-style: none; }
  .steps::before { content: ""; position: absolute; left: 19px; top: 16px; bottom: 16px; width: 2px; background: var(--border); }
  .step { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 9px 10px; margin-bottom: 2px; border-radius: var(--radius-sm); border: 1px solid transparent; transition: background .2s var(--ease); }
  .step.active { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
  .step.locked { opacity: .55; }
  .node { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; background: var(--surface); border: 2px solid var(--border); color: var(--muted); z-index: 1; }
  .step.done .node { background: var(--ok); border-color: var(--ok); color: #fff; }
  .step.active .node { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--highlight); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px var(--highlight); } 50% { box-shadow: 0 0 0 7px rgba(204,120,92,.08); } }
  .step.locked .node { background: var(--accent-2); }
  .step .meta { display: flex; flex-direction: column; gap: 1px; padding-top: 1px; }
  .step .k { font-size: .62rem; color: var(--muted); letter-spacing: .04em; }
  .step .t { font-size: .85rem; color: var(--ink); font-weight: 600; }
  .step .s { font-size: .68rem; color: var(--muted); }
  .step.active .s { color: var(--accent); font-weight: 600; }
  .step.done .s { color: var(--ok); }
  /* step 0 sub-checklist */
  .subs { list-style: none; margin: 6px 0 10px 30px; padding: 0; }
  .subs li { display: flex; align-items: center; gap: 8px; font-size: .76rem; color: var(--muted); padding: 3px 0; }
  .subs li .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex: none; }
  .subs li.on { color: var(--ink); } .subs li.on .sdot { background: var(--ok); }

  /* ===== dashboard ===== */
  #dashboard { display: none; padding: 30px 40px 50px; max-width: 1180px; margin: 0 auto; }
  body.dash #dashboard { display: block; }
  body.dash #workspace { display: none; }
  .dash-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .dash-head h1 { font-size: 1.7rem; } .dash-head .sub { color: var(--muted); font-size: .9rem; }
  .dash-sub { color: var(--muted); font-size: .92rem; margin-bottom: 22px; }
  .newbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 9px 18px; font: inherit; font-size: .84rem; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); }
  .newbtn:hover { transform: translateY(-1px); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }
  .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); cursor: pointer; transition: transform .2s var(--ease), border-color .2s; position: relative; overflow: hidden; }
  .pcard:hover { transform: translateY(-3px); border-color: var(--accent); }
  .pcard .ptop { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
  .pcard .pic { flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: .82rem; font-weight: 700; }
  .pcard h3.pt { font-size: 1.0rem; line-height: 1.35; }
  .pcard .pmeta { font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .pcard .ptag { margin-left: auto; flex: none; font-size: .6rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .ptag.done { background: #EAF0E6; color: #4f6a44; } .ptag.active { background: var(--highlight); color: var(--accent); } .ptag.new { background: var(--code-bg); color: var(--code-ink); }
  .prog { margin: 16px 0 12px; }
  .prog .pl { display: flex; justify-content: space-between; align-items: baseline; font-size: .76rem; margin-bottom: 6px; }
  .prog .pl .pct { font-weight: 700; color: var(--ink); font-size: .92rem; }
  .prog .pl .stp { color: var(--muted); }
  .bar { height: 8px; border-radius: 999px; background: var(--code-bg); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #d98e6f); }
  .pfoot { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--border); font-size: .76rem; }
  .ddl { font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .ddl.soon { background: #f6e3dd; color: var(--err); } .ddl.mid { background: var(--code-bg); color: var(--code-ink); } .ddl.far { background: #EAF0E6; color: #4f6a44; } .ddl.none { background: var(--code-bg); color: var(--muted); }
  .newcard { border: 2px dashed var(--border); background: transparent; border-radius: var(--radius); display: grid; place-items: center; min-height: 200px; cursor: pointer; color: var(--muted); text-align: center; }
  .newcard:hover { border-color: var(--accent); color: var(--accent); }
  .newcard .plus { font-size: 1.8rem; }
  /* new-project modal */
  .modal { position: fixed; inset: 0; background: rgba(26,20,16,.4); display: none; place-items: center; z-index: 60; }
  .modal.show { display: grid; }
  .modal .box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 380px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.5); }
  .modal h3 { margin-bottom: 14px; }
  .modal label { display: block; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; margin: 12px 2px 5px; }
  .modal input { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font: inherit; font-size: .9rem; padding: 9px 12px; }
  .modal input:focus { outline: none; border-color: var(--accent); }

  .modal .mrow button { flex: 1; border-radius: 8px; padding: 10px; font: inherit; font-weight: 700; cursor: pointer; border: 1px solid var(--border); }
  .modal .mrow .ok { background: var(--accent); color: #fff; border-color: var(--accent); }
  .backbtn { background: var(--surface); border: 1px solid var(--border); color: var(--body); font: inherit; font-size: .78rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

<script>
const $ = (id) => document.getElementById(id);
let projectDir = null;
let stepIndex = {};

const FIELDS = [
  {key:"journal", label:"journal info", icon:"🎯", composite:true,
   hint:"받을 정보가 정해져 있어 칸을 나눴습니다. <b>*</b>=필수. Target journal에 가이드라인 URL을 넣으면 글자수·figure 제한을 자동으로 긁어옵니다."},
  {key:"core", label:"core message", icon:"💡", coreform:true,
   hint:"이 논문이 증명하는 것. <b>One paragraph</b>와 <b>Novelty(기여)</b>가 필수 — Novelty는 claim graph의 핵심 주장이 됩니다. <b>＋</b>로 여러 개 추가하세요."},
  {key:"outline", label:"outline", icon:"🗂️", outlineform:true,
   hint:"<b>Quick input</b>(자유 작성·붙여넣기)과 <b>Structured outline</b>(섹션별 작성) 중 선택하세요. 어떤 방식이든 백엔드에서 동일한 구조로 정리되고, 원문은 그대로 보존됩니다."},
  {key:"data", label:"data", icon:"📎", dataform:true,
   hint:"분석에 사용한 데이터·결과 파일을 가능한 한 모두 올려주세요. PaperFlow가 파일명·컬럼·내용·연구문서 문맥으로 각 파일의 의미를 <b>먼저 추론</b>합니다. <b>파일 설명은 선택</b> — 비워두면 AI가 추론하고, 불명확한 파일만 질문합니다."},
];
const inputs = {journal:"", core:"", outline:""};
let dataFiles = [];   // uploaded files under <project>/data/ (+ reference/)
let selectedData = null;  // rel path of the file whose note is open
let current = null;
let diskMode = false;  // existing project with on-disk inputs but no saved UI state
let paperReady = false;  // a compiled paper.pdf exists for this project

// journal info is structured (fixed fields we always need)
const JSUB = [
  {k:"field",         label:"Author's field",        req:true,  type:"input", ph:"Computational biomechanics"},
  {k:"target",        label:"Target journal(s)",     req:true,  type:"list", reorder:true,  ph:"Journal of Biomechanics — https://www.example.com/author-guidelines"},
  {k:"title",         label:"Paper title",           req:false, type:"input", ph:"관상동맥 플라크 파열 위험지표 정의 및 민감도 분석 (비우면 마지막에 AI가 제안)"},
  {k:"authors",       label:"Authors (저자 순서대로)",  req:false, type:"list", reorder:true,  ph:"Jeff Kim"},
  {k:"corresponding", label:"Corresponding author(s)", req:false, type:"list", reorder:false, ph:"Advisor Name"},
  {k:"affiliation",   label:"Affiliation (소속)",     req:false, type:"input", ph:"KAIST, Dept. of Mechanical Engineering"},
];
const JF = {field:"", title:"", affiliation:"", target:[""], authors:[""], corresponding:[""]};

// core message is structured (paragraph + variable-length novelty list + optionals)
const CM = {paragraph:"", sentence:"", keywords:[""], outscope:""};
let novelty = [""];
const NOVELTY_PH = ["ΔPSS가 정적 PSS보다 파열 위험을 더 잘 설명한다",
                    "파열 위험지표에 강도 정규화가 필요하다",
                    "고체 도메인 물성치가 파열 위험에 가장 민감하다"];

// outline = fixed sections, each ONE free-text message (user numbers 1./2. if they want)
const SECTIONS = [
  {key:"introduction", label:"Introduction", req:false},
  {key:"method",       label:"Method",       req:true},
  {key:"result",       label:"Result",       req:true},
  {key:"discussion",   label:"Discussion",   req:false},
  {key:"conclusion",   label:"Conclusion",   req:false},
];
const outlineData = {introduction:"", method:"", result:"", discussion:"", conclusion:""};
let outlineMode = "structured";   // "quick" | "structured"
let outlineQuick = "";            // raw free-text for Quick input (preserved verbatim)
const QUICK_PH = "연구의 목적, 사용한 방법, 주요 결과, 논문의 논리 흐름을 자유롭게 작성하세요.\n기존 outline이나 AI가 작성한 내용을 그대로 붙여넣어도 됩니다.";
const SECTION_PH = {
  introduction: "이 섹션에서 전하고 싶은 메시지를 자유롭게 적어주세요.\n예) 관상동맥 질환 부담 → 파열이 핵심 → 기존 지표의 한계 → 우리 접근",
  method: "Method에서 전하고 싶은 내용을 자유롭게. 소제목을 미리 생각했다면 1. 2. 처럼 줄로 나눠도 됩니다.\n예)\n1. Cost-effective FSI 프레임워크 구성\n2. 환자 맞춤 경계조건 보정\n3. 메쉬·시간 수렴 검증",
  result: "Result에서 전하고 싶은 내용을 자유롭게. (1. 2. 로 나눠도 됨)\n예)\n1. Sobol 민감도: 물성치 > 혈류역학 > 형태 (Fig 3)\n2. ΔPSS가 정적 PSS보다 파열 위험을 잘 설명",
  discussion: "자유롭게.\n예) 결과의 의미·한계, 선행연구와의 비교",
  conclusion: "자유롭게.\n예) 핵심 기여 요약 + 임상적 함의(과대주장 금지)",
};
function secHasContent(secKey) {
  return outlineData[secKey].trim().length > 0;
}
function assembleOutlineMd() {
  // Phase A = numbered claim lines per [Section]; Phase B = the raw message per section.
  const a = [], b = ["## Phase B (structure)"];
  let n = 0;
  for (const sec of SECTIONS) {
    const txt = outlineData[sec.key].trim();
    if (!txt) continue;
    a.push(`[${sec.label}]`);
    b.push(`### ${sec.label}`, txt, "");
    const lines = txt.split("\n")
      .map(x => x.replace(/^\s*\d+[.)]\s*/, "").replace(/^\s*[-*]\s*/, "").trim())
      .filter(Boolean);
    lines.forEach(ln => { n++; a.push(`${n}. ${ln}`); });
    a.push("");
  }
  return a.join("\n") + "\n" + b.join("\n");
}

function isFilled(key) {
  if (key === "journal") return !!(JF.field.trim() && JF.target.some(t => t.trim()));  // title optional
  if (key === "core") return !!(CM.paragraph.trim() && novelty.some(n => n.trim()));
  if (key === "outline") return outlineMode === "quick"
    ? outlineQuick.trim().length > 0
    : (secHasContent("method") && secHasContent("result"));
  if (key === "data") return dataFiles.length > 0;  // optional — never gates Create
  return !!inputs[key].trim();
}
function assembleCoreMd() {
  const lines = ["## One paragraph", CM.paragraph, "", "## Novelty"];
  novelty.filter(n => n.trim()).forEach(n => lines.push(`- ${n.trim()}`));
  lines.push("");
  if (CM.sentence.trim()) lines.push("## One sentence", CM.sentence.trim(), "");
  const kw = CM.keywords.filter(k => k.trim()).map(k => k.trim());
  if (kw.length) lines.push("## Keywords", kw.join(", "), "");
  if (CM.outscope.trim()) lines.push("## Out of scope", CM.outscope.trim(), "");
  return lines.join("\n");
}
function assembleJournalMd() {
  const lines = ["## Author's field", JF.field, "", "## Target journals"];
  JF.target.filter(t => t.trim()).forEach((t, i) => lines.push(`${i + 1}. ${t.trim()}`));  // ranked
  lines.push("");
  if (JF.title.trim()) lines.push("## Paper title", JF.title.trim(), "");
  const extra = [];
  const auth = JF.authors.filter(a => a.trim()).map(a => a.trim());
  if (auth.length) extra.push(`- authors: ${auth.join("; ")}`);  // author order preserved
  const corr = JF.corresponding.filter(c => c.trim()).map(c => c.trim());
  if (corr.length) extra.push(`- corresponding author: ${corr.join("; ")}`);
  if (JF.affiliation.trim()) extra.push(`- affiliation: ${JF.affiliation.trim()}`);
  if (extra.length) { lines.push("## Extra info"); lines.push(...extra); }
  return lines.join("\n");
}

async function postJSON(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function setProviders(list) {
  const el = $("providers");
  if (list && list.length) { el.textContent = "providers: " + list.join(", "); el.classList.remove("warn"); }
  else { el.textContent = "⚠ API 키 없음 (engine/.env)"; el.classList.add("warn"); }
}

// ---------- left nav ----------
function renderNav() {
  const nav = $("nav"); nav.innerHTML = "";
  FIELDS.forEach(f => {
    const b = document.createElement("button");
    b.className = "navfile" + (current === f.key ? " active" : "");
    b.innerHTML = `<span class="di">${f.icon}</span><span class="fn">${f.label}</span>
      <span class="dot ${isFilled(f.key) ? 'filled' : ''}"></span>`;
    b.onclick = () => openField(f.key);
    nav.appendChild(b);
  });
}

// ---------- center editor ----------
function openField(key) {
  current = key;
  const f = FIELDS.find(x => x.key === key);

  if (f.composite) {  // journal info — structured sub-form
    let html = `<div class="crumb">입력 / ${f.label}</div>
      <h2 class="title serif">${f.label}</h2><div class="ehint">${f.hint}</div><div class="subform">`;
    for (const s of JSUB) {
      const tag = s.req ? '<span class="req">*</span>' : '<span class="opt">선택</span>';
      html += `<label class="sflabel">${s.label} ${tag}</label>`;
      html += s.type === "list"
        ? `<div id="jl_${s.k}"></div><button class="addbtn" data-jadd="${s.k}">＋ 추가</button>`
        : `<input type="text" class="sfinput" data-jk="${s.k}">`;
    }
    html += `</div><div class="savednote" id="savednote"></div>`;
    $("canvas").innerHTML = html;
    document.querySelectorAll("[data-jk]").forEach(el => {  // single fields
      const k = el.dataset.jk;
      el.value = JF[k];
      el.placeholder = "예) " + JSUB.find(s => s.k === k).ph;
      el.oninput = () => { JF[k] = el.value; renderNav(); refreshStep0(); note(); };
    });
    JSUB.filter(s => s.type === "list").forEach(s => {  // list fields
      renderList($("jl_" + s.k), JF[s.k], () => "예) " + s.ph, s.reorder);
    });
    document.querySelectorAll("[data-jadd]").forEach(btn => {
      const k = btn.dataset.jadd, s = JSUB.find(x => x.k === k);
      btn.onclick = () => { JF[k].push(""); renderList($("jl_" + k), JF[k], () => "예) " + s.ph, s.reorder); };
    });
    renderNav();
    return;
  }

  if (f.coreform) {  // core message — paragraph + variable novelty list + optionals
    $("canvas").innerHTML = `<div class="crumb">입력 / ${f.label}</div>
      <h2 class="title serif">${f.label}</h2><div class="ehint">${f.hint}</div><div class="subform">
      <label class="sflabel">One paragraph <span class="req">*</span></label>
      <textarea class="sfinput" id="cm_paragraph" rows="4"></textarea>
      <label class="sflabel">Novelty <span class="req">*</span> <span class="opt">기여/새로움 — claim graph의 핵심 주장</span></label>
      <div id="noveltyList"></div>
      <button class="addbtn" id="addNovelty">＋ novelty 추가</button>

    const bindCM = (id, k, ph) => {

    bindCM("cm_outscope", "outscope", "예) 임상 예측·인과는 주장하지 않음");
    renderNoveltyRows();

  if (f.outlineform) {  // two input modes -> one normalized schema in the backend
    const toggle = `<div class="omode">

    } else {

    document.querySelectorAll('input[name="omode"]').forEach(r => {
      r.onchange = () => { outlineMode = r.value; note(); openField("outline"); };  // re-render, no data loss
    });
    if (outlineMode === "quick") {
      const ta = $("quickInput");
      ta.value = outlineQuick; ta.placeholder = QUICK_PH;
      ta.oninput = () => { outlineQuick = ta.value; renderNav(); refreshStep0(); note(); };
      ta.focus();
    } else {
      SECTIONS.forEach(sec => {
        const ta = $("osec_" + sec.key);
        ta.value = outlineData[sec.key];
        ta.placeholder = SECTION_PH[sec.key];

  if (f.dataform) {  // file uploads (experiment data / references the writer grounds claims on)
    $("canvas").innerHTML = `<div class="crumb">입력 / ${f.label}</div>

        <span class="dz-sub">CSV · TXT · DAT · PDF · PNG · XLSX · JSON · BIB</span>
      </div>

        <div class="filelist" id="filelist"></div>
        <div class="notepanel" id="notepanel"></div>
      </div>
      <div class="savednote" id="savednote"></div>`;
    const inp = $("fileInput"), dz = $("dropzone");
    inp.onchange = () => { if (inp.files.length) uploadFiles(inp.files); inp.value = ""; };
    dz.onclick = () => inp.click();  // open the OS file picker
    dz.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inp.click(); } };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over");
      if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); };
    renderFileList();
    renderNotePanel();
    loadDataFiles();
    renderNav();
    return;
  }

  $("canvas").innerHTML = `
    <div class="crumb">입력 / ${f.label}</div>
    <h2 class="title serif">${f.label}</h2>
    <div class="ehint">${f.hint}</div>
    <${f.multiline ? "textarea" : "input type='text'"} class="editor ${f.multiline?'':'one'}" id="editorInput"></${f.multiline?'textarea':'input'}>
    <div class="savednote" id="savednote"></div>`;
  const ed = $("editorInput");
  ed.value = inputs[key];
  ed.placeholder = f.tmpl;
  ed.oninput = () => { inputs[key] = ed.value; renderNav(); refreshStep0(); $("savednote").textContent = "✓ 자동 저장됨"; };

}

function mkBtn(label, title, disabled, onclick, isRm) {
  const b = document.createElement("button");
  b.className = "obtn" + (isRm ? " rm" : ""); b.textContent = label; b.title = title;

}
function note() { const el = $("savednote"); if (el) el.textContent = "✓ 자동 저장됨"; }

// reusable +row list: ordered (▲▼) when reorder=true, removable (✕) when >1 item
function renderList(box, arr, getPh, reorder) {
  if (!box) return;
  box.innerHTML = "";
  arr.forEach((val, i) => {
    const row = document.createElement("div"); row.className = "nrow";
    const num = document.createElement("span"); num.className = "nnum"; num.textContent = (i + 1) + ".";
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "sfinput"; inp.value = val; inp.placeholder = getPh(i);
    inp.oninput = () => { arr[i] = inp.value; renderNav(); refreshStep0(); note(); };
    row.append(num, inp);
    if (reorder) {
      row.append(
        mkBtn("▲", "위로", i === 0, () => { [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; renderList(box, arr, getPh, reorder); }),
        mkBtn("▼", "아래로", i === arr.length - 1, () => { [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; renderList(box, arr, getPh, reorder); }),
      );
    }
    if (arr.length > 1) {
      row.append(mkBtn("✕", "삭제", false, () => { arr.splice(i, 1); renderList(box, arr, getPh, reorder); renderNav(); refreshStep0(); }, true));
    }
    box.appendChild(row);
  });
}

function renderNoveltyRows() {
  const box = $("noveltyList"); if (!box) return;
  box.innerHTML = "";
  novelty.forEach((val, i) => {
    const row = document.createElement("div"); row.className = "nrow";
    const num = document.createElement("span"); num.className = "nnum"; num.textContent = (i+1) + ".";
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "sfinput"; inp.value = val;
    inp.placeholder = "예) " + (NOVELTY_PH[i] || `novelty ${i+1}`);
    inp.oninput = () => { novelty[i] = inp.value; renderNav(); refreshStep0(); $("savednote").textContent = "✓ 자동 저장됨"; };
    row.appendChild(num); row.appendChild(inp);
    if (novelty.length > 1) {
      const rm = document.createElement("button"); rm.className = "rmbtn"; rm.textContent = "✕";
      rm.title = "삭제";
      rm.onclick = () => { novelty.splice(i, 1); renderNoveltyRows(); renderNav(); refreshStep0(); };
      row.appendChild(rm);
    }
    box.appendChild(row);
  });
}

  });
  $("s0s").textContent = `${done} / ${FIELDS.length} 작성됨`;
  const allCore = isFilled("journal") && isFilled("core") && isFilled("outline");  // data optional
  const s0 = $("s0");
  if (allCore) { s0.className = "step done"; s0.querySelector(".node").textContent = "✓"; }
  else { s0.className = "step active"; s0.querySelector(".node").textContent = "0"; }

function showStatus(badge, crumb, msg, kind) {

// ---------- questions ----------
const _UNKNOWN = "(모름 — 나중에 보완)";
function renderQuestions(diag) {
  showStatus(diag.classification || "진단 완료", "진단 완료",
    `분류: <b>${diag.classification||'-'}</b> · 확보된 항목 ${(diag.present||[]).length}개. ${diag.notes||''}`);
  const wrap = $("questions"); wrap.innerHTML = "";
  if (!diag.questions || !diag.questions.length) {
    wrap.innerHTML = `<p class="muted">추가 질문이 없습니다. 바로 생성할 수 있어요.</p>`;
  } else {
    for (const q of diag.questions) {
      const risk = q.reviewer_risk === "high" ? "risk high" : "risk";
      const div = document.createElement("div"); div.className = "q";
      div.innerHTML = `<div class="qq"><span>${q.question}</span><span class="${risk}">${q.reviewer_risk||''}</span></div>`;
      const ta = document.createElement("textarea");
      ta.placeholder = q.example ? ("예) " + q.example) : "여기에 답변…";
      ta.dataset.field = q.field;
      ta.oninput = refreshAnswerGate;
      const skip = document.createElement("button");
      skip.className = "skipbtn"; skip.type = "button"; skip.textContent = "모름 / 나중에";
      skip.onclick = () => { ta.value = _UNKNOWN; refreshAnswerGate(); };
      div.append(ta, skip); wrap.appendChild(div);
    }
  }
  $("dock").style.display = "block";
  refreshAnswerGate();
}
// hard gate: every question needs a response (an answer OR an explicit '모름')
function refreshAnswerGate() {
  const tas = [...document.querySelectorAll("#questions textarea")];
  const pending = tas.filter(ta => !ta.value.trim()).length;
  $("answerBtn").disabled = pending > 0;
  $("answerNote").textContent = pending > 0
    ? `${pending}개 미응답 — 답하거나 '모름'을 눌러주세요`
    : (tas.length ? "모든 질문 응답됨 · 생성 가능" : "");
}
$("answerBtn").onclick = async () => {
  $("answerBtn").disabled = true;
  try {
    const answers = {};
    document.querySelectorAll("#questions textarea").forEach(ta => {
      const v = ta.value.trim(); if (v) answers[ta.dataset.field] = v;  // '모름' included
    });
    await postJSON("/api/projects/answers", {project_dir: projectDir, answers});
    $("answerNote").textContent = `${Object.keys(answers).length}개 저장됨 · 계획 수립`;
    $("dock").style.display = "none";
    await startPlan();   // Stage 3: build the plan, then confirm via chat
  } catch (e) { $("answerNote").textContent = "오류: " + e; refreshAnswerGate(); }
};

// ---------- generate + live tree (STEP 0 stays done on top) ----------
function renderPipeline(steps) {
  const ul = $("steps");
  ul.innerHTML = `<li class="step done"><span class="node">✓</span>
    <span class="meta"><span class="k">STEP 0</span><span class="t">입력 수집</span><span class="s">완료</span></span></li>`;
  stepIndex = {};
  steps.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "step locked";
    li.innerHTML = `<span class="node">${i+1}</span><span class="meta">
      <span class="k">STEP ${i+1}</span><span class="t">${s.label}</span><span class="s">대기</span></span>`;
    ul.appendChild(li); stepIndex[s.id] = li;
  });
}
function setStepActive(stepId, label) {
  let passed = true;
  for (const [id, li] of Object.entries(stepIndex)) {
    if (id === stepId) { li.className = "step active"; li.querySelector(".s").textContent = label || "진행 중…"; passed = false; }
    else if (passed && !li.classList.contains("done")) {
      li.className = "step done"; li.querySelector(".node").textContent = "✓"; li.querySelector(".s").textContent = "완료";
    }
  }
}
function markAllDone() {
  for (const li of Object.values(stepIndex)) { li.className = "step done"; li.querySelector(".node").textContent = "✓"; li.querySelector(".s").textContent = "완료"; }
}
let logLines = [];
function logLine(s) { logLines.push(s); if (logLines.length>200) logLines.shift(); const el=$("logbox"); if (el){ el.textContent=logLines.join("\n"); el.scrollTop=el.scrollHeight; } }

// ---------- Stage 3: plan -> confirm via chat -> generate ----------
let planProposal = null, chatHistory = [];
const SEC_LABEL = {introduction:"Introduction", method:"Methods", result:"Results", discussion:"Discussion", conclusion:"Conclusion", abstract:"Abstract"};
async function startPlan() {
  logLines = []; chatHistory = [];
  $("canvas").innerHTML = `<div class="crumb">제작 계획</div>
    <div class="card"><h3>계획 수립 중… <span class="badge">planning</span></h3>
    <p class="muted">claim graph · 섹션 구조 · figure를 설계하고 있어요. 우측 트리 참고.</p>
    <div class="log" id="logbox"></div></div>`;
  const res = await postJSON("/api/projects/plan", {project_dir: projectDir});
  if (res.error === "unanswered_questions") {
    showStatus("미응답", "계획 차단", `미응답 질문 ${(res.pending||[]).length}개. 답하거나 '모름'을 눌러주세요.`, "warn");
    $("dock").style.display = "block"; refreshAnswerGate(); return;
  }
  renderPipeline(res.steps);
  const es = new EventSource(`/api/projects/plan/${res.job_id}/stream`);
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "progress") { if (m.step_id && stepIndex[m.step_id]) setStepActive(m.step_id, m.label); logLine(m.raw||m.label); }
    else if (m.type === "plan_ready") { markAllDone(); es.close(); planProposal = m.proposal;
      chatHistory = [{role:"assistant", content:"아래 구성으로 작성할게요. 소제목·figure를 보고 바꿀 게 있으면 채팅으로 말해주세요. 좋으면 ‘제작 시작’을 누르면 됩니다."}];
      renderPlanView(); }
    else if (m.type === "error") { es.close(); showStatus("실패","오류", m.error, "warn"); }
  };
  es.onerror = () => es.close();
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderPlanView() {
  const p = planProposal || {};
  const claims = (p.claims||[]).map(c => `<li>${esc(c.text)}</li>`).join("");
  const structure = (p.sections||[]).map(sec => {
    const s = (p.structure||{})[sec] || {}; const subs = (s.subheadings||[]);
    const subhtml = subs.length ? `<ul class="subs">${subs.map(h=>`<li>${esc(h)}</li>`).join("")}</ul>` : `<div class="nosubs">소제목 없음</div>`;
    return `<div class="secblock"><div class="sechead">${esc(SEC_LABEL[sec]||sec)}</div>
      <div class="secsum">${esc(s.summary||"")}</div>${subhtml}</div>`;
  }).join("");
  const figs = (p.figures||[]).map(f => `<div class="figcard">${f.svg||""}
      <div class="figmeta"><span class="fkind">${esc(f.kind||"figure")}</span> ${esc(f.section||"")}<br>${esc(f.message||"")}</div></div>`).join("");
  const chips = (arr, cls) => (arr||[]).map(x => `<span class="gchip ${cls}">${esc(x.text||x.id||"")}</span>`).join("");
  const subRow = (sc) => {
    const groups = [
      chips(sc.evidence, "ev"), chips(sc.methods, "me"), chips(sc.data, "da"),
      chips(sc.figures, "fi"), chips(sc.refs, "re"),
    ].filter(Boolean).join("");
    return `<div class="gsub"><div class="gsubtext">${esc(sc.text||"")}</div>
      <div class="gchips">${groups || "<span class='gnone'>근거 노드 없음</span>"}</div></div>`;
  };
  const graph = (p.graph||[]).map(g => `<div class="gcard">
      <div class="gclaim">${esc((g.claim||{}).text||"")}</div>
      ${(g.subclaims||[]).map(subRow).join("")}</div>`).join("");
  const chat = chatHistory.map(m => `<div class="cmsg ${m.role}"><b>${m.role==="user"?"나":"agent"}</b> ${esc(m.content)}</div>`).join("");
  $("canvas").innerHTML = `<div class="crumb">제작 계획 · 확인/수정</div>
    <h2 class="title serif">제작 계획 — 확인하고 수정하세요</h2>
    <div class="ehint">분류 <b>${esc(p.classification||"-")}</b>. claim graph·소제목·figure를 검토하고, 바꿀 게 있으면 아래 채팅으로. 좋으면 <b>제작 시작</b>.</div>
    <div class="planview">
      <div class="plancol">
        <div class="plabel">핵심 기여</div><div class="pcontrib">${esc(p.main_contribution||"")}</div>
        <div class="plabel">주요 주장</div><ul class="claims">${claims||"<li class='muted'>(없음)</li>"}</ul>
        <div class="plabel">섹션 구조 · 소제목</div>${structure}
        <div class="plabel">Claim graph · 주장별 근거</div>
        <div class="graphgrid">${graph||"<div class='muted'>(없음)</div>"}</div>
      </div>
      <div class="plancol">
        <div class="plabel">Figure / Table 설계 (스케치)</div>
        <div class="figgrid">${figs||"<div class='muted'>(없음)</div>"}</div>
      </div>
    </div>
    <div class="chatwrap"><div class="chatlog" id="chatlog">${chat}</div>
      <div class="ghint">claim graph도 채팅으로 편집할 수 있어요. 예) E1을 C1.2가 아니라 C1.1을 지지하게 바꿔줘</div>
      <div class="chatrow">
        <textarea id="chatInput" rows="1" placeholder="수정 요청… 예) Result 소제목을 '검증·선정·민감도'로 바꿔줘"></textarea>
        <button class="send" id="chatSend">보내기</button>
        <button class="send go" id="startGenBtn">▶ 제작 시작</button>
      </div></div>`;
  $("chatSend").onclick = sendChat;
  $("startGenBtn").onclick = startGenerate;
  const ci = $("chatInput");
  ci.onkeydown = (e) => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } };
  const cl = $("chatlog"); if (cl) cl.scrollTop = cl.scrollHeight;
}
async function sendChat() {
  const ci = $("chatInput"); const msg = (ci.value||"").trim(); if (!msg) return;
  chatHistory.push({role:"user", content: msg}); ci.value = ""; ci.disabled = true;
  renderPlanView(); $("chatlog").innerHTML += `<div class="cmsg agent muted">생각 중…</div>`;
  try {
    const r = await postJSON("/api/projects/chat", {project_dir: projectDir, message: msg, history: chatHistory});
    if (r.proposal) planProposal = r.proposal;
    chatHistory.push({role:"assistant", content: r.reply || "반영했어요."});
  } catch (e) { chatHistory.push({role:"assistant", content:"오류: " + e}); }
  renderPlanView();
}

async function startGenerate() {
  logLines = [];
  $("canvas").innerHTML = `<div class="crumb">생성</div>
    <div class="card"><h3>논문 생성 중… <span class="badge">running</span></h3>
    <p class="muted">우측 workflow tree에서 현재 단계를 확인하세요.</p>
    <div class="log" id="logbox"></div></div>`;
  const res = await postJSON("/api/projects/generate", {project_dir: projectDir});
  if (res.error === "unanswered_questions") {  // hard gate (server-side backstop)
    showStatus("미응답", "생성 차단", `아직 응답하지 않은 질문 ${ (res.pending||[]).length }개가 있어요. 모두 답하거나 '모름'을 눌러주세요.`, "warn");
    $("dock").style.display = "block"; refreshAnswerGate();
    return;
  }
  renderPipeline(res.steps);
  const es = new EventSource(`/api/projects/generate/${res.job_id}/stream`);
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "progress") { if (m.step_id && stepIndex[m.step_id]) setStepActive(m.step_id, m.label); logLine(m.raw || m.label); }
    else if (m.type === "done") {
      markAllDone(); es.close();
      paperReady = true; $("paperBtn").style.display = "";
      showPaper(m);
    } else if (m.type === "error") { es.close(); showStatus("실패", "오류", m.error, "warn"); }
  };
  es.onerror = () => es.close();
}

// ---------- generated-paper viewer (center = files, right of it = read-only preview) ----------
function paperUrl(kind) {
  return `/api/projects/paper?project_dir=${encodeURIComponent(projectDir)}&kind=${kind}&t=${Date.now()}`;
}
function outFileUrl(rel) {
  return `/api/projects/output/file?project_dir=${encodeURIComponent(projectDir)}&rel=${encodeURIComponent(rel)}&t=${Date.now()}`;
}
let outFiles = [], selectedOut = null;
// preview priority: the canonical manuscript first, then the assembled .docx/paper
function _outRank(f) {
  const o = {"manuscript.json":0, "manuscript_preview.html":1, "paper.docx":2};
  if (o[f.name] != null) return o[f.name];
  if (f.kind === "md") return 3;
  if (f.kind === "json") return 5;
  return 4;
}
async function showPaper(meta) {
  meta = meta || {};
  const toks = (meta.input_tokens != null) ? `<div class="toks">
      <span>input <b>${meta.input_tokens.toLocaleString()}</b></span>
      <span>output <b>${meta.output_tokens.toLocaleString()}</b></span>
      <span>cached <b>${meta.cached_tokens.toLocaleString()}</b> (${Math.round((meta.cache_hit_rate||0)*100)}%)</span>
    </div>` : "";
  const cls = meta.classification ? `<span class="muted">분류 <b>${meta.classification}</b></span>` : "";
  $("canvas").innerHTML = `<div class="crumb">생성된 논문 · 파일을 클릭하면 오른쪽에 미리보기</div>
    <h2 class="title serif">${JF.title || wtitleText()}</h2>
    <div class="paperbar">
      <span class="badge ok">완료</span>${cls}
      <a class="dl" href="${outFileUrl('_paperflow_out/paper.docx')}">⬇ DOCX</a>
      <a class="dl" href="${paperUrl('pdf')}" target="_blank">PDF ↗</a>
      <a class="dl" href="${paperUrl('tex')}" target="_blank">.tex ↗</a>
    </div>${toks}
    <div class="outwrap">
      <div class="outlist" id="outlist"><div class="ol-head">생성된 파일</div></div>
      <div class="outview" id="outview"><div class="ov-empty">왼쪽에서 파일을 클릭하세요.</div></div>
    </div>`;
  try {
    const r = await (await fetch("/api/projects/output/list?project_dir=" + encodeURIComponent(projectDir))).json();
    outFiles = (r.files || []).slice().sort((a,b) => _outRank(a) - _outRank(b));
  } catch { outFiles = []; }
  renderOutList();
  if (outFiles.length) selectOut(outFiles[0].rel);
}
function renderOutList() {
  const box = $("outlist"); if (!box) return;
  box.innerHTML = `<div class="ol-head">생성된 파일</div>`;
  if (!outFiles.length) { box.innerHTML += `<div class="ov-empty">생성된 파일이 없습니다.</div>`; return; }
  outFiles.forEach(f => {
    const b = document.createElement("button");
    b.className = "ofile" + (f.rel === selectedOut ? " active" : "");
    b.innerHTML = `<span class="ok">${f.kind}</span><span class="on">${f.name}</span>
      <span class="os">${fmtSize(f.size)}</span>`;
    b.onclick = () => selectOut(f.rel);
    box.appendChild(b);
  });
}
async function selectOut(rel) {
  selectedOut = rel;
  renderOutList();
  const view = $("outview"); if (!view) return;
  const f = outFiles.find(x => x.rel === rel) || {};
  if (f.kind === "pdf") {
    view.innerHTML = `<iframe src="${outFileUrl(rel)}#view=FitH" title="${f.name}"></iframe>`;
    return;
  }
  if (f.kind === "docx") {
    view.innerHTML = `<div class="ov-empty">DOCX는 브라우저에서 미리볼 수 없어요.<br>
      <a class="dlbig" href="${outFileUrl(rel)}">⬇ ${f.name} 다운로드</a></div>`;
    return;
  }
  view.innerHTML = `<div class="ov-empty">불러오는 중…</div>`;
  try {
    const r = await (await fetch(`/api/projects/output/preview?project_dir=${encodeURIComponent(projectDir)}&rel=${encodeURIComponent(rel)}`)).json();
    if (r.error) { view.innerHTML = `<div class="ov-empty">미리보기를 불러올 수 없습니다.</div>`; return; }
    view.innerHTML = r.html || `<div class="ov-empty">(빈 파일)</div>`;
  } catch (e) {
    view.innerHTML = `<div class="ov-empty">오류: ${e}</div>`;
  }
}
function wtitleText() { const el = $("wtitle"); return el ? el.textContent : "Manuscript"; }

// ---------- data files (experiment data / references) ----------
function fmtSize(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+" MB" : n >= 1e3 ? Math.round(n/1e3)+" KB" : (n||0)+" B"; }
async function loadDataFiles() {
  if (!projectDir) { dataFiles = []; return; }
  try {
    const r = await (await fetch("/api/projects/files?project_dir=" + encodeURIComponent(projectDir))).json();
    dataFiles = r.files || [];
  } catch { dataFiles = []; }
  renderFileList(); renderNotePanel(); renderNav(); refreshStep0();
}
async function uploadFiles(fileList) {
  if (!projectDir) return;
  const fd = new FormData();
  fd.append("project_dir", projectDir);
  for (const f of fileList) fd.append("files", f);
  const nt = $("savednote"); if (nt) nt.textContent = "업로드 중…";
  try {
    const r = await fetch("/api/projects/upload", {method:"POST", body: fd});
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (nt) nt.textContent = "✓ 업로드됨";
  } catch (e) { if (nt) nt.textContent = "업로드 실패: " + e; }
  await loadDataFiles();
}
async function deleteDataFile(rel) {
  if (!projectDir) return;
  await postJSON("/api/projects/files/delete", {project_dir: projectDir, rel});
  await loadDataFiles();
}
function renderFileList() {
  const box = $("filelist"); if (!box) return;
  box.innerHTML = "";
  if (!dataFiles.length) { box.innerHTML = `<div class="fl-empty">아직 업로드된 파일이 없습니다.</div>`; return; }
  dataFiles.forEach(f => {
    const row = document.createElement("div");
    row.className = "frow" + (f.rel === selectedData ? " sel" : "") + (f.note ? " noted" : "");
    row.title = "클릭하면 오른쪽에 설명을 적을 수 있어요";
    const cols = (f.columns && f.columns.length) ? ` · ${f.columns.length} cols` : "";
    row.innerHTML = `<span class="fkind">${f.kind || "file"}</span>
      <span class="fname">${f.name}</span>
      <span class="fmeta">${fmtSize(f.size)}${cols}</span>`;
    row.onclick = () => selectData(f.rel);
    row.appendChild(mkBtn("✕", "삭제", false,
      (e) => { e.stopPropagation(); deleteDataFile(f.rel); }, true));
    box.appendChild(row);
  });
}
function selectData(rel) {
  selectedData = rel;
  renderFileList();
  renderNotePanel();
  const ta = $("noteTa"); if (ta) ta.focus();
}
function renderNotePanel() {
  const box = $("notepanel"); if (!box) return;
  const f = dataFiles.find(x => x.rel === selectedData);
  if (!f) {
    box.innerHTML = `<div class="np-empty">왼쪽에서 파일을 클릭하면<br>설명을 적을 수 있어요 <b>(선택)</b>.<br>비워두면 PaperFlow가 자동으로 의미를 추론합니다.</div>`;
    return;
  }
  const cols = (f.columns && f.columns.length) ? ` · ${f.columns.join(", ")}` : "";
  box.innerHTML = `<div class="np-head"><span class="fkind">${f.kind || "file"}</span>
      <span class="np-name">${f.name}</span></div>
    <div class="np-sub">${f.rel}${cols}</div>
    <textarea class="np-ta" id="noteTa"
      placeholder="파일 설명 (선택) — 비워두면 PaperFlow가 자동으로 추론합니다.\n예) VI=2 하중조건에서 그룹별 1차/전체 Sobol 민감도.\nResult 섹션의 '물성치가 가장 민감' 주장 근거(Fig 3)."></textarea>`;
  const ta = $("noteTa");
  ta.value = f.note || "";
  ta.oninput = () => { f.note = ta.value; };          // keep locally so re-renders don't lose it
  ta.onchange = () => saveNote(f.rel, ta.value);      // persist on blur
}
async function saveNote(rel, note) {
  const f = dataFiles.find(x => x.rel === rel); if (f) f.note = note;
  renderFileList();  // refresh the "noted" marker
  try {
    await postJSON("/api/projects/files/note", {project_dir: projectDir, rel, note});
    const nt = $("savednote"); if (nt) nt.textContent = "✓ 설명 저장됨";
  } catch (e) { const nt = $("savednote"); if (nt) nt.textContent = "설명 저장 실패: " + e; }
}

// ---------- structured UI state (lossless reopen) ----------
function uiState() { return {JF, CM, novelty, outlineData, outlineMode, outlineQuick}; }
function resetState() {
  Object.assign(JF, {field:"", title:"", affiliation:"", target:[""], authors:[""], corresponding:[""]});
  Object.assign(CM, {paragraph:"", sentence:"", outscope:""}); CM.keywords = [""];
  novelty = [""];
  SECTIONS.forEach(s => outlineData[s.key] = "");
  outlineMode = "structured"; outlineQuick = "";
}
function restoreState(st) {
  if (!st) { resetState(); return; }
  Object.assign(JF, st.JF || {});
  ["target", "authors", "corresponding"].forEach(k => { if (!Array.isArray(JF[k]) || !JF[k].length) JF[k] = [""]; });
  Object.assign(CM, st.CM || {});
  if (!Array.isArray(CM.keywords) || !CM.keywords.length) CM.keywords = [""];
  novelty = (st.novelty && st.novelty.length) ? st.novelty : [""];
  SECTIONS.forEach(s => {
    const v = (st.outlineData || {})[s.key];
    // tolerate old format ([{heading,intent}]) by flattening to text
    outlineData[s.key] = typeof v === "string" ? v
      : Array.isArray(v) ? v.map(o => [o.heading, o.intent].filter(Boolean).join(" — ")).filter(Boolean).join("\n")
      : "";
  });
  outlineMode = (st.outlineMode === "quick" || st.outlineMode === "structured") ? st.outlineMode : "structured";
  outlineQuick = typeof st.outlineQuick === "string" ? st.outlineQuick : "";
}

// ---------- dashboard ----------
function ddlInfo(deadline) {
  if (!deadline) return {cls:"none", label:"마감 미정"};
  const days = Math.ceil((new Date(deadline) - new Date()) / 86400000);
  const cls = days <= 14 ? "soon" : days <= 45 ? "mid" : "far";
  return {cls, label: days >= 0 ? `D-${days}` : `D+${-days}`};
}
function statusLabel(s) { return s === "done" ? "완료" : s === "active" ? "작업 중" : "신규"; }

async function loadProjects() {
  const r = await (await fetch("/api/projects/list")).json();
  setProviders(r.providers);
  const g = $("pgrid"); g.innerHTML = "";
  (r.projects || []).forEach(p => {
    const card = document.createElement("div"); card.className = "pcard";
    const dd = ddlInfo(p.deadline);
    card.innerHTML = `<div class="ptop"><span class="pic">${(p.title || p.name || 'P').trim()[0] || 'P'}</span>
        <div><h3 class="pt serif">${p.title || p.name}</h3><div class="pmeta">${p.field || p.name}</div></div>
        <span class="ptag ${p.status}">${statusLabel(p.status)}</span></div>
      <div class="prog"><div class="pl"><span class="pct">${p.progress}%</span><span class="stp">${p.step}</span></div>
      <div class="bar"><span style="width:${p.progress}%"></span></div></div>
      <div class="pfoot"><span class="ddl ${dd.cls}">${dd.label}</span><span class="nx">${p.name}</span></div>`;
    card.onclick = () => openExisting(p.project_dir, p.title || p.name);
    g.appendChild(card);
  });
  const nc = document.createElement("div"); nc.className = "newcard";
  nc.innerHTML = `<div><div class="plus">＋</div><div>새 프로젝트</div></div>`;
  nc.onclick = openNewModal;
  g.appendChild(nc);
}
function showDashboard() {
  document.body.classList.add("dash");
  $("backBtn").style.display = "none"; $("wtitle").style.display = "none";
  loadProjects();
}
function enterWorkspace(dir, title) {
  projectDir = dir;
  document.body.classList.remove("dash");
  $("backBtn").style.display = ""; $("wtitle").style.display = "";
  $("wtitle").textContent = title || dir.split("/").pop();
  $("dock").style.display = "none";
  dataFiles = []; selectedData = null;
  $("paperBtn").style.display = paperReady ? "" : "none";  // show only if a paper exists
  renderNav(); renderStep0();
  if (paperReady) showPaper({}); else openField("journal");  // completed -> show the paper
  loadDataFiles();  // populate the data-panel dot from disk
  if (diskMode) {
    $("createBtn").disabled = false; $("createBtn").textContent = "진단 시작 (저장된 입력)";
    showStatus("기존 입력", "기존 프로젝트", "이 프로젝트는 저장된 입력 파일이 있어요. 폼은 비어 보여도 디스크 입력으로 진단/생성합니다.");
  } else {
    $("createBtn").textContent = "＋ Create Journal";
  }
}
async function openExisting(dir, title) {
  const r = await (await fetch("/api/projects/state?project_dir=" + encodeURIComponent(dir))).json();
  diskMode = !r.ui_state;
  paperReady = !!r.paper_ready;
  restoreState(r.ui_state);
  enterWorkspace(dir, title);
}
$("paperBtn").onclick = () => showPaper({});
function openNewModal() { $("np_name").value = ""; $("np_deadline").value = ""; $("newModal").classList.add("show"); }
$("newBtn").onclick = openNewModal;
$("np_cancel").onclick = () => $("newModal").classList.remove("show");
$("np_create").onclick = async () => {
  const name = $("np_name").value.trim(); if (!name) return;
  const today = new Date().toISOString().slice(0, 10);
  const r = await postJSON("/api/projects/create", {name, deadline: $("np_deadline").value, created: today});
  $("newModal").classList.remove("show");
  diskMode = false; paperReady = false; resetState();
  enterWorkspace(r.project_dir, name);
};
$("backBtn").onclick = showDashboard;

// ---------- init ----------
showDashboard();
</script>
