<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>paperpal — Manuscript Compiler</title>
<style>
  :root {
    --bg: #F0EEE6; --accent: #CC785C; --accent-2: #E8D5C4; --border: #D4C5B0;
    --ink: #1A1A1A; --body: #2D2D2D; --muted: #6B5E54; --code-bg: #E6E0D4; --code-ink: #8B4513;
    --ok: #7A9A6D; --err: #C25744; --surface: #F7F5EF; --highlight: rgba(204,120,92,.15);
    --data: #5B7A8C; --data-bg: #E6EDF0;
    --radius: 14px; --radius-sm: 9px; --rail-w: 246px; --aside-w: 296px;
    --shadow: 0 1px 0 rgba(26,26,26,.04), 0 8px 26px -18px rgba(60,40,30,.55);
    --ease: cubic-bezier(0.16,1,0.3,1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--body); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,h4 { color: var(--ink); font-weight: 650; letter-spacing: -.01em; margin: 0; }
  .serif { font-family: "Iowan Old Style","Palatino Linotype",Georgia,serif; }

  .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 26px; background: linear-gradient(180deg,#F4F1E9,#EFECE2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .logo { font-family: "Iowan Old Style",Georgia,serif; font-size: 1.32rem; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  .logo .dot { color: var(--accent); }
  .tag { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; }
  .spacer { flex: 1; }
  .providers { font-size: .73rem; color: var(--code-ink); background: var(--code-bg); border: 1px solid var(--border); padding: 5px 11px; border-radius: 999px; font-weight: 600; }
  .providers.warn { background: var(--accent-2); color: var(--err); }

  .shell { display: grid; grid-template-columns: var(--rail-w) 1fr var(--aside-w); height: calc(100vh - 61px); }
  .rail { border-right: 1px solid var(--border); padding: 18px 14px; background: #EFECE2; overflow-y: auto; display: flex; flex-direction: column; }
  .aside { border-left: 1px solid var(--border); padding: 18px 14px; background: #EFECE2; overflow-y: auto; }
  .rail-title, .aside-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); font-weight: 700; margin: 4px 6px 12px; }

  /* left nav (clickable items only) */
  .navfile { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; font: inherit; padding: 10px 11px; margin: 2px 0; border-radius: var(--radius-sm); cursor: pointer; color: var(--body); background: transparent; border: 1px solid transparent; transition: background .16s var(--ease), border-color .16s; }
  .navfile:hover { background: var(--highlight); }
  .navfile.active { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
  .navfile .di { flex: none; width: 18px; text-align: center; font-size: .9rem; }
  .navfile .fn { font-size: .87rem; color: var(--ink); font-weight: 600; }
  .navfile .dot { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex: none; }
  .navfile .dot.filled { background: var(--ok); }
  .createBtn { margin-top: 14px; width: 100%; border: none; background: var(--accent); color: #fff; font: inherit; font-size: .9rem; font-weight: 700; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; box-shadow: var(--shadow); transition: transform .15s var(--ease), opacity .2s; }
  .createBtn:hover:not(:disabled) { transform: translateY(-1px); }
  .createBtn:disabled { opacity: .4; cursor: not-allowed; }
  .railspace { flex: 1; }
  .openexist { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .openexist label { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .openexist input { width: 100%; margin-top: 6px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); font: inherit; font-size: .76rem; color: var(--ink); padding: 7px 9px; }
  .openexist input:focus { outline: none; border-color: var(--accent); }
  .openexist button { margin-top: 7px; width: 100%; border: 1px solid var(--border); background: var(--surface); color: var(--body); font: inherit; font-size: .76rem; padding: 7px; border-radius: 7px; cursor: pointer; }

  .work { display: flex; flex-direction: column; min-width: 0; }
  .canvas { flex: 1; overflow-y: auto; padding: 24px 34px; display: flex; flex-direction: column; }
  .crumb { font-size: .74rem; color: var(--muted); margin-bottom: 6px; }
  .canvas h2.title { font-size: 1.5rem; margin-bottom: 4px; }
  .ehint { color: var(--muted); font-size: .86rem; line-height: 1.6; margin: 6px 0 14px; }
  .editor { flex: 1; width: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-family: ui-monospace, Menlo, monospace; font-size: .86rem; color: var(--ink); padding: 16px 18px; line-height: 1.65; resize: none; box-shadow: var(--shadow); }
  .editor.one { flex: none; height: 46px; font-family: inherit; font-size: .95rem; }
  .editor:focus { outline: none; border-color: var(--accent); }
  .editor::placeholder { color: var(--muted); opacity: .55; }
  .savednote { font-size: .72rem; color: var(--ok); margin-top: 8px; height: 14px; }
  /* journal info structured sub-form */
  .subform { display: flex; flex-direction: column; gap: 1px; }
  .sflabel { font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 13px 2px 5px; }
  .sflabel .req { color: var(--err); } .sflabel .opt { color: var(--muted); font-weight: 600; font-size: .6rem; text-transform: none; letter-spacing: 0; }
  .sfinput { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font: inherit; font-size: .9rem; color: var(--ink); padding: 9px 12px; resize: vertical; line-height: 1.5; }
  .sfinput:focus { outline: none; border-color: var(--accent); }
  .sfinput::placeholder { color: var(--muted); opacity: .55; }
  .nrow { display: flex; gap: 7px; align-items: center; margin-bottom: 6px; }
  .nrow .nnum { flex: none; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; font-weight: 700; color: var(--accent); min-width: 20px; }
  .nrow .rmbtn { flex: none; width: 28px; height: 28px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 7px; cursor: pointer; font-size: .8rem; }
  .nrow .rmbtn:hover { color: var(--err); border-color: var(--err); }
  .addbtn { margin: 2px 0 4px; border: 1px dashed var(--accent); background: var(--highlight); color: var(--accent); font: inherit; font-size: .8rem; font-weight: 700; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .addbtn:hover { background: var(--accent); color: #fff; }
  /* outline: fixed sections, one free-text message each */
  .osec { margin: 16px 0 4px; }
  .osec-h { display: flex; align-items: center; gap: 8px; font-size: .92rem; font-weight: 700; color: var(--ink); padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .osec-h .fixed { margin-left: auto; font-size: .56rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .osec-h .reqd { font-size: .56rem; font-weight: 700; color: var(--err); }
  .osec-h .opt { font-size: .56rem; font-weight: 700; color: var(--muted); }
  .osecta { width: 100%; border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); background: var(--surface); font: inherit; font-size: .88rem; color: var(--ink); padding: 11px 12px; resize: vertical; min-height: 92px; line-height: 1.6; box-shadow: var(--shadow); }
  .osecta:focus { outline: none; border-color: var(--accent); }
  .osecta::placeholder { color: var(--muted); opacity: .5; }
  /* shared by renderList (+row component) */
  .obtn { flex: none; width: 26px; height: 26px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 6px; cursor: pointer; font-size: .72rem; line-height: 1; }
  .obtn:hover { color: var(--accent); border-color: var(--accent); } .obtn.rm:hover { color: var(--err); border-color: var(--err); }
  .obtn:disabled { opacity: .3; cursor: not-allowed; }
  /* data panel: dropzone + file list */
  .dropzone { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; margin: 18px 0 14px; padding: 30px 20px; border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--highlight); }
  .dropzone .dz-icon { font-size: 1.5rem; }
  .dropzone .dz-main { font-weight: 700; font-size: .92rem; color: var(--ink); }
  .dropzone .dz-sub { font-size: .68rem; color: var(--muted); letter-spacing: .04em; }
  .data-split { display: flex; gap: 14px; align-items: flex-start; }
  .filelist { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 7px; max-height: 460px; overflow-y: auto; }
  .fl-empty { color: var(--muted); font-size: .84rem; padding: 8px 2px; }
  .frow { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); cursor: pointer; transition: border-color .12s, background .12s; }
  .frow:hover { border-color: var(--accent); }
  .frow.sel { border-color: var(--accent); background: var(--highlight); }
  .frow .fkind { flex: none; font-family: ui-monospace, Menlo, monospace; font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--highlight); padding: 3px 7px; border-radius: 5px; min-width: 40px; text-align: center; }
  .frow .fname { flex: 1; font-size: .86rem; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow.noted .fname::after { content: "📝"; margin-left: 6px; font-size: .72rem; }
  .frow .fmeta { flex: none; font-size: .72rem; color: var(--muted); }
  /* note panel (right side of the data split) */
  .notepanel { flex: 1 1 0; min-width: 0; position: sticky; top: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 15px; box-shadow: var(--shadow); min-height: 200px; }
  .np-empty { color: var(--muted); font-size: .84rem; line-height: 1.7; text-align: center; padding: 44px 12px; }
  .np-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .np-head .fkind { flex: none; font-family: ui-monospace, Menlo, monospace; font-size: .58rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--highlight); padding: 3px 7px; border-radius: 5px; }
  .np-head .np-name { font-size: .92rem; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .np-sub { font-size: .68rem; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .np-ta { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font: inherit; font-size: .88rem; color: var(--ink); padding: 11px 12px; resize: vertical; min-height: 150px; line-height: 1.6; }
  .np-ta:focus { outline: none; border-color: var(--accent); }
  .np-ta::placeholder { color: var(--muted); opacity: .5; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h3 { font-size: .98rem; margin-bottom: 10px; display: flex; align-items: center; gap: 9px; }
  .badge { font-size: .62rem; text-transform: uppercase; letter-spacing: .1em; background: var(--highlight); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-weight: 700; }
  .badge.ok { background: #EAF0E6; color: #4f6a44; } .badge.warn { background: var(--accent-2); color: var(--err); }
  .muted { color: var(--muted); font-size: .86rem; line-height: 1.6; }
  .toks { display: flex; gap: 18px; flex-wrap: wrap; font-size: .82rem; margin-top: 8px; }
  .toks b { color: var(--ink); }
  .log { background: #2a2620; color: #e7dcc8; border-radius: var(--radius-sm); padding: 12px 14px; font-family: ui-monospace,Menlo,monospace; font-size: .74rem; line-height: 1.7; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }

  /* question dock (center bottom) */
  .chatdock { border-top: 1px solid var(--border); background: linear-gradient(180deg,#F4F1E9,#EFECE2); padding: 14px 26px 18px; max-height: 46vh; overflow-y: auto; }
  .dock-title { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 7px; }
  .dock-hint { font-size: .72rem; color: var(--muted); margin-bottom: 12px; }
  .q { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 9px; }
  .q .qq { font-size: .86rem; color: var(--ink); font-weight: 600; margin-bottom: 7px; display: flex; gap: 8px; align-items: baseline; }
  .q .risk { font-size: .56rem; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--code-bg); color: var(--code-ink); text-transform: uppercase; }
  .q .risk.high { background: var(--accent-2); color: var(--err); }
  .q textarea { width: 100%; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); font: inherit; font-size: .85rem; color: var(--ink); padding: 8px 10px; resize: vertical; min-height: 38px; line-height: 1.5; }
  .q textarea:focus { outline: none; border-color: var(--accent); }
  .q textarea::placeholder { color: var(--muted); opacity: .65; font-style: italic; }
  .skipbtn { margin-top: 6px; border: 1px dashed var(--border); background: transparent; color: var(--muted); font: inherit; font-size: .72rem; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .skipbtn:hover { border-color: var(--accent); color: var(--accent); }
  /* six-stage product flow */
  .stage-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .stage-kicker .num { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 50%; background: var(--accent); color: #fff; font-size: .72rem; font-weight: 800; }
  .stage-kicker .name { color: var(--accent); font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
  .stage-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .stage-actions .secondary { border: 1px solid var(--border); background: var(--surface); color: var(--body); }
  .source-summary { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; margin: 12px 0; }
  .source-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .source-stat b { display: block; color: var(--ink); font-size: 1.1rem; }
  .source-stat span { color: var(--muted); font-size: .68rem; }
  .interview-wrap { max-width: 860px; margin: 0 auto; width: 100%; }
  .interview-progress { display: flex; align-items: center; gap: 10px; margin: 10px 0 16px; }
  .interview-progress .bar { flex: 1; height: 7px; overflow: hidden; border-radius: 99px; background: var(--code-bg); }
  .interview-progress .bar span { display: block; height: 100%; background: var(--ok); transition: width .2s; }
  .interview-progress small { color: var(--muted); font-weight: 700; }
  .question-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .question-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
  .qstatus { font-size: .6rem; font-weight: 800; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--code-bg); color: var(--muted); }
  .qstatus.resolved { background: #EAF0E6; color: #4f6a44; }
  .qstatus.unknown { background: var(--accent-2); color: var(--err); }
  .question-card .risk { font-size: .6rem; font-weight: 800; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--code-bg); color: var(--code-ink); }
  .question-card .risk.high { background: var(--accent-2); color: var(--err); }
  .question-text { color: var(--ink); font-size: 1.05rem; font-weight: 700; line-height: 1.55; margin-bottom: 14px; }
  .question-context { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 13px; }
  .question-context > div { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 11px; color: var(--muted); font-size: .78rem; line-height: 1.55; }
  .question-context b { display: block; color: var(--accent); font-size: .62rem; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 3px; }
  .answer-area { width: 100%; min-height: 106px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--ink); padding: 11px 12px; font: inherit; line-height: 1.55; resize: vertical; }
  .answer-area:focus { outline: none; border-color: var(--accent); }
  .question-history { margin-top: 11px; border-top: 1px dashed var(--border); padding-top: 9px; }
  .question-history details { font-size: .76rem; color: var(--muted); margin: 4px 0; }
  .question-history summary { cursor: pointer; font-weight: 700; }
  .resolved-list { margin-top: 13px; display: flex; flex-wrap: wrap; gap: 5px; }
  .resolved-list button { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 9px; font: inherit; font-size: .68rem; cursor: pointer; }
  .revisionbar { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); margin: 9px 0 12px; }
  .revisionbar code { color: var(--code-ink); font-weight: 700; }
  .revisionbar .spacer { flex: 1; }
  .revisionbar .confirmed { color: var(--ok); font-size: .75rem; font-weight: 800; }
  .revisionbar .unconfirmed { color: var(--err); font-size: .75rem; font-weight: 800; }
  .edge-note { display: block; margin-top: 3px; color: var(--muted); font-size: .66rem; font-style: italic; }
  .output-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 8px; margin: 12px 0; }
  .output-card { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-weight: 750; font-size: .82rem; }
  .output-card:hover { border-color: var(--accent); background: var(--highlight); }
  .output-card small { display: block; color: var(--muted); font-weight: 500; margin-top: 3px; }
  @media (max-width: 760px) { .source-summary,.question-context,.output-grid { grid-template-columns: 1fr; } }
  /* generated-paper viewer (center) */
  .paperBtn { width: 100%; margin-top: 8px; border: 1px solid var(--accent); background: var(--highlight); color: var(--accent); font: inherit; font-size: .86rem; font-weight: 700; padding: 10px; border-radius: var(--radius-sm); cursor: pointer; }
  .paperBtn:hover { background: var(--accent); color: #fff; }
  .paperbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 10px; }
  .paperbar .dl { font-size: .78rem; font-weight: 700; color: var(--accent); text-decoration: none; border: 1px solid var(--border); padding: 5px 11px; border-radius: 7px; }
  .paperbar .dl:hover { border-color: var(--accent); background: var(--highlight); }
  .paperframe { width: 100%; height: calc(100vh - 230px); min-height: 460px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
  .logdetails { margin-top: 12px; } .logdetails summary { cursor: pointer; font-size: .8rem; color: var(--muted); font-weight: 700; }
  /* Stage 3: plan confirm + chat */
  .planview { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; margin: 14px 0 10px; }
  .plabel { font-size: .64rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin: 12px 0 5px; }
  .pcontrib { font-size: .92rem; font-weight: 600; color: var(--ink); background: var(--highlight); border-radius: 8px; padding: 9px 11px; }
  .claims { margin: 0 0 4px 16px; font-size: .84rem; color: var(--ink); } .claims li { margin: 3px 0; }
  .secblock { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 11px; margin-bottom: 7px; box-shadow: var(--shadow); }
  .sechead { font-size: .86rem; font-weight: 800; color: var(--ink); }
  .secsum { font-size: .78rem; color: var(--muted); margin: 2px 0 4px; }
  .subs { margin: 0 0 0 16px; font-size: .82rem; color: var(--accent); font-weight: 600; } .subs li { margin: 2px 0; }
  .nosubs { font-size: .74rem; color: var(--muted); font-style: italic; }
  .figgrid { display: flex; flex-direction: column; gap: 9px; }
  .figcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px; box-shadow: var(--shadow); }
  .figcard svg { display: block; }
  .figmeta { font-size: .76rem; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .figmeta .fkind { font-family: ui-monospace, Menlo, monospace; font-size: .58rem; font-weight: 700; text-transform: uppercase; color: var(--accent); background: var(--highlight); padding: 2px 6px; border-radius: 5px; }
  /* Stage 3: claim graph cards */
  .graphgrid { display: flex; flex-direction: column; gap: 9px; }
  .gcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; box-shadow: var(--shadow); }
  .gclaim { font-size: .85rem; font-weight: 800; color: var(--ink); margin-bottom: 5px; }

<script>
const $ = (id) => document.getElementById(id);
let projectDir = null;
let stepIndex = {};

const FIELDS = [
  {key:"journal", label:"연구 프로필", icon:"🎯", composite:true,
   hint:"연구 분야만 필수입니다. Target journal과 저자 정보는 알고 있을 때 추가하세요."},
  {key:"core", label:"기본 목적", icon:"💡", coreform:true,
   hint:"연구 목적(One paragraph)만 필수입니다. Novelty 후보는 알고 있을 때 추가하면 claim graph의 출발점으로 사용합니다."},
  {key:"outline", label:"문서 설계", icon:"🗂️", outlineform:true,
   hint:"모든 항목이 선택입니다. 알고 있는 Method·Result를 적으면 추출과 질문 수를 줄일 수 있고, 비워 두면 업로드 자료와 인터뷰에서 보완합니다."},
  {key:"data", label:"자료 업로드", icon:"📎", dataform:true,
   hint:"실험 결과·측정값·참고자료를 올려주세요. AI가 글을 쓸 때 이 파일들을 근거로 삼습니다. <b>CSV·TXT·DAT</b>는 내용까지, <b>PDF·PNG·XLSX</b>는 파일 존재를 인식합니다. (선택 — 없어도 진행됩니다)"},
];
const inputs = {journal:"", core:"", outline:""};
let dataFiles = [];   // uploaded files under <project>/data/ (+ reference/)
let selectedData = null;  // rel path of the file whose note is open
let current = null;
let diskMode = false;  // existing project with on-disk inputs but no saved UI state
let paperReady = false;  // a compiled paper.pdf exists for this project
let workflowState = null;
let workflowStage = "profile";
let workflowQuestions = [];
let activeQuestionId = null;
let legacyAnswers = {};
let graphRevision = null;
let graphConfirmed = false;
let activeEventSource = null;
let legacyInterviewMode = false;
const FLOW_STAGES = [
  {id:"profile", label:"프로필·목적", aliases:["draft","profile"]},
  {id:"upload", label:"자료 업로드", aliases:["sources_ready","upload"]},
  {id:"extract", label:"자동 추출", aliases:["extracting","extract","sources_extracted","questions_pending"]},
  {id:"questions", label:"에이전트 질문", aliases:["questioning","questions"]},
  {id:"graph", label:"논리 그래프 검토", aliases:["graph_building","graph_review","graph","ready"]},
  {id:"output", label:"문서 생성·다운로드", aliases:["generating","complete","output","failed","interrupted"]},
];

// journal info is structured (fixed fields we always need)
const JSUB = [
  {k:"field",         label:"Author's field",        req:true,  type:"input", ph:"Computational biomechanics"},
  {k:"target",        label:"Target journal(s)",     req:false, type:"list", reorder:true,  ph:"Journal of Biomechanics — https://www.example.com/author-guidelines"},
  {k:"title",         label:"Paper title",           req:false, type:"input", ph:"관상동맥 플라크 파열 위험지표 정의 및 민감도 분석 (비우면 마지막에 AI가 제안)"},
  {k:"authors",       label:"Authors (저자 순서대로)",  req:false, type:"list", reorder:true,  ph:"Jeff Kim"},
  {k:"corresponding", label:"Corresponding author(s)", req:false, type:"list", reorder:false, ph:"Advisor Name"},
  {k:"affiliation",   label:"Affiliation (소속)",     req:false, type:"input", ph:"KAIST, Dept. of Mechanical Engineering"},
];
const JF = {field:"", title:"", affiliation:"", target:[""], authors:[""], corresponding:[""]};

// core message is structured (paragraph + variable-length novelty list + optionals)
const CM = {paragraph:"", sentence:"", keywords:[""], outscope:""};
let novelty = [""];
const NOVELTY_PH = ["ΔPSS가 정적 PSS보다 파열 위험을 더 잘 설명한다",
                    "파열 위험지표에 강도 정규화가 필요하다",
                    "고체 도메인 물성치가 파열 위험에 가장 민감하다"];

// outline = fixed sections, each ONE free-text message (user numbers 1./2. if they want)
const SECTIONS = [
  {key:"introduction", label:"Introduction", req:false},
  {key:"method",       label:"Method",       req:false},
  {key:"result",       label:"Result",       req:false},
  {key:"discussion",   label:"Discussion",   req:false},
  {key:"conclusion",   label:"Conclusion",   req:false},
];
const outlineData = {introduction:"", method:"", result:"", discussion:"", conclusion:""};
const SECTION_PH = {
  introduction: "이 섹션에서 전하고 싶은 메시지를 자유롭게 적어주세요.\n예) 관상동맥 질환 부담 → 파열이 핵심 → 기존 지표의 한계 → 우리 접근",
  method: "Method에서 전하고 싶은 내용을 자유롭게. 소제목을 미리 생각했다면 1. 2. 처럼 줄로 나눠도 됩니다.\n예)\n1. Cost-effective FSI 프레임워크 구성\n2. 환자 맞춤 경계조건 보정\n3. 메쉬·시간 수렴 검증",
  result: "Result에서 전하고 싶은 내용을 자유롭게. (1. 2. 로 나눠도 됨)\n예)\n1. Sobol 민감도: 물성치 > 혈류역학 > 형태 (Fig 3)\n2. ΔPSS가 정적 PSS보다 파열 위험을 잘 설명",
  discussion: "자유롭게.\n예) 결과의 의미·한계, 선행연구와의 비교",
  conclusion: "자유롭게.\n예) 핵심 기여 요약 + 임상적 함의(과대주장 금지)",
};
function secHasContent(secKey) {
  return outlineData[secKey].trim().length > 0;
}
function assembleOutlineMd() {
  // Phase A = numbered claim lines per [Section]; Phase B = the raw message per section.
  const a = [], b = ["## Phase B (structure)"];
  let n = 0;
  for (const sec of SECTIONS) {
    const txt = outlineData[sec.key].trim();
    if (!txt) continue;
    a.push(`[${sec.label}]`);
    b.push(`### ${sec.label}`, txt, "");
    const lines = txt.split("\n")
      .map(x => x.replace(/^\s*\d+[.)]\s*/, "").replace(/^\s*[-*]\s*/, "").trim())
      .filter(Boolean);
    lines.forEach(ln => { n++; a.push(`${n}. ${ln}`); });
    a.push("");
  }
  return a.join("\n") + "\n" + b.join("\n");
}

function isFilled(key) {
  if (key === "journal") return !!JF.field.trim();
  if (key === "core") return !!CM.paragraph.trim();
  if (key === "outline") return SECTIONS.some(s => secHasContent(s.key));
  if (key === "data") return dataFiles.length > 0;  // optional — never gates Create
  return !!inputs[key].trim();
}
function assembleCoreMd() {
  const lines = ["## One paragraph", CM.paragraph, "", "## Novelty"];
  novelty.filter(n => n.trim()).forEach(n => lines.push(`- ${n.trim()}`));
  lines.push("");
  if (CM.sentence.trim()) lines.push("## One sentence", CM.sentence.trim(), "");
  const kw = CM.keywords.filter(k => k.trim()).map(k => k.trim());
  if (kw.length) lines.push("## Keywords", kw.join(", "), "");
  if (CM.outscope.trim()) lines.push("## Out of scope", CM.outscope.trim(), "");
  return lines.join("\n");
}
function assembleJournalMd() {
  const lines = ["## Author's field", JF.field, "", "## Target journals"];
  JF.target.filter(t => t.trim()).forEach((t, i) => lines.push(`${i + 1}. ${t.trim()}`));  // ranked
  lines.push("");
  if (JF.title.trim()) lines.push("## Paper title", JF.title.trim(), "");
  const extra = [];
  const auth = JF.authors.filter(a => a.trim()).map(a => a.trim());
  if (auth.length) extra.push(`- authors: ${auth.join("; ")}`);  // author order preserved
  const corr = JF.corresponding.filter(c => c.trim()).map(c => c.trim());
  if (corr.length) extra.push(`- corresponding author: ${corr.join("; ")}`);
  if (JF.affiliation.trim()) extra.push(`- affiliation: ${JF.affiliation.trim()}`);
  if (extra.length) { lines.push("## Extra info"); lines.push(...extra); }
  return lines.join("\n");
}

async function postJSON(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function getJSONMaybe(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch (_) { return null; }
}
async function postJSONMaybe(url, body) {
  try { return await postJSON(url, body); }
  catch (_) { return null; }
}
function stageFor(raw) {
  const value = String(raw || "").toLowerCase();
  const hit = FLOW_STAGES.find(s => s.id === value || s.aliases.includes(value));
  return hit ? hit.id : "profile";
}
function setWorkflowStage(stage, detail) {
  workflowStage = stageFor(stage);
  renderWorkflowTree(workflowStage, detail);
}
function setProviders(list) {
  const el = $("providers");
  if (list && list.length) { el.textContent = "providers: " + list.join(", "); el.classList.remove("warn"); }
  else { el.textContent = "⚠ API 키 없음 (engine/.env)"; el.classList.add("warn"); }
}

function mkBtn(label, title, disabled, onclick, isRm) {
  const b = document.createElement("button");
  b.className = "obtn" + (isRm ? " rm" : ""); b.textContent = label; b.title = title;

}
function invalidateGraph() {
  if (graphRevision || graphConfirmed) { graphConfirmed = false; graphRevision = null; }
}
function note() { invalidateGraph(); const el = $("savednote"); if (el) el.textContent = "✓ 자동 저장됨"; }

// reusable +row list: ordered (▲▼) when reorder=true, removable (✕) when >1 item
function renderList(box, arr, getPh, reorder) {
  if (!box) return;
  box.innerHTML = "";
  arr.forEach((val, i) => {
    const row = document.createElement("div"); row.className = "nrow";
    const num = document.createElement("span"); num.className = "nnum"; num.textContent = (i + 1) + ".";
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "sfinput"; inp.value = val; inp.placeholder = getPh(i);
    inp.oninput = () => { arr[i] = inp.value; renderNav(); refreshStep0(); note(); };
    row.append(num, inp);
    if (reorder) {
      row.append(
        mkBtn("▲", "위로", i === 0, () => { [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; renderList(box, arr, getPh, reorder); }),
        mkBtn("▼", "아래로", i === arr.length - 1, () => { [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; renderList(box, arr, getPh, reorder); }),
      );
    }
    if (arr.length > 1) {
      row.append(mkBtn("✕", "삭제", false, () => { arr.splice(i, 1); renderList(box, arr, getPh, reorder); renderNav(); refreshStep0(); }, true));
    }
    box.appendChild(row);
  });
}

function renderNoveltyRows() {
  const box = $("noveltyList"); if (!box) return;
  box.innerHTML = "";
  novelty.forEach((val, i) => {
    const row = document.createElement("div"); row.className = "nrow";
    const num = document.createElement("span"); num.className = "nnum"; num.textContent = (i+1) + ".";

// ---------- right tree: stable six-stage journey ----------
function renderStep0() { renderWorkflowTree(workflowStage); }
function renderWorkflowTree(stage, detail) {
  const ul = $("steps"); if (!ul) return;
  const active = Math.max(0, FLOW_STAGES.findIndex(s => s.id === stageFor(stage)));
  stepIndex = {};
  ul.innerHTML = FLOW_STAGES.map((s, i) => {
    const done = i < active || (s.id === "output" && paperReady);
    const cls = done ? "done" : (i === active ? "active" : "locked");
    const mark = done ? "✓" : String(i + 1);
    const status = done ? "완료" : (i === active ? (detail || "진행 중") : "대기");
    return `<li class="step ${cls}" data-flow="${s.id}"><span class="node">${mark}</span>
      <span class="meta"><span class="k">STEP ${i + 1}</span><span class="t">${s.label}</span><span class="s">${esc(status)}</span></span></li>`;
  }).join("");
  FLOW_STAGES.forEach(s => { stepIndex[s.id] = ul.querySelector(`[data-flow="${s.id}"]`); });
}
function refreshStep0() {
  const allCore = !!(JF.field.trim() && CM.paragraph.trim());
  if (workflowStage === "profile" || workflowStage === "upload") {
    const nextStage = allCore && dataFiles.length ? "upload" : "profile";
    renderWorkflowTree(nextStage, allCore ? `${dataFiles.length}개 파일` : "필수 입력 확인");
  }
  $("createBtn").disabled = diskMode ? false : !allCore;
}

async function startExtraction() {
  setWorkflowStage("extract", "추출 시작");
  logLines = [];
  $("dock").style.display = "none";
  $("canvas").innerHTML = `<div class="stage-kicker"><span class="num">3</span><span class="name">자동 추출</span></div>
    <h2 class="title serif">자료를 읽고 논리 구조를 찾는 중입니다</h2>
    <div class="ehint">파일별 출처를 보존하면서 주장·근거·방법·데이터와 저자에게 확인할 질문을 분리합니다.</div>
    <div class="source-summary"><div class="source-stat"><b>${dataFiles.length}</b><span>업로드 파일</span></div>
      <div class="source-stat"><b>—</b><span>추출 노드</span></div><div class="source-stat"><b>—</b><span>확인 질문</span></div></div>
    <div class="card"><h3>추출 진행 <span class="badge">running</span></h3><div class="log" id="logbox">작업을 시작합니다…</div></div>`;

  const res = await postJSONMaybe("/api/projects/extract", {project_dir: projectDir});
  if (!res) { await runDiagnose(); return; }
  if (res.error) { showExtractionError(res.error, res.retryable !== false); return; }
  if (res.ok === false) {
    showExtractionError("지원되는 텍스트·CSV·JSON·PDF·XLSX 자료를 찾지 못했습니다.", false); return;
  }
  if (res.questions || res.items || res.question) { renderQuestions(res); return; }
  if (res.graph || res.nodes) { await showGraphReview(res); return; }
  if (!res.job_id) { await loadQuestionsOrPlan(); return; }

  const streamUrl = res.stream_url || `/api/projects/extract/${encodeURIComponent(res.job_id)}/stream`;
  listenToJob(streamUrl, "extract");
}
function listenToJob(url, kind) {
  if (activeEventSource) activeEventSource.close();
  const es = new EventSource(url); activeEventSource = es;
  es.onmessage = async (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    const type = m.type || m.event;
    if (["progress","step_started","artifact_saved"].includes(type)) {
      logLine(m.raw || m.message || m.label || type);
      setWorkflowStage(kind === "generate" ? "output" : "extract", m.label || m.message || "진행 중");
    } else if (type === "questions_ready" || type === "waiting_for_user") {
      es.close(); activeEventSource = null; await loadQuestionsOrPlan(m);
    } else if (type === "graph_ready" || type === "plan_ready") {
      es.close(); activeEventSource = null;
      // A newly built graph can create interview questions; enforce that gate first.
      if (type === "plan_ready") await loadQuestionsOrPlan(m);
      else await loadQuestionsOrPlan(m);
    } else if (["done","job_completed"].includes(type)) {
      es.close(); activeEventSource = null;
      if (kind === "generate") { paperReady = true; $("paperBtn").style.display = ""; markAllDone(); showPaper(m); }
      else await loadQuestionsOrPlan(m);
    } else if (["error","job_failed"].includes(type)) {
      es.close(); activeEventSource = null;
      if (kind === "generate") showGenerationError(m.error || m.message || "문서 생성에 실패했습니다.", m.retryable !== false);
      else showExtractionError(m.error || m.message || "작업에 실패했습니다.", m.retryable !== false);
    }
  };
  es.onerror = () => {
    es.close(); activeEventSource = null;
    if (kind === "generate") showGenerationError("연결이 끊겼습니다. 승인된 그래프에서 생성을 다시 시도할 수 있습니다.", true);
    else showExtractionError("연결이 끊겼습니다. 저장된 상태에서 다시 이어갈 수 있습니다.", true);
  };
}
function showGenerationError(message, retryable) {
  setWorkflowStage("output", "재시도 가능");
  showStatus("중단됨", "문서 생성", message, "warn");
  $("canvas").insertAdjacentHTML("beforeend", `<div class="stage-actions">
    ${retryable ? '<button class="send" id="retryGenerate">생성 다시 시도</button>' : ''}
    <button class="send secondary" id="backGraph">승인된 그래프 보기</button></div>`);
  if ($("retryGenerate")) $("retryGenerate").onclick = startGenerate;
  $("backGraph").onclick = loadGraphOrPlan;
}
function showExtractionError(message, retryable) {
  setWorkflowStage("extract", "재시도 가능");
  showStatus("중단됨", "자동 추출", message, "warn");
  $("canvas").insertAdjacentHTML("beforeend", `<div class="stage-actions">
    ${retryable ? '<button class="send" id="retryExtract">다시 시도</button>' : ''}
    <button class="send secondary" id="backSources">자료 확인</button></div>`);
  if ($("retryExtract")) $("retryExtract").onclick = startExtraction;
  $("backSources").onclick = () => openField("data");
}
async function loadQuestionsOrPlan(seed) {
  const q = await getJSONMaybe(`/api/projects/questions?project_dir=${encodeURIComponent(projectDir)}`);
  if (q && !q.error && ((q.questions || q.items || []).length || q.question || q.pending_count != null)) {
    legacyInterviewMode = false; renderQuestions(q);
  }
  else if (seed && (seed.questions || seed.items || seed.question)) renderQuestions(seed);
  else {
    const graph = await getJSONMaybe(`/api/projects/graph?project_dir=${encodeURIComponent(projectDir)}`);
    if (graph && !graph.error) await showGraphReview(graph);
    else await startPlan();
  }
}

// ---------- questions ----------
const _UNKNOWN = "(모름 — 나중에 보완)";
const _NOT_APPLICABLE = "(해당 없음)";
function normalizeQuestions(payload) {
  const rows = Array.isArray(payload) ? payload : (payload.questions || payload.pending_questions || payload.items || (payload.question ? [payload.question] : []));
  const normalized = rows.map((q, i) => {
    const rawStatus = String(q.status || (q.answer ? "resolved" : "pending")).toLowerCase();
    return ({...q,
    id: String(q.id || q.field || `Q${i + 1}`),
    field: String(q.field || q.id || `Q${i + 1}`),
    question: q.question || q.text || q.followup_question || "추가 확인이 필요합니다.",
    why: q.why || q.why_it_matters || q.reason || "이 답변은 주장과 근거의 연결을 검증하는 데 필요합니다.",
    provenance: q.provenance || q.source || q.paper_says || (q.target_node_id ? `그래프 노드 ${q.target_node_id} · revision ${q.created_revision || "-"}` : "자동 추출 결과"),
    risk: String(q.risk || q.reviewer_risk || "medium").toLowerCase(),
    status: rawStatus === "complete" ? "resolved" : rawStatus,
    answer_event_id: q.answer_event_id || null,
    history: q.history || q.turns || [],
  });});
  const byId = Object.fromEntries(normalized.map(q => [q.id, q]));
  for (const a of (payload.answers || [])) {
    const id = String(a.question_id || a.id || ""); if (!id || byId[id]) continue;
    const prior = workflowQuestions.find(q => q.id === id);
    byId[id] = {
      ...(prior || {}), id, field:id,
      question:(prior && prior.question) || `완료된 질문 ${id}`,
      why:(prior && prior.why) || "이 답변은 그래프에 반영되었습니다.",
      provenance:(prior && prior.provenance) || (a.target_node_id ? `그래프 노드 ${a.target_node_id}` : "저자 답변"),
      risk:(prior && prior.risk) || "medium",
      status:a.completion === "unknown" ? "unknown" : "resolved",
      answer_event_id:a.id || null,
      answer:a.text || "", history:[...((prior && prior.history) || []), {role:"author",content:a.text || a.completion}],
    };
  }
  return Object.values(byId);
}

function graphToProposal(payload) {
  if (payload.proposal) return payload.proposal;
  const raw = payload.graph || payload.claim_graph || payload;
  if (Array.isArray(raw)) return {...payload, graph:raw};
  const nodes = raw.nodes || payload.nodes || [], edges = raw.edges || payload.edges || [];
  const byId = Object.fromEntries(nodes.filter(n => n && n.id).map(n => [n.id,n]));
  const claims = nodes.filter(n => n.kind === "claim");
  const children = {};
  claims.forEach(c => { if (c.parent_id) (children[c.parent_id] ||= []).push(c); });
  const mains = claims.filter(c => !c.parent_id).length ? claims.filter(c => !c.parent_id) : claims;
  const supportFor = (claim) => {
    const out = {evidence:[], methods:[], data:[], figures:[], refs:[], edges:[]};
    const connected = edges.filter(e => e.dst === claim.id || e.src === claim.id);
    connected.forEach(e => {
      const other = byId[e.src === claim.id ? e.dst : e.src]; if (!other) return;
      const item = {id:other.id,text:other.text,rationale:e.rationale,rel:e.rel};
      if (other.kind === "evidence") out.evidence.push(item);
      else if (other.kind === "method") out.methods.push(item);
      else if (other.kind === "data") out.data.push(item);
      else if (other.kind === "artifact") out.figures.push(item);
      else if (["source","warrant"].includes(other.kind)) out.refs.push(item);
      out.edges.push(e);
    });
    return out;
  };
  return {
    ...payload,
    main_contribution: payload.main_contribution || raw.main_contribution || "",
    claims: claims.map(c => ({id:c.id,text:c.text})),
    graph: mains.map(m => ({claim:{id:m.id,text:m.text}, subclaims:[m,...(children[m.id] || [])].map(c => ({id:c.id,text:c.text,...supportFor(c)}))})),
    figures: payload.figures || nodes.filter(n => n.kind === "artifact").map(n => ({id:n.id,kind:n.represented_as,message:n.text,section:n.section})),
    structure: payload.structure || {}, sections: payload.sections || [],
  };
}

  $("canvas").innerHTML = `<div class="stage-kicker"><span class="num">6</span><span class="name">문서 생성·다운로드</span></div>
    <h2 class="title serif">승인된 그래프로 문서를 생성하고 있습니다</h2>
    <div class="card"><h3>문서 생성 <span class="badge">running</span></h3>
    <p class="muted">본문 작성·논리 검증·citation·출력 순서로 진행합니다. 실패해도 승인된 그래프는 유지됩니다.</p>
    <div class="log" id="logbox"></div></div>`;
  const res = await postJSON("/api/projects/generate", {project_dir: projectDir});
  if (res.error === "unanswered_questions") {  // hard gate (server-side backstop)
    showStatus("미응답", "생성 차단", `아직 응답하지 않은 질문 ${ (res.pending||[]).length }개가 있어요. 모두 답하거나 '모름'을 눌러주세요.`, "warn");
    loadQuestionsOrPlan();
    return;
  }
  if (res.error) {
    if (["graph_not_confirmed","stale_or_missing_graph","no_plan"].includes(res.error)) {
      graphConfirmed = false;
      chatHistory.push({role:"assistant",content:"서버의 최신 그래프 승인이 필요합니다. 그래프를 다시 확인해 주세요."});
      await loadGraphOrPlan();
    } else showGenerationError(res.error, res.retryable !== false);
    return;
  }
  renderPipeline(res.steps);
  if (res.job_id) listenToJob(res.stream_url || `/api/projects/generate/${encodeURIComponent(res.job_id)}/stream`, "generate");
  else if (res.done || res.complete) { paperReady = true; showPaper(res); }
}

// ---------- generated-paper viewer (center = the produced journal) ----------
function paperUrl(kind) {
  return `/api/projects/paper?project_dir=${encodeURIComponent(projectDir)}&kind=${kind}&t=${Date.now()}`;
}
function downloadUrl(kind) {
  if (kind === "pdf" || kind === "tex") return paperUrl(kind);
  return `/api/projects/download?project_dir=${encodeURIComponent(projectDir)}&kind=${encodeURIComponent(kind)}`;
}
async function showPaper(meta) {
  meta = meta || {};
  if (!Array.isArray(meta.outputs)) {
    const outputState = await getJSONMaybe(`/api/projects/outputs?project_dir=${encodeURIComponent(projectDir)}`);
    meta.outputs = (outputState && outputState.outputs) || [];
  }
  const outputNames = new Set(meta.outputs.map(x => x.name));
  const hasPdf = meta.pdf_ready === true || outputNames.has("paper.pdf");
  setWorkflowStage("output", "완료");
  const toks = (meta.input_tokens != null) ? `<div class="toks">
      <span>input <b>${meta.input_tokens.toLocaleString()}</b></span>
      <span>output <b>${meta.output_tokens.toLocaleString()}</b></span>
      <span>cached <b>${meta.cached_tokens.toLocaleString()}</b> (${Math.round((meta.cache_hit_rate||0)*100)}%)</span>
    </div>` : "";
  const cls = meta.classification ? `<span class="muted">분류 <b>${meta.classification}</b></span>` : "";
  const log = logLines.length ? `<details class="logdetails"><summary>실행 로그</summary><div class="log">${esc(logLines.join("\n"))}</div></details>` : "";
  $("canvas").innerHTML = `<div class="stage-kicker"><span class="num">6</span><span class="name">문서 생성·다운로드</span></div>
    <h2 class="title serif">${esc(JF.title || wtitleText())}</h2>
    <div class="paperbar">
      <span class="badge ${hasPdf ? "ok" : ""}">${hasPdf ? "PDF" : "LaTeX"}</span>${cls}
      <span class="muted">Graph revision <b>${esc(String(graphRevision || "saved"))}</b></span>
    </div>
    <div class="output-grid">
      ${hasPdf ? `<a class="output-card" href="${downloadUrl('pdf')}" target="_blank">PDF<small>완성 원고 보기</small></a>` : ""}
      <a class="output-card" href="${downloadUrl('tex')}" target="_blank">LaTeX<small>편집 가능한 소스</small></a>
      <a class="output-card" href="${downloadUrl('graph')}" target="_blank">논리 그래프<small>주장·근거 JSON</small></a>
      <a class="output-card" href="${downloadUrl('audit')}" target="_blank">검증 보고서<small>논리 감사 JSON</small></a>
      <a class="output-card" href="${downloadUrl('zip')}" target="_blank">전체 ZIP<small>그래프·근거·원고 묶음</small></a>
    </div>${toks}
    ${hasPdf ? `<iframe class="paperframe" src="${paperUrl('pdf')}#view=FitH" title="generated paper"></iframe>` : `<div class="card"><p class="muted">이 배포 환경에는 LaTeX PDF 엔진이 없어 편집 가능한 .tex와 전체 ZIP을 제공합니다.</p></div>`}
    ${log}<div class="stage-actions"><button class="send secondary" id="returnGraph">그래프로 돌아가기</button></div>`;
  $("returnGraph").onclick = loadGraphOrPlan;
}
function wtitleText() { const el = $("wtitle"); return el ? el.textContent : "Manuscript"; }

// ---------- data files (experiment data / references) ----------
function fmtSize(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+" MB" : n >= 1e3 ? Math.round(n/1e3)+" KB" : (n||0)+" B"; }
async function loadDataFiles() {
  if (!projectDir) { dataFiles = []; return; }
  try {
    const r = await (await fetch("/api/projects/files?project_dir=" + encodeURIComponent(projectDir))).json();
    dataFiles = r.files || [];
  } catch { dataFiles = []; }
  renderFileList(); renderNotePanel(); renderNav(); refreshStep0();
}
async function uploadFiles(fileList) {
  if (!projectDir) return;
  const fd = new FormData();
  fd.append("project_dir", projectDir);
  for (const f of fileList) fd.append("files", f);
  const nt = $("savednote"); if (nt) nt.textContent = "업로드 중…";
  try {
    const r = await fetch("/api/projects/upload", {method:"POST", body: fd});
    if (!r.ok) throw new Error("HTTP " + r.status);
    invalidateGraph();
    if (nt) nt.textContent = "✓ 업로드됨";
  } catch (e) { if (nt) nt.textContent = "업로드 실패: " + e; }
  await loadDataFiles();
}
async function deleteDataFile(rel) {
  if (!projectDir) return;
  await postJSON("/api/projects/files/delete", {project_dir: projectDir, rel});
  invalidateGraph();
  await loadDataFiles();
}
function renderFileList() {
  const box = $("filelist"); if (!box) return;
  box.innerHTML = "";
  if (!dataFiles.length) { box.innerHTML = `<div class="fl-empty">아직 업로드된 파일이 없습니다.</div>`; return; }
  dataFiles.forEach(f => {
    const row = document.createElement("div");
    row.className = "frow" + (f.rel === selectedData ? " sel" : "") + (f.note ? " noted" : "");
    row.title = "클릭하면 오른쪽에 설명을 적을 수 있어요";
    const cols = (f.columns && f.columns.length) ? ` · ${f.columns.length} cols` : "";
    row.innerHTML = `<span class="fkind">${esc(f.kind || "file")}</span>
      <span class="fname">${esc(f.name)}</span>
      <span class="fmeta">${esc(fmtSize(f.size) + cols)}</span>`;
    row.onclick = () => selectData(f.rel);
    row.appendChild(mkBtn("✕", "삭제", false,
      (e) => { e.stopPropagation(); deleteDataFile(f.rel); }, true));
    box.appendChild(row);
  });
}
function selectData(rel) {
  selectedData = rel;
  renderFileList();
  renderNotePanel();
  const ta = $("noteTa"); if (ta) ta.focus();
}
function renderNotePanel() {
  const box = $("notepanel"); if (!box) return;
  const f = dataFiles.find(x => x.rel === selectedData);
  if (!f) {
    box.innerHTML = `<div class="np-empty">왼쪽에서 파일을 클릭하면<br>여기에 그 파일이 무엇인지<br>자유롭게 적을 수 있어요.</div>`;
    return;
  }
  const cols = (f.columns && f.columns.length) ? ` · ${f.columns.join(", ")}` : "";
  box.innerHTML = `<div class="np-head"><span class="fkind">${esc(f.kind || "file")}</span>
      <span class="np-name">${esc(f.name)}</span></div>
    <div class="np-sub">${esc(f.rel + cols)}</div>
    <textarea class="np-ta" id="noteTa"
      placeholder="이 파일이 무엇인지 자유롭게 적어주세요.\n예) VI=2 하중조건에서 그룹별 1차/전체 Sobol 민감도.\nResult 섹션의 '물성치가 가장 민감' 주장 근거(Fig 3)."></textarea>`;
  const ta = $("noteTa");
  ta.value = f.note || "";
  ta.oninput = () => { f.note = ta.value; };          // keep locally so re-renders don't lose it
  ta.onchange = () => saveNote(f.rel, ta.value);      // persist on blur
}
async function saveNote(rel, note) {
  const f = dataFiles.find(x => x.rel === rel); if (f) f.note = note;
  invalidateGraph();
  renderFileList();  // refresh the "noted" marker
  try {
    await postJSON("/api/projects/files/note", {project_dir: projectDir, rel, note});
    const nt = $("savednote"); if (nt) nt.textContent = "✓ 설명 저장됨";
  } catch (e) { const nt = $("savednote"); if (nt) nt.textContent = "설명 저장 실패: " + e; }
}

// ---------- structured UI state (lossless reopen) ----------
function uiState() { return {JF, CM, novelty, outlineData}; }
function resetState() {
  legacyInterviewMode = false;
  Object.assign(JF, {field:"", title:"", affiliation:"", target:[""], authors:[""], corresponding:[""]});
  Object.assign(CM, {paragraph:"", sentence:"", outscope:""}); CM.keywords = [""];
  novelty = [""];
  SECTIONS.forEach(s => outlineData[s.key] = "");
}
function restoreState(st) {
  if (!st) { resetState(); return; }
  Object.assign(JF, st.JF || {});
  ["target", "authors", "corresponding"].forEach(k => { if (!Array.isArray(JF[k]) || !JF[k].length) JF[k] = [""]; });
  Object.assign(CM, st.CM || {});
  if (!Array.isArray(CM.keywords) || !CM.keywords.length) CM.keywords = [""];
  novelty = (st.novelty && st.novelty.length) ? st.novelty : [""];
  SECTIONS.forEach(s => {
    const v = (st.outlineData || {})[s.key];
    // tolerate old format ([{heading,intent}]) by flattening to text
    outlineData[s.key] = typeof v === "string" ? v
      : Array.isArray(v) ? v.map(o => [o.heading, o.intent].filter(Boolean).join(" — ")).filter(Boolean).join("\n")
      : "";
  });
}

// ---------- dashboard ----------
function ddlInfo(deadline) {
  if (!deadline) return {cls:"none", label:"마감 미정"};
  const days = Math.ceil((new Date(deadline) - new Date()) / 86400000);
  const cls = days <= 14 ? "soon" : days <= 45 ? "mid" : "far";
  return {cls, label: days >= 0 ? `D-${days}` : `D+${-days}`};
}
function statusLabel(s) { return s === "done" ? "완료" : s === "active" ? "작업 중" : "신규"; }

async function loadProjects() {
  const r = await (await fetch("/api/projects/list")).json();
  setProviders(r.providers);
  const g = $("pgrid"); g.innerHTML = "";
  (r.projects || []).forEach(p => {
    const card = document.createElement("div"); card.className = "pcard";
    const dd = ddlInfo(p.deadline);
    card.innerHTML = `<div class="ptop"><span class="pic">${esc((p.title || p.name || 'P').trim()[0] || 'P')}</span>
        <div><h3 class="pt serif">${esc(p.title || p.name)}</h3><div class="pmeta">${esc(p.field || p.name)}</div></div>
        <span class="ptag ${p.status}">${statusLabel(p.status)}</span></div>
      <div class="prog"><div class="pl"><span class="pct">${Number(p.progress) || 0}%</span><span class="stp">${esc(p.step)}</span></div>
      <div class="bar"><span style="width:${p.progress}%"></span></div></div>
      <div class="pfoot"><span class="ddl ${dd.cls}">${esc(dd.label)}</span><span class="nx">${esc(p.name)}</span></div>`;
    card.onclick = () => openExisting(p.project_dir, p.title || p.name);
    g.appendChild(card);
  });
  const nc = document.createElement("div"); nc.className = "newcard";
  nc.innerHTML = `<div><div class="plus">＋</div><div>새 프로젝트</div></div>`;
  nc.onclick = openNewModal;
  g.appendChild(nc);
}
function showDashboard() {
  document.body.classList.add("dash");
  $("backBtn").style.display = "none"; $("wtitle").style.display = "none";
  loadProjects();
}
function enterWorkspace(dir, title) {
  projectDir = dir;
  document.body.classList.remove("dash");
  $("backBtn").style.display = ""; $("wtitle").style.display = "";
  $("wtitle").textContent = title || dir.split("/").pop();
  $("dock").style.display = "none";
  dataFiles = []; selectedData = null;
  $("paperBtn").style.display = paperReady ? "" : "none";  // show only if a paper exists
  workflowStage = paperReady ? "output" : "profile";
  renderNav(); renderStep0();
  if (paperReady) showPaper({}); else openField("journal");  // workflow state may replace this after load
  loadDataFiles();  // populate the data-panel dot from disk
  if (diskMode) {
    $("createBtn").disabled = false; $("createBtn").textContent = "자동 추출 시작 (저장된 입력)";
    showStatus("기존 입력", "기존 프로젝트", "이 프로젝트는 저장된 입력 파일이 있어요. 폼은 비어 보여도 디스크 입력으로 진단/생성합니다.");
  } else {
    $("createBtn").textContent = "자료 추출 시작 →";
  }
}
async function openExisting(dir, title) {
  const r = await (await fetch("/api/projects/state?project_dir=" + encodeURIComponent(dir))).json();
  diskMode = !r.ui_state;
  paperReady = !!r.paper_ready;
  restoreState(r.ui_state);
  enterWorkspace(dir, title);
  await resumeWorkflow();
}
async function resumeWorkflow() {
  const state = await getJSONMaybe(`/api/projects/workflow/state?project_dir=${encodeURIComponent(projectDir)}`);
  if (!state) return;  // old server: the legacy state/paper flow remains active
  workflowState = state.workflow ? {...state, ...state.workflow} : state;
  const stage = stageFor(workflowState.stage || workflowState.status);
  const rawStatus = String(workflowState.status || workflowState.stage || "").toLowerCase();
  workflowStage = stage;
  graphRevision = workflowState.graph_revision || graphRevision;
  graphConfirmed = !!(workflowState.graph_confirmed || (workflowState.confirmed_graph_revision && workflowState.confirmed_graph_revision === graphRevision));
  if (workflowState.paper_ready != null) paperReady = !!workflowState.paper_ready;
  renderWorkflowTree(stage, workflowState.message || workflowState.step_label);
  if (["failed","interrupted"].includes(rawStatus)) {
    const msg = workflowState.error || workflowState.last_error || workflowState.message || "이전 작업이 중단되었습니다.";
    const last = String(workflowState.last_stage || workflowState.failed_stage || "").toLowerCase();
    if (last.includes("generat") || last.includes("output") || last.includes("write") || workflowState.confirmed_graph_revision) showGenerationError(msg, true);
    else showExtractionError(msg, true);
  } else if (["questions","questioning"].includes(stage) || ["questions_pending","waiting_for_user"].includes(workflowState.stage)) {
    const q = await getJSONMaybe(`/api/projects/questions?project_dir=${encodeURIComponent(projectDir)}`);
    if (q) renderQuestions(q);
  } else if (stage === "graph") await loadGraphOrPlan();
  else if (stage === "extract" && rawStatus === "sources_extracted") await loadQuestionsOrPlan();
  else if (stage === "upload") openField("data");
  else if (stage === "output" && paperReady) showPaper(workflowState);
  else if (["extract","output"].includes(stage) && workflowState.active_job_id) {
    const eventKind = stage === "output" ? "generate" : "extract";
    const routeKind = workflowState.job_kind || (stage === "output" ? "generate" : "plan");
    const stream = workflowState.stream_url || `/api/projects/${routeKind}/${encodeURIComponent(workflowState.active_job_id)}/stream`;
    listenToJob(stream, eventKind);
  }
}
$("paperBtn").onclick = () => showPaper({});
function openNewModal() { $("np_name").value = ""; $("np_deadline").value = ""; $("newModal").classList.add("show"); }
$("newBtn").onclick = openNewModal;
$("np_cancel").onclick = () => $("newModal").classList.remove("show");
$("np_create").onclick = async () => {
  const name = $("np_name").value.trim(); if (!name) return;
  const today = new Date().toISOString().slice(0, 10);
  const r = await postJSON("/api/projects/create", {name, deadline: $("np_deadline").value, created: today});
  $("newModal").classList.remove("show");
  diskMode = false; paperReady = false; resetState();
  enterWorkspace(r.project_dir, name);
};
$("backBtn").onclick = showDashboard;

// ---------- init ----------
showDashboard();
</script>
</body>
</html>
